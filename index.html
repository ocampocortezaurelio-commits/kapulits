     Babel standalone + Tailwind CDN compilan en runtime (arranque mas lento y

<style>
  :root{
    --bg:#f6efe6;
    --bg-soft:#fbf6ef;
    --surface:#fffaf4;
    --surface-strong:#fff7ee;
    --surface-muted:#f2e7da;
    --line:#ead9c7;
    --line-strong:#ddc0a1;
    --text:#2d170b;
    --text-soft:#795743;
    --text-muted:#a5816b;
    --brand:#d76516;
    --brand-strong:#b94c0e;
    --brand-soft:#f2bf5a;
    --brand-glow:#f4d57a;
    --danger:#ca4d2c;
    --success:#2d8b57;
    --info:#4876a8;
    /* Acentos derivados de la grafica del Combo (chile, oro, guinda).
       Uso conservador: acentos por categoria y familias de accion. */
    --chile:#c2321a;
    --gold:#e8a91e;
    --guinda:#7b1e0c;
    --shadow:0 20px 45px rgba(88,42,10,.10);
    --shadow-soft:0 8px 24px rgba(88,42,10,.08);
  }
  *{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
  body{
    margin:0;padding:0;
    background:
      radial-gradient(circle at top, rgba(244,213,122,.35), transparent 36%),
      linear-gradient(180deg, #e07018 0%, #c85816 22%, var(--bg) 22%, var(--bg) 100%);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    overscroll-behavior:none;
    transition:background .4s ease
  }
  body.loaded{
    background:
      radial-gradient(circle at top, rgba(244,213,122,.28), transparent 34%),
      linear-gradient(180deg, #df7018 0%, #cb5a17 19%, var(--bg) 19%, var(--bg) 100%);
  }
  #root{
    max-width:430px;margin:0 auto;min-height:100vh;position:relative;
    background:transparent;
    transition:background .4s ease
  }
  #root.loaded{background:transparent}
  .safe-top{padding-top:env(safe-area-inset-top,0px)}
  .safe-bottom{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 80px)}
  .bottom-nav{padding-bottom:env(safe-area-inset-bottom,0px)}
  ::-webkit-scrollbar{display:none}
  .slide-up{animation:slideUp .25s cubic-bezier(.16,1,.3,1)}
  @keyframes slideUp{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
  .fade-in{animation:fadeIn .2s ease-out}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .pulse-dot{animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .card-press{transition:transform .1s ease}
  .card-press:active{transform:scale(.97)}
  /* ── SISTEMA TIPOGRAFICO UNICO (toda la app) ─────────────────────────
     Regla de MAYUSCULAS: solo los kickers/etiquetas van en MAYUSCULAS con
     tracking. TODO lo demas va en formato de oracion (sentence case).
     t-screen  22/900  Titulo de pantalla (TopBar)         oracion
     t-title   18/900  Titulo de seccion / tarjeta         oracion
     t-kicker  11/800  Etiqueta de seccion  MAYUSCULAS .14em
     t-metric  28/900  Cifra grande (dinero/conteo)        tabular
     t-subtitle 14/700 Nombre de item / subtitulo          oracion
     t-body    13/500  Texto interno / parrafo             oracion
     t-caption 11/600  Metadato / nota secundaria          oracion
     t-price   15/900  Precio en linea                     tabular
     t-btn     14/700  Etiqueta de boton                   oracion
     t-badge   11/700  Texto de badge                      oracion            */
  .t-screen{font-size:22px;font-weight:900;letter-spacing:-.02em;line-height:1.15}
  .t-kicker{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted)}
  .t-title{font-size:18px;font-weight:900;letter-spacing:-.01em;line-height:1.2}
  .t-metric{font-size:28px;font-weight:900;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
  .t-subtitle{font-size:14px;font-weight:700;line-height:1.3}
  .t-body{font-size:13px;font-weight:500;line-height:1.45}
  .t-caption{font-size:11px;font-weight:600;line-height:1.35;color:var(--text-muted)}
  .t-price{font-size:15px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .t-btn{font-size:14px;font-weight:700;letter-spacing:0}
  .t-badge{font-size:11px;font-weight:700;letter-spacing:.01em}
  /* Encabezado de seccion del menu (Combos/Platillos/Bebidas): mismo color/tamaño/tipografia */
  .t-menuhead{font-size:13px;font-weight:800;letter-spacing:.2em;line-height:1.8;text-transform:uppercase;text-align:center;color:var(--chile)}
  /* MAYUSCULAS en TODO el modal de Nuevo pedido. El selector *-descendiente
     gana a la preflight de Tailwind (button{text-transform:none}). */
  .menu-upper *{text-transform:uppercase}
  /* ── BOTON DE PRODUCTO: contraste + motion (estilo Emil Kowalski) ── */
  .prod-btn{
    position:relative;background:var(--surface);
    border:1.5px solid var(--line-strong);
    box-shadow:0 6px 18px rgba(120,60,15,.13);
    transition:transform .2s cubic-bezier(.34,1.4,.5,1),box-shadow .2s ease,border-color .15s ease,background-color .15s ease;
    will-change:transform;
  }
  .prod-btn:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 16px 32px rgba(120,60,15,.22);border-color:var(--brand)}
  .prod-btn:active{transform:scale(.97)}
  /* Seleccionado: NO cambia el color base (alternado); gana aro + escala + crece texto. */
  .prod-btn.is-selected{
    box-shadow:0 0 0 3px var(--brand),0 12px 26px rgba(215,101,22,.30);
    transform:scale(1.05);
  }
  .prod-btn.is-selected:hover{transform:translateY(-2px) scale(1.06)}
  .prod-btn .prod-name{transition:font-size .2s ease}
  .prod-btn.is-selected .prod-name{font-size:1.06em}
  @media(prefers-reduced-motion:reduce){
    .prod-btn,.prod-btn:hover,.prod-btn.is-selected,.prod-btn.is-selected:hover{transform:none;transition:box-shadow .15s ease,border-color .15s ease}
    .prod-btn.is-selected .prod-name{font-size:1em}
  }
  .skeleton{animation:shimmer 1.5s infinite;background:linear-gradient(90deg,#f5ede3 25%,#eadfce 50%,#f5ede3 75%);background-size:200% 100%}
  @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
  .app-shell{padding:14px 14px 0}
  @media(min-width:768px){
    #root{max-width:100%}
    .app-shell{padding:20px 32px 0;max-width:960px;margin:0 auto}

    .desktop-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}

  }
  @media(min-width:1024px){
    .app-shell{padding:24px 48px 0;max-width:1100px}
    .desktop-grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
  }
  .surface-card{
    background:linear-gradient(180deg, rgba(255,250,244,.98), rgba(255,247,238,.96));
    border:1px solid rgba(221,192,161,.58);
    box-shadow:var(--shadow-soft);
    border-radius:24px;

  .surface-card-strong{
    background:linear-gradient(180deg, rgba(255,248,238,.98), rgba(246,233,217,.96));
    border:1px solid rgba(221,192,161,.7);
    box-shadow:var(--shadow);
    border-radius:26px;
  }
  .brand-panel{
    background:
      radial-gradient(circle at top center, rgba(244,213,122,.45), transparent 42%),
      linear-gradient(145deg, #7b2808 0%, #a33a0c 18%, #cb5612 45%, #e07a1b 82%, #f0bd57 100%);
    color:#fff7ef;
    box-shadow:0 24px 50px rgba(114,39,8,.28);
    border:1px solid rgba(255,224,181,.18);
    border-radius:30px;
    position:relative;
    overflow:hidden;
  }
  .brand-panel::after{
    content:"";
    position:absolute;inset:0;
    background:
      linear-gradient(135deg, rgba(255,255,255,.06) 0%, transparent 45%),
      radial-gradient(circle at bottom right, rgba(255,231,164,.18), transparent 30%);
    pointer-events:none;
  }
  /* section-kicker/section-title son alias canonicos del sistema (== .t-kicker / .t-title) */
  .section-kicker{
    color:var(--text-muted);
    font-size:11px;
    font-weight:800;
    letter-spacing:.14em;
    text-transform:uppercase;
    line-height:1.3;
  }
  .section-title{
    color:var(--text);
    font-size:18px;
    font-weight:900;
    letter-spacing:-.01em;
    line-height:1.2;
  }
  /* Movimiento tactil reutilizable (hover levanta, press hunde). Spring corto. */
  .tap{transition:transform .18s cubic-bezier(.34,1.4,.5,1),box-shadow .2s ease,filter .15s ease;will-change:transform}
  .tap:hover{transform:translateY(-2px)}
  /* Presion instantanea (.05s) coordinada con el sonido; el rebote suave queda al soltar. */
  .tap:active{transform:scale(.95);transition-duration:.05s}
  @media(prefers-reduced-motion:reduce){.tap,.tap:hover,.tap:active{transform:none;transition:none}}
  .divider-warm{border-color:rgba(221,192,161,.55)}
  /* Accesibilidad: foco visible por teclado en todo control interactivo */
  button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{
    outline:2px solid var(--brand);
    outline-offset:2px;
    border-radius:6px;
  }
  button{cursor:pointer}
  button:disabled{cursor:not-allowed}
  /* Animaciones: rapidas, ease-out, solo transform/opacity (principios Emil
     Kowalski). Y respeto total a prefers-reduced-motion. */
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{
      animation-duration:.01ms !important;
      animation-iteration-count:1 !important;
      transition-duration:.01ms !important;
      scroll-behavior:auto !important;
    }
  }
</style>

<script type="text/babel">
const {useState,useEffect,useCallback,useMemo,useRef} = React;

// ─── CONFIG ─────────────────────────────────────────────────────────
const APP_VERSION = '2.2';

// ─── SONIDOS ────────────────────────────────────────────────────────
// click = al SELECCIONAR (evento click, no al rozar): dos tonos sintetizados.
// coin  = al COBRAR: MP3 real del usuario (coin.mp3).
// print = al imprimir/reimprimir ticket o reporte: MP3 real (print.mp3).
// Los MP3 se cachean en el service worker (suenan offline). Silenciar con
// localStorage kapulits_mute='1'.
const snd=(()=>{
  let ctx=null,last=0,lastSpecial=0;
  const muted=()=>{try{return localStorage.getItem('kapulits_mute')==='1';}catch(e){return false;}};
  const ac=()=>{ try{ if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)(); if(ctx.state==='suspended')ctx.resume(); return ctx; }catch(e){return null;} };
  // Desbloqueo en el PRIMER toque de la sesion: en movil/tablet el AudioContext
  // nace "suspended" hasta un gesto real; sin esto el primer (o todos) los
  // sonidos se pierden. Crea el contexto, lo resume y reproduce un buffer mudo
  // para dejar el canal de audio abierto. ponytail: patron estandar iOS/Android.
  const unlock=()=>{
    const c=ac();if(!c)return;
    try{const b=c.createBuffer(1,1,22050),s=c.createBufferSource();s.buffer=b;s.connect(c.destination);s.start(0);}catch(e){}
    if(c.state==='running'){['pointerdown','touchend','click','keydown'].forEach(ev=>document.removeEventListener(ev,unlock,true));}
  };
  ['pointerdown','touchend','click','keydown'].forEach(ev=>document.addEventListener(ev,unlock,true));
  // Un tono con envolvente para no producir clicks/pops de corte.
  const tone=(c,freq,start,dur,type='sine',peak=0.22)=>{
    const o=c.createOscillator(),g=c.createGain();
    o.type=type;o.frequency.setValueAtTime(freq,start);
    g.gain.setValueAtTime(0,start);
    g.gain.linearRampToValueAtTime(peak,start+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,start+dur);
    o.connect(g).connect(c.destination);o.start(start);o.stop(start+dur+0.02);
  };
  // MP3 reales dados por el usuario (cobrar / imprimir). Un elemento por sonido,
  // reutilizado; se cachean por el service worker para que suenen offline.
  const mp3=(()=>{const cache={};return src=>{try{if(!cache[src]){const a=new Audio(src);a.preload='auto';a.volume=1;cache[src]=a;}return cache[src];}catch(e){return null;}};})();
  const play=src=>{if(muted())return;lastSpecial=performance.now();const a=mp3(src);if(!a)return;try{a.currentTime=0;const p=a.play();p&&p.catch&&p.catch(()=>{});}catch(e){}};
  return{
    // CLICK: se dispara en el evento click (seleccion registrada), no al rozar.
    // Dos tonos cortos. Throttle 80ms. Se omite si la accion ya sono moneda o
    // impresion (esos botones no llevan doble sonido): coherencia > capas.
    click(){if(muted())return;const now=performance.now();if(now-lastSpecial<250)return;if(now-last<80)return;const c=ac();if(!c)return;last=now;
      const t=c.currentTime;tone(c,988,t,0.09,'square',0.2);tone(c,1319,t+0.08,0.32,'square',0.22);},
    // Moneda al COBRAR y receipt al IMPRIMIR: MP3 del usuario.
    coin(){play('coin.mp3');},
    print(){play('print.mp3');},
  };
})();
// CLICK GLOBAL: cualquier <button> del app suena cuando la SELECCION se registra.
// Usa el evento 'click' (no 'pointerdown'): asi NO suena al rozar el boton ni al
// arrastrar/hacer scroll que empieza sobre un boton; solo cuando el toque firme
// completa la accion. Fase de burbuja (sin capture) para correr DESPUES del
// onClick de React: si esa accion ya sono moneda/impresion, snd.click se omite.
document.addEventListener('click',e=>{
  const t=e.target;const b=t&&t.closest&&t.closest('button,[role="button"]');
  if(b&&!b.disabled)snd.click();
});
const NEGOCIO = {
  nombre: "K'apul'Its",
  slogan: 'Birria y algo mas',
  direccion: 'Calle 36 x 19 y 21, Col. Salsipuedes, Escarcega, Camp.',
  telefono: '981 126 54 56',
};

const TARIFAS_ENVIO = {
  recoger: {label:'Pasa a recoger',precio:0,emoji:'🏃'},
  zona_centro: {label:'Envío Zona Centro',precio:30,emoji:'🛵'},
  retirado: {label:'Envío Retirado',precio:45,emoji:'🚗'},
  mesa_1: {label:'Mesa 1 · Afuera',precio:0,emoji:'🪑'},
  mesa_2: {label:'Mesa 2 · Adentro',precio:0,emoji:'🍽️'},
};
// Mesa = cuenta abierta en local (tarifa 0). Reutiliza todo el flujo de pedido:
// el pedido queda "nuevo" hasta cobrar; se le agregan platillos con Editar.
const esMesa=t=>t==='mesa_1'||t==='mesa_2';
// Un pedido necesita direccion cuando lo recoge un repartidor/servicio (recoger
// o envio), no cuando se come en mesa.
const necesitaDireccion=t=>!esMesa(t);
const ETIQUETAS_DIR=['Casa','Oficina','Trabajo','Otro'];
// Normaliza telefono a solo digitos: clave real del cliente (los nombres se
// repiten, el numero no). Se usa para buscar/deduplicar clientes frecuentes.
const normTel=t=>String(t||'').replace(/\D+/g,'');

// ─── DATA ───────────────────────────────────────────────────────────
const PRODUCTOS_DEFAULT = [
  {id:'consome',nombre:'Consomé',precio:115,costo:38,cat:'platillo',emoji:'🍲',activo:true},
  {id:'taco_maiz',nombre:'Taco de Maíz',precio:30,costo:11,cat:'platillo',emoji:'🌮',activo:true},
  {id:'taco_mano',nombre:'Taco Tortilla Mano',precio:35,costo:13,cat:'platillo',emoji:'🫓',activo:true},
  {id:'quesabirria',nombre:'Quesabirria',precio:37,costo:14,cat:'platillo',emoji:'🧀',activo:true},
  {id:'quesabirria_harina',nombre:'Quesabirria Harina',precio:60,costo:22,cat:'platillo',emoji:'🥙',activo:true},
  {id:'quesabirria_mano',nombre:'Quesabirria Mano',precio:60,costo:24,cat:'platillo',emoji:'🫔',activo:true},
  {id:'torta',nombre:'Torta',precio:85,costo:31,cat:'platillo',emoji:'🥪',activo:true},
  // Mulita: costo real pendiente de capturar por el dueño en Admin (no inventar).

// Permite que multiples dispositivos creen/editen pedidos al mismo tiempo
// sin que nadie pierda datos. Estrategia: union por id, renumerar colisiones.
function _mergeById(a,b){
  const m=new Map();
  for(const x of(a||[]))if(x&&x.id)m.set(x.id,x);
  for(const x of(b||[])){
    if(!x||!x.id)continue;
    const ex=m.get(x.id);
    if(!ex){m.set(x.id,x);continue;}
    // B1 — CRITERIO DE MERGE:
    // 1) Si AMBAS copias traen _ts (toda mutacion moderna lo escribe), gana la
    //    edicion MAS RECIENTE, sin importar el "avance" de estado. Esto respeta
    //    des-cancelaciones/re-cobros recientes: antes, una copia vieja con
    //    estado "mayor" (cancelado/cobrado) podia revertir una restauracion
    //    hecha despues en otro dispositivo.
    // 2) Compatibilidad con datos legacy SIN _ts: se conserva el criterio
    //    anterior (estado avanzado gana; hora como desempate), porque en esos
    //    datos la hora del dia no es comparable entre dispositivos con reloj
    //    distinto y perder un cobro seria peor que perder una restauracion.
    const exTs=ex._ts||'';
    const xTs=x._ts||'';
    if(exTs&&xTs){
      if(xTs>exTs)m.set(x.id,x);
      continue;
    }
    const exTsLegacy=exTs||ex.hora||'';
    const xTsLegacy=xTs||x.hora||'';
    const exState=(ex.estado==='entregado'||ex.estado==='cancelado'||ex.cobrado)?1:0;
    const xState=(x.estado==='entregado'||x.estado==='cancelado'||x.cobrado)?1:0;
    if(xState>exState||xTsLegacy>exTsLegacy)m.set(x.id,x);
  }
  return Array.from(m.values());
}
function _mergePedidos(cloud,local){
  const list=_mergeById(cloud,local);
  // Detectar duplicados de numero (dos dispositivos crearon pedidos al mismo tiempo
  // y ambos asignaron el mismo numero secuencial). Renumeramos los duplicados.
  const byNum=new Map();
  for(const p of list){
    const k=p.numero;
    if(!byNum.has(k))byNum.set(k,[]);
    byNum.get(k).push(p);
  }
  let maxNum=Math.max(0,...list.map(p=>p.numero||0));
  for(const peds of byNum.values()){
    if(peds.length>1){
      // Conservar el primero por hora; renumerar los demas
      peds.sort((a,b)=>String(a.hora||'').localeCompare(String(b.hora||'')));
      for(let i=1;i<peds.length;i++){maxNum++;peds[i].numero=maxNum;}
    }
  }
  return list.sort((a,b)=>(a.numero||0)-(b.numero||0));
}
function _repairVentas(ventas){
  // Invariant: max 1 active reversal per ventaOrigId.
  // If multi-device merge created duplicates, keep newest, anular the rest.
  const activeByOrig=new Map();
  for(const v of ventas){
    if(!v.esReversa||v.anulada)continue;
    const key=v.ventaOrigId;
    if(!key)continue;
    if(!activeByOrig.has(key))activeByOrig.set(key,[]);
    activeByOrig.get(key).push(v);
  }
  const toAnular=new Set();
  for(const [,arr] of activeByOrig){
    if(arr.length<=1)continue;
    arr.sort((a,b)=>String(b._ts||b.hora||'').localeCompare(String(a._ts||a.hora||'')));
    for(let i=1;i<arr.length;i++)toAnular.add(arr[i].id);
  }
  if(!toAnular.size)return ventas;
  return ventas.map(v=>toAnular.has(v.id)?{...v,anulada:true}:v);
}
function _pickNewestByTs(items=[]){
  return [...items].sort((a,b)=>String(b?._ts||b?.hora||'').localeCompare(String(a?._ts||a?.hora||'')))[0]||null;
}
function _repairHistoricalVentas(ventas=[]){
  let repaired=_repairVentas(ventas.map(v=>({...v})));
  const originalsByPedido=new Map();
  for(const v of repaired){
    if(v?.esReversa||v?.anulada||!v?.pedidoId)continue;
    if(!originalsByPedido.has(v.pedidoId))originalsByPedido.set(v.pedidoId,[]);
    originalsByPedido.get(v.pedidoId).push(v);
  }
  const duplicateOriginalIds=new Set();
  for(const [,arr] of originalsByPedido){
    if(arr.length<=1)continue;
    const keep=_pickNewestByTs(arr);
    arr.forEach(v=>{if(v.id!==keep?.id)duplicateOriginalIds.add(v.id);});
  }
  if(duplicateOriginalIds.size){
    const stamp=new Date().toISOString();
    repaired=repaired.map(v=>duplicateOriginalIds.has(v.id)?{...v,anulada:true,observacionRepair:'Venta original duplicada anulada en reparación histórica',_ts:stamp}:v);
  }
  return repaired;
}

function _auditHistoricalState(state){
  const jornadas=[...(state?.jornadas||[]),state?.jornadaActiva].filter(Boolean);
  const issues=[];
  const summary={jornadas: jornadas.length, duplicateOriginalVentas:0, duplicateActiveReversals:0, orphanReversals:0, mismatchDiferencias:0};
  jornadas.forEach(j=>{
    const ventas=j.ventas||[];
    const byPedido=new Map();
    ventas.filter(v=>!v.esReversa&&!v.anulada&&v.pedidoId).forEach(v=>{
      if(!byPedido.has(v.pedidoId))byPedido.set(v.pedidoId,[]);
      byPedido.get(v.pedidoId).push(v);
    });
    for(const [pedidoId,arr] of byPedido){
      if(arr.length>1){
        summary.duplicateOriginalVentas++;
        issues.push({type:'duplicate_original',fecha:j.fecha,pedidoId,count:arr.length,ids:arr.map(v=>v.id)});
      }
    }
    const byOrig=new Map();
    ventas.filter(v=>v.esReversa&&!v.anulada&&v.ventaOrigId).forEach(v=>{
      if(!byOrig.has(v.ventaOrigId))byOrig.set(v.ventaOrigId,[]);
      byOrig.get(v.ventaOrigId).push(v);
    });
    for(const [ventaOrigId,arr] of byOrig){
      if(arr.length>1){
        summary.duplicateActiveReversals++;
        issues.push({type:'duplicate_reversal',fecha:j.fecha,ventaOrigId,count:arr.length,ids:arr.map(v=>v.id)});
      }
    }
    ventas.filter(v=>v.esReversa&&!v.anulada).forEach(v=>{
      if(!ventas.find(o=>o.id===v.ventaOrigId&&!o.esReversa)){
        summary.orphanReversals++;
        issues.push({type:'orphan_reversal',fecha:j.fecha,reversalId:v.id,ventaOrigId:v.ventaOrigId});
      }
    });
    // NOTA: NO recalculamos la `diferencia` de jornadas cerradas. La diferencia
    // se registro al momento del corte con un conteo fisico real; es un hecho
    // historico. Ademas la formula de caja evoluciono en el tiempo (antes/despues
    // de separar envios), por lo que recalcular generaria falsos positivos y
    // tentaria a sobrescribir datos historicos validos. Solo auditamos
    // integridad estructural de ventas (duplicados, reversas huerfanas).
  });
  return{ok:issues.length===0,summary,issues};
}
function _repairHistoricalState(state){
  let changed=false;
  const stamp=new Date().toISOString();
  const repairJornada=j=>{
    if(!j)return j;
    let jornadaChanged=false;
    let next={...j,ventas:_repairHistoricalVentas(j.ventas||[])};
    if(JSON.stringify(next.ventas)!==JSON.stringify(j.ventas||[])){changed=true;jornadaChanged=true;}
    // NO se recalcula ni sobrescribe `diferencia` de jornadas cerradas: es un
    // hecho historico (conteo fisico real al corte). La reparacion solo corrige
    // corrupcion estructural de ventas (duplicados/reversas), nunca la caja.
    return jornadaChanged?{...next,_ts:stamp}:next;
  };
  const jornadas=(state.jornadas||[]).map(repairJornada);
  const jornadaActiva=state.jornadaActiva?repairJornada(state.jornadaActiva):null;
  return{changed,state:{...state,jornadas,jornadaActiva},report:_auditHistoricalState({...state,jornadas,jornadaActiva})};

// cloudSave hace MERGE entre nube y local antes de subir. Asi multiples
// dispositivos pueden agregar/editar pedidos al mismo tiempo sin perder nada.
// M3 — CONCURRENCIA OPTIMISTA (sin cambiar el esquema de Supabase):
// el updated_at leido en el load se usa como precondicion del write
// (update ... eq('updated_at', <valor leido>)). Si otro dispositivo escribio
// entre nuestro load y nuestro save, el update afecta 0 filas y se reintenta
// el ciclo load→merge→save con backoff (max 3 intentos). Si se agota, se
// lanza error con code='sync_conflict': el estado queda dirty y el SyncDot
// lo reporta como cambios locales pendientes (el siguiente save reintenta).
const SYNC_MAX_RETRIES=3;
async function cloudSave(state,opts={}){
  if(!_sb)throw new Error('no client');
  const {strategy='merge',deviceInfo=null}=opts;
  try{_autoBackup(state);}catch(e){}
  const cloudSafePrinter={...INITIAL_STATE.impresora,...state.impresora,conectada:false,reconectando:false};
  const stamped={...state,impresora:cloudSafePrinter,__sync:{writerId:deviceInfo?.id||null,writerRole:deviceInfo?.role||null,writtenAt:new Date().toISOString(),strategy}};
  for(let attempt=0;attempt<SYNC_MAX_RETRIES;attempt++){
    let merged=stamped;
    let baseTs=null; // updated_at leido: precondicion del write condicionado
    if(strategy==='merge'){
      try{
        const cloud=await cloudLoad();
        if(cloud?.data){merged=_mergeStates(cloud.data,stamped);baseTs=cloud.updated_at||null;}
      }catch(e){/* sin red, subir state local como esta */}
    }
    const newTs=new Date().toISOString();
    if(strategy==='merge'&&baseTs){
      // Write condicionado: solo escribe si nadie movio la fila desde el load.
      const{data,error}=await _sb.from('kapulits_state')
        .update({data:merged,updated_at:newTs})
        .eq('id','main').eq('updated_at',baseTs)
        .select('id');
      if(error)throw error;
      if(data&&data.length)return merged; // escrito sin conflicto
      // 0 filas afectadas => escritura concurrente. Backoff y reintento.
      await new Promise(r=>setTimeout(r,250*Math.pow(2,attempt)));
      continue;
    }
    // Fila inexistente o strategy=replace (accion explicita): upsert directo.
    const{error}=await _sb.from('kapulits_state').upsert({id:'main',data:merged,updated_at:newTs},{onConflict:'id'});
    if(error)throw error;
    return merged; // devolver el merge para que el cliente refleje pedidos de otros dispositivos
  }
  const err=new Error('Conflicto de sincronización: otro dispositivo guardó al mismo tiempo. Se reintentará.');
  err.code='sync_conflict';
  throw err;
}

// Mantiene hasta 12 snapshots en localStorage (uno cada save).
// Si algun dia se borra la nube, se puede recuperar el ultimo desde aqui.
function _autoBackup(state){
  try{

    while(keys.length>12){localStorage.removeItem(keys.shift());}
  }catch(e){}
}

// Sanity check: validate accounting invariants on current state.
// Run from browser console: kapulitsSanityCheck()
window.kapulitsSanityCheck=()=>{
  const raw=localStorage.getItem('kapulits_v2');
  if(!raw)return{ok:false,errors:['No state in localStorage']};
  const state=JSON.parse(raw);
  const errors=[];
  const allJornadas=[...(state.jornadas||[]),state.jornadaActiva].filter(Boolean);
  allJornadas.forEach(j=>{
    const ventas=j.ventas||[];
    // INV1: max 1 venta original per pedidoId
    const origByPed=new Map();
    ventas.filter(v=>!v.esReversa).forEach(v=>{
      const k=v.pedidoId;if(!k)return;
      if(!origByPed.has(k))origByPed.set(k,0);
      origByPed.set(k,origByPed.get(k)+1);
    });
    for(const [pid,count] of origByPed){
      if(count>1)errors.push(`J:${j.fecha} pedido ${pid}: ${count} ventas originales (expected max 1)`);
    }
    // INV2: max 1 active reversal per ventaOrigId
    const activeRevByOrig=new Map();
    ventas.filter(v=>v.esReversa&&!v.anulada).forEach(v=>{
      const k=v.ventaOrigId;if(!k)return;
      if(!activeRevByOrig.has(k))activeRevByOrig.set(k,0);
      activeRevByOrig.set(k,activeRevByOrig.get(k)+1);
    });
    for(const [vid,count] of activeRevByOrig){
      if(count>1)errors.push(`J:${j.fecha} ventaOrig ${vid}: ${count} active reversals (expected max 1)`);
    }
    // INV3: every active reversal must have a matching venta original
    ventas.filter(v=>v.esReversa&&!v.anulada).forEach(v=>{
      if(!ventas.find(o=>o.id===v.ventaOrigId&&!o.esReversa))
        errors.push(`J:${j.fecha} reversal ${v.id}: orphan (no matching venta original ${v.ventaOrigId})`);
    });
    // INV4 (cash diferencia recompute) retirado a proposito: la `diferencia` de
    // una jornada cerrada es un hecho historico del conteo fisico y la formula de
    // caja cambio al separar envios; recalcular daria falsos positivos.
  });
  const result={ok:errors.length===0,checked:allJornadas.length+' jornadas',errors};
  console.table(errors.length?errors:['All invariants OK']);
  return result;
};

// Nombre normalizado de producto (trim, espacios, caja) para comparar sin duplicar.
function normNombreProducto(n){return String(n||'').trim().replace(/\s+/g,' ').toLowerCase();}
// Migracion de catalogo. Dos partes, ambas idempotentes:
//  1) ALTAS: agrega productos default ausentes. Match por id Y por nombre
//     normalizado, para no duplicar si el dueño ya lo creo manualmente con
//     otro id (p.ej. una "Mulita" propia).
//  2) PASOS VERSIONADOS: cambios sobre productos existentes (p.ej. precio).
//     Solo corren si catalogVersion < CATALOG_VERSION; despues de estampar la
//     version, un precio editado manualmente por el dueño NO se revierte.
// NUNCA toca jornadas/pedidos/ventas: los precios historicos viven congelados
// en items[].precio/subtotal y en los totales de cada venta.
function migrateProducts(prods,catalogVersion){
  const ids=new Set(prods.map(p=>p.id));
  const nombres=new Set(prods.map(p=>normNombreProducto(p.nombre)));
  const missing=PRODUCTOS_DEFAULT.filter(d=>!ids.has(d.id)&&!nombres.has(normNombreProducto(d.nombre)));
  let next=missing.length?[...prods,...missing]:prods;
  if((Number(catalogVersion)||0)<1){
    // v1 (2026-07): refrescos suben de $30 a $35 (menu oficial).
    next=next.map(p=>!p.esVariado&&(p.id==='coca'||normNombreProducto(p.nombre)==='coca-cola')&&Number(p.precio)!==35?{...p,precio:35}:p);
  }
  if((Number(catalogVersion)||0)<2){
    // v2 (2026-08): Coca gana variantes (Clasica/Sin azucar). Las aguas naturales
    // se consolidan en el producto default "Aguas naturales" (con sabores); las
    // Jamaica/Horchata sueltas se DESACTIVAN para que no aparezcan como boton
    // aparte. El historico queda intacto: sus items viven congelados en los pedidos.
    next=next.map(p=>{
      if((p.id==='coca'||normNombreProducto(p.nombre)==='coca-cola')&&!p.variantes)return{...p,variantes:['Clásica','Sin azúcar']};
      if((p.id==='jamaica'||p.id==='horchata'||normNombreProducto(p.nombre)==='jamaica'||normNombreProducto(p.nombre)==='horchata')&&p.activo!==false)return{...p,activo:false};
      return p;
    });
  }
  if((Number(catalogVersion)||0)<3){
    // v3 (2026-08): se agrega "Aguas 1/2 L" ($20) via el bloque `missing` de arriba.
    // Para dejar claro el tamaño, la de litro pasa de "Aguas naturales" a "Aguas 1 L"
    // SOLO si conserva el nombre default (no se pisa un rename del dueño).
    next=next.map(p=>(p.id==='agua_natural'&&normNombreProducto(p.nombre)==='aguas naturales')?{...p,nombre:'Aguas 1 L'}:p);
  }
  return next;
}
// ID unico por linea de "producto variado": permite varios variados distintos
// en un mismo pedido sin colisionar por productoId.
function lineaUid(){return'var_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
// Nombre normalizado para agrupar variados en el reporte (trim, espacios, caja).
function normVariadoNombre(n){return String(n||'').trim().replace(/\s+/g,' ').toLowerCase();}
// Forma persistida de una linea del carrito. El variado conserva su id de linea,
// la marca esVariado, nombre y precio capturados, y costo 0.
// B4: si una linea tiene id propio distinto del productoId (linea separada por
// precio historico distinto al del catalogo), ese id se conserva para que al
// reeditar el pedido las dos lineas no colisionen en el carrito.
function buildItem(i){
  const it={productoId:i.productoId||i.id,nombre:i.nombre,cantidad:i.cantidad,precio:i.precio,subtotal:i.subtotal,emoji:i.emoji};
  if(i.esVariado){it.esVariado=true;it.id=i.id;it.costo=0;}
  else if(i.id&&i.id!==it.productoId){it.id=i.id;}
  return it;
}
// Alta/actualizacion de cliente frecuente. Clave = telefono normalizado (unico;
// los nombres se repiten, el numero no). Idempotente: si el telefono ya existe
// actualiza el nombre y agrega la direccion nueva (con etiqueta) si no estaba.
// Devuelve la lista nueva de clientes. Sin telefono no crea cliente.
function upsertClienteList(clientes,{telefono,nombre,direccion,etiqueta}){
  const tel=normTel(telefono);
  const list=Array.isArray(clientes)?clientes:[];
  if(!tel)return list;
  const nid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const nom=String(nombre||'').trim();
  const dir=String(direccion||'').trim();
  const et=String(etiqueta||'Otro').trim()||'Otro';
  const ts=new Date().toISOString();
  const idx=list.findIndex(c=>normTel(c.telefono)===tel);
  if(idx<0){
    const direcciones=dir?[{id:nid(),etiqueta:et,texto:dir}]:[];
    return[...list,{id:nid(),telefono:String(telefono||'').trim(),nombre:nom,direcciones,_ts:ts}];
  }
  const c=list[idx];
  const direcciones=[...(c.direcciones||[])];
  if(dir&&!direcciones.some(d=>String(d.texto||'').trim().toLowerCase()===dir.toLowerCase())){
    direcciones.push({id:nid(),etiqueta:et,texto:dir});
  }
  const next=[...list];
  next[idx]={...c,nombre:nom||c.nombre,direcciones,_ts:ts};
  return next;
}
function localISODate(d=new Date()){
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,'0');
  const day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function calcVentaCobrada(v){
  // Solo productos del negocio — nunca incluye costoEnvio
  return Number(v?.total??0);
}
function _roundMoney(n){
  return Math.round((Number(n)||0)*100)/100;
}
function sumPagos(pagos){
  return _roundMoney((Number(pagos?.efectivo)||0)+(Number(pagos?.transferencia)||0));
}
function normalizePagos(pagos,total,metodoFallback){
  const monto=_roundMoney(total);
  if(pagos&&typeof pagos==='object'){
    return {
      efectivo:_roundMoney(pagos.efectivo),
      transferencia:_roundMoney(pagos.transferencia)
    };
  }
  const metodo=metodoFallback==='transferencia'?'transferencia':'efectivo';
  return {
    efectivo:metodo==='efectivo'?monto:0,
    transferencia:metodo==='transferencia'?monto:0
  };
}
function metodoFromPagos(pagos,metodoFallback){
  const ef=Number(pagos?.efectivo)||0;
  const tr=Number(pagos?.transferencia)||0;
  if(ef>0&&tr>0)return'mixto';
  if(tr>0)return'transferencia';
  if(ef>0)return'efectivo';
  return metodoFallback||null;
}
function pagoLabel(metodo){
  return metodo==='mixto'?'Mixto':metodo==='transferencia'?'Transferencia':metodo==='efectivo'?'Efectivo':'—';
}
function pagoBadgeColor(metodo){
  return metodo==='mixto'?'purple':metodo==='transferencia'?'blue':'green';
}
function ventasActivas(ventas=[]){
  return ventas.filter(v=>!v.anulada);
}
// NOTA MANDADITOS / ENVIOS: el envio NO es venta del negocio (no entra en
// utilidad), pero SI es dinero real de caja/banco. Todo su desglose por metodo
// de pago sale de buildCajaModel (enviosEfectivo/Transfer/Mixto/Total); las
// funciones de conteo directo sobre el ledger se eliminaron al migrar.
function _backfillMandaditoMetodo(j){
  // Completa (sin sobrescribir) el metodo de pago de un envio cobrado tomandolo
  // de la venta del mismo pedido. Garantiza que el desglose efectivo/transferencia
  // siempre sume el total cobrado. No toca tarifas, ni diferencia, ni borra nada.
  if(!j||!Array.isArray(j.mandaditos)||!j.mandaditos.length)return j;
  const ventas=j.ventas||[];
  let changed=false;
  const mandaditos=j.mandaditos.map(m=>{
    if(m&&m.cobrado&&!m.metodoPago){
      const v=ventas.find(x=>x.pedidoId===m.pedidoId&&!x.esReversa&&!x.anulada);
      if(v&&v.metodoPago){changed=true;return{...m,metodoPago:v.metodoPago};}
    }
    return m;
  });
  return changed?{...j,mandaditos}:j;
}
// Auto-corrige datos ya guardados: la venta de un pedido cobrado SIEMPRE debe
// igualar el estado final del pedido (monto, items, costo de envio y metodo de
// pago). Si una edicion previa quedo solo en el pedido y no en la venta (dato
// "congelado"), aqui se corrige al cargar. Respeta cancelaciones (no toca su
// reversa) y NUNCA crea/borra ventas; solo actualiza la venta original activa.
function _reconcileVentasFromPedidos(j){
  if(!j||!Array.isArray(j.pedidos)||!j.pedidos.length)return j;
  let ventas=[...(j.ventas||[])];
  let mandaditos=[...(j.mandaditos||[])];
  let changed=false;
  j.pedidos.forEach(p=>{
    if(!p||!p.cobrado||p.estado==='cancelado')return;
    const idx=ventas.findIndex(v=>v.pedidoId===p.id&&!v.esReversa&&!v.anulada);
    if(idx<0)return;
    const v=ventas[idx];
    const pagosFinal=normalizePagos(p.pagos||v.pagos,Number(p.total)||0,p.metodoPago||v.metodoPago);
    const metodoFinal=metodoFromPagos(pagosFinal,p.metodoPago||v.metodoPago||null);
    const want={total:Number(p.totalProductos)||0,totalCobrado:Number(p.total)||0,costoEnvio:Number(p.costoEnvio)||0,metodoPago:metodoFinal,pagos:pagosFinal};
    if(v.total!==want.total||v.totalCobrado!==want.totalCobrado||v.costoEnvio!==want.costoEnvio||v.metodoPago!==want.metodoPago||JSON.stringify(v.pagos||null)!==JSON.stringify(want.pagos)){
      ventas[idx]={...v,...want,items:p.items};changed=true;
    }
    // El envio (mandadito) de un pedido cobrado queda cobrado con el mismo metodo.
    mandaditos=mandaditos.map(m=>{
      if(m.pedidoId===p.id&&(m.cobrado!==true||m.metodoPago!==metodoFinal)){changed=true;return{...m,cobrado:true,metodoPago:metodoFinal};}
      return m;
    });
  });
  return changed?{...j,ventas,mandaditos}:j;
}
function hydrateState(p){
  const base={...INITIAL_STATE,...p,
    productos:migrateProducts(p?.productos||PRODUCTOS_DEFAULT,p?.catalogVersion),
    catalogVersion:CATALOG_VERSION,
    clientes:Array.isArray(p?.clientes)?p.clientes:[],
    costos:p?.costos||COSTOS_DEFAULT,
    empleados:p?.empleados||EMPLEADOS_DEFAULT,
    impresora:{...INITIAL_STATE.impresora,...(p?.impresora||{}),conectada:false,reconectando:false}};
  const fix=j=>_reconcileVentasFromPedidos(_backfillMandaditoMetodo(j));
  base.jornadas=(base.jornadas||[]).map(fix);
  if(base.jornadaActiva)base.jornadaActiva=fix(base.jornadaActiva);
  return _autoCloseExpired(base);
}
function readBackups(){
  return Object.keys(localStorage).filter(k=>k.startsWith('kapulits_backup_')).sort().reverse()
    .map(k=>{try{return{key:k,...JSON.parse(localStorage.getItem(k))};}catch(e){return{key:k,error:'corrupt'};}});
}

function _autoCloseExpired(s){
  if(!s||!s.jornadaActiva)return s;
  const ja=s.jornadaActiva;
  const MS_48H=48*60*60*1000;
  let aperturaMs=ja.timestampApertura;
  if(!aperturaMs){
    const [h,m]=(ja.horaApertura||'00:00').split(':').map(Number);
    const d=new Date(ja.fecha+'T00:00:00');d.setHours(h||0,m||0,0,0);
    aperturaMs=d.getTime();
  }
  if(Date.now()-aperturaMs<MS_48H)return s;
  const jaCerrada={...ja,estado:'cerrada',horaCierre:'auto-expirada',totalEfectivo:null,
    diferencia:null,observaciones:'Jornada expirada (48h sin cerrar). Requiere cierre manual para cuadrar caja.'};
  const js=s.jornadas.map(j=>j.id===jaCerrada.id?jaCerrada:j);
  return{...s,jornadas:js,jornadaActiva:null};
}

// ─── STORE ──────────────────────────────────────────────────────────
function useStore(){
  const [deviceInfo,setDeviceInfo]=useState(()=>loadDeviceInfo());
  const [state,setState]=useState(()=>{
    try{const s=localStorage.getItem('kapulits_v2');if(s){const p=JSON.parse(s);
      return hydrateState(p);}}catch(e){}
    return INITIAL_STATE;
  });
  const [syncStatus,setSyncStatus]=useState('idle');
  const [remoteNotice,setRemoteNotice]=useState('');
  const [cloudRecovery,setCloudRecovery]=useState(null);
  const [lastCloudAt,setLastCloudAt]=useState('');
  const showRemoteNotice=useCallback(msg=>{
    setRemoteNotice(msg);
    setTimeout(()=>setRemoteNotice(''),3500);
  },[]);
  const [saveError,setSaveError]=useState(null);
  const persistLocal=useCallback((ns,ts=new Date().toISOString(),markDirty=true)=>{
    try{
      localStorage.setItem('kapulits_v2',JSON.stringify(ns));
      localStorage.setItem('kapulits_ts',ts);
      setDirtyFlag(markDirty);
      setSaveError(null);
    }catch(e){
      setSaveError('No se pudo guardar localmente. Libera espacio en el dispositivo.');
    }
  },[]);

  useEffect(()=>{
    setSyncStatus('syncing');
    cloudLoad().then(cloud=>{
      if(cloud?.data){
        setLastCloudAt(cloud.updated_at||'');
        const localTs=localStorage.getItem('kapulits_ts')||'';
        const hasLocal=!!localStorage.getItem('kapulits_v2');
        const cloudWriter=cloud.data?.__sync?.writerId||'';
        const shouldApplyMirror=deviceInfo.role==='mirror'&&(!localTs||cloud.updated_at>localTs);
        const shouldApplyPrimary=!hasLocal;
        const localState=hasLocal?(()=>{try{return JSON.parse(localStorage.getItem('kapulits_v2'));}catch(e){return null;}})():null;
        const localEmpty=_isEffectivelyEmpty(localState);
        const cloudRich=_cloudHasRealData(cloud.data);
        if(shouldApplyMirror||shouldApplyPrimary||(localEmpty&&cloudRich)){
          const ns=hydrateState(cloud.data);
          persistLocal(ns,cloud.updated_at,false);
          setState(ns);
        }else if(deviceInfo.role==='primary'&&localTs&&cloud.updated_at>localTs&&cloudWriter!==deviceInfo.id){
          if(cloudRich&&!localEmpty){
            setCloudRecovery({cloudData:cloud.data,cloudTs:cloud.updated_at});
          }else if(cloudRich&&localEmpty){
            const ns=hydrateState(cloud.data);
            persistLocal(ns,cloud.updated_at,false);
            setState(ns);
          }
          setSyncStatus('remote');
          return;
        }
      }
      setSyncStatus(isDirtyFlagSet()?'local':'synced');
    }).catch(()=>setSyncStatus('offline'));
  },[deviceInfo.id,deviceInfo.role,persistLocal,showRemoteNotice]);

  // Realtime subscription
  useEffect(()=>{
    if(!_sb)return;
    const channel=_sb.channel('kapulits-sync')
      .on('postgres_changes',{event:'*',schema:'public',table:'kapulits_state',filter:'id=eq.main'},
        (payload)=>{
          if(!payload.new?.data)return;
          const cloudTs=payload.new.updated_at;
          const localTs=localStorage.getItem('kapulits_ts')||'';
          const writerId=payload.new.data?.__sync?.writerId||'';
          setLastCloudAt(cloudTs||'');
          if(!cloudTs||cloudTs<=localTs||writerId===deviceInfo.id)return;
          const cloudData=payload.new.data;
          const localRaw=localStorage.getItem('kapulits_v2');
          const localData=localRaw?JSON.parse(localRaw):null;
          const merged=localData?_mergeStates(cloudData,localData):cloudData;
          const ns=hydrateState(merged);
          // M2: si habia cambios locales sin subir, CONSERVAR el dirty flag.
          // El merge local los preserva, pero la nube aun no los tiene; el
          // siguiente save/sync los subira. Antes se marcaba dirty=false y esos
          // cambios podian quedarse sin subir para siempre.
          const wasDirty=isDirtyFlagSet();
          persistLocal(ns,cloudTs,wasDirty);
          setState(ns);
          setSyncStatus(wasDirty?'local':'synced');
          if(deviceInfo.role==='mirror'){
            showRemoteNotice('Datos sincronizados');
          }else{
            showRemoteNotice('Pedidos actualizados desde otro dispositivo');
          }
        })
      .subscribe();
    return()=>{_sb.removeChannel(channel);};
  },[deviceInfo.id,deviceInfo.role,persistLocal,showRemoteNotice]);

  const syncNow=useCallback(async(mode,stateOverride=null)=>{
    const strategy=mode||(deviceInfo.role==='primary'?'replace':'merge');
    const sourceState=stateOverride||state;
    const seqAtStart=_saveSeq;
    setSyncStatus('syncing');
    try{
      const merged=await cloudSave(sourceState,{strategy,deviceInfo});
      if(_saveSeq!==seqAtStart){
        // Hubo un save() local mas nuevo mientras subiamos: no sobrescribir
        // estado ni localStorage con datos viejos. El debounce pendiente
        // sincronizara la version mas reciente.
        setLastCloudAt(new Date().toISOString());
        return{ok:true,strategy,stale:true};
      }
      const refreshed=hydrateState(merged);
      persistLocal(refreshed,new Date().toISOString(),false);
      setState(refreshed);
      setLastCloudAt(new Date().toISOString());
      setSyncStatus('synced');
      return{ok:true,strategy};
    }catch(e){
      // sync_conflict: los reintentos de concurrencia se agotaron. El estado
      // local sigue dirty y el SyncDot lo muestra como pendiente local (no es
      // un problema de red). El siguiente save() vuelve a intentar.
      const conflict=e?.code==='sync_conflict';
      setSyncStatus(conflict?'local':'offline');
      return{ok:false,error:e.message||'Error de sync',conflict};
    }
  },[deviceInfo, persistLocal, state]);

  const pullFromCloud=useCallback(async()=>{
    setSyncStatus('syncing');
    try{
      const cloud=await cloudLoad();
      if(!cloud?.data){
        setSyncStatus('offline');
        return{ok:false,error:'No hay datos en la nube'};
      }
      const ns=hydrateState(cloud.data);
      persistLocal(ns,cloud.updated_at||new Date().toISOString(),false);
      setState(ns);
      setLastCloudAt(cloud.updated_at||'');
      setSyncStatus('synced');
      return{ok:true};
    }catch(e){
      setSyncStatus('offline');
      return{ok:false,error:e.message||'No se pudo descargar la nube'};
    }
  },[persistLocal]);

  const setDeviceRole=useCallback(role=>{
    const next={...deviceInfo,role};
    saveDeviceInfo(next);
    setDeviceInfo(next);
    return next;
  },[deviceInfo]);

  const listBackups=useCallback(()=>readBackups(),[]);
  const restoreBackup=useCallback(ts=>{
    const raw=localStorage.getItem(`kapulits_backup_${ts}`);
    if(!raw)return false;
    const parsed=JSON.parse(raw);
    const ns=hydrateState(parsed.state||parsed);
    persistLocal(ns,new Date().toISOString(),true);
    setState(ns);
    setSyncStatus('local');
    return true;
  },[persistLocal]);
  const save=useCallback(ns=>{
    _saveSeq++;
    persistLocal(ns,new Date().toISOString(),true);
    setState(ns);
    setSyncStatus('syncing');
    if(_saveTimer)clearTimeout(_saveTimer);
    _saveTimer=setTimeout(async()=>{
      const r=await syncNow('merge',ns);
      if(!r.ok)setSyncStatus('offline');
    },1200);
  },[persistLocal,syncNow]);
  const auditHistoricalData=useCallback(()=>{
    return _auditHistoricalState(state);
  },[state]);
  const repairHistoricalData=useCallback(()=>{
    const repaired=_repairHistoricalState(state);
    if(repaired.changed){
      save(repaired.state);
    }
    return repaired;
  },[state,save]);
  const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const now=()=>new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
  const today=()=>localISODate();

  const abrirJornada=useCallback((fondoInicial,fecha)=>{
    // B2: el fondo inicial nunca puede ser negativo (corromperia la caja esperada).
    const fondo=Math.max(0,Number(fondoInicial)||0);
    const j={id:uid(),fecha:fecha||today(),estado:'abierta',fondoInicial:fondo,
      ventas:[],gastos:[],pedidos:[],mandaditos:[],ajustesCaja:[],contadorPedido:1,
      horaApertura:now(),timestampApertura:Date.now(),horaCierre:null,totalEfectivo:null,diferencia:null,observaciones:''};
    save({...state,jornadas:[...state.jornadas,j],jornadaActiva:j});
  },[state,save]);

  const cerrarJornada=useCallback((totalEfectivo,observaciones)=>{
    if(!state.jornadaActiva)return;
    // B2: el efectivo contado no puede ser negativo (no existe conteo fisico < 0).
    const contado=Number(totalEfectivo);
    if(!(contado>=0))return;
    const ja={...state.jornadaActiva,estado:'cerrada',horaCierre:now(),
      totalEfectivo:contado,observaciones:observaciones||''};
    const esperado=_calcEsperadoCaja(ja);
    ja.diferencia=contado-esperado;
    const js=state.jornadas.map(j=>j.id===ja.id?ja:j);
    save({...state,jornadas:js,jornadaActiva:null});
    // Respaldo historico al PC: descarga la jornada en Excel dentro del gesto de
    // cierre. Si falla (bloqueo del navegador) no rompe el cierre; queda el boton
    // manual en el historial.
    try{exportJornadaXLSX(ja);}catch(e){}
  },[state,save]);

  const crearPedido=useCallback((items,tipoEntrega,cliente,direccion,notas,telefono,etiquetaDir)=>{
    if(!state.jornadaActiva)return null;
    const ja=state.jornadaActiva;
    const totalProductos=items.reduce((s,i)=>s+i.subtotal,0);
    const tarifa=TARIFAS_ENVIO[tipoEntrega]||TARIFAS_ENVIO.recoger;
    const costoEnvio=tarifa.precio;
    const pedido={id:uid(),numero:ja.contadorPedido,fecha:ja.fecha,hora:now(),_ts:new Date().toISOString(),
      items,totalProductos,costoEnvio,total:totalProductos+costoEnvio,
      tipoEntrega,cliente:cliente||'',telefono:telefono||'',direccion:direccion||'',notas:notas||'',
      estado:'nuevo',cobrado:false,metodoPago:null};
    const jaNew={...ja,pedidos:[...ja.pedidos,pedido],contadorPedido:ja.contadorPedido+1};
    if(costoEnvio>0){
      jaNew.mandaditos=[...ja.mandaditos,{id:uid(),pedidoId:pedido.id,pedidoNum:pedido.numero,
        hora:now(),cliente:pedido.cliente,telefono:pedido.telefono,direccion:pedido.direccion,
        tipo:tipoEntrega,tarifa:costoEnvio,cobrado:false}];
    }
    const js=state.jornadas.map(j=>j.id===jaNew.id?jaNew:j);
    // Al crear el pedido se guarda/actualiza el cliente frecuente por telefono.
    const clientes=upsertClienteList(state.clientes,{telefono,nombre:cliente,direccion,etiqueta:etiquetaDir});
    save({...state,clientes,jornadas:js,jornadaActiva:jaNew});
    return pedido;
  },[state,save]);

  const actualizarPedido=useCallback((pedidoId,cambios)=>{
    if(!state.jornadaActiva)return;
    const ja={...state.jornadaActiva};
    const pedOld=ja.pedidos.find(p=>p.id===pedidoId);
    if(!pedOld)return;

    // Si cambian items, recalcular totales
    let newItems=cambios.items||pedOld.items;
    let newTipo=cambios.tipoEntrega||pedOld.tipoEntrega;
    let newTotalProd=cambios.items?cambios.items.reduce((s,i)=>s+i.subtotal,0):pedOld.totalProductos;
    let newCostoEnvio=(TARIFAS_ENVIO[newTipo]||TARIFAS_ENVIO.recoger).precio;
    let newTotal=newTotalProd+newCostoEnvio;

    // Gestionar mandaditos si cambia tipo de envio
    if(cambios.tipoEntrega&&cambios.tipoEntrega!==pedOld.tipoEntrega){
      const oldEnvio=(TARIFAS_ENVIO[pedOld.tipoEntrega]?.precio||0)>0;
      const newEnvio=(TARIFAS_ENVIO[cambios.tipoEntrega]?.precio||0)>0;
      if(!oldEnvio&&newEnvio){
        ja.mandaditos=[...ja.mandaditos,{id:uid(),pedidoId,pedidoNum:pedOld.numero,
          hora:now(),cliente:cambios.cliente||pedOld.cliente,telefono:cambios.telefono||pedOld.telefono,direccion:cambios.direccion||pedOld.direccion,
          tipo:cambios.tipoEntrega,tarifa:newCostoEnvio,cobrado:false}];
      }else if(oldEnvio&&!newEnvio){
        ja.mandaditos=ja.mandaditos.filter(m=>m.pedidoId!==pedidoId);
      }else if(oldEnvio&&newEnvio){
        ja.mandaditos=ja.mandaditos.map(m=>m.pedidoId===pedidoId?
          {...m,tipo:cambios.tipoEntrega,tarifa:newCostoEnvio,cliente:cambios.cliente||m.cliente,telefono:cambios.telefono||m.telefono,direccion:cambios.direccion||m.direccion}:m);
      }
    }

    const mergedCambios={...cambios,totalProductos:newTotalProd,costoEnvio:newCostoEnvio,total:newTotal,_ts:new Date().toISOString()};
    ja.pedidos=ja.pedidos.map(p=>p.id===pedidoId?{...p,...mergedCambios}:p);

    // Cancel cobrado: reactivate existing anulada reversal, or create new one
    if(cambios.estado==='cancelado'&&pedOld.cobrado){
      const ventaOrig=ja.ventas.find(v=>v.pedidoId===pedidoId&&!v.esReversa);
      if(ventaOrig){
        const reversaExistente=ja.ventas.find(v=>v.pedidoId===pedidoId&&v.esReversa&&v.ventaOrigId===ventaOrig.id);
        if(reversaExistente){
          const pagosOrig=normalizePagos(ventaOrig.pagos,Number(ventaOrig.totalCobrado)||((Number(ventaOrig.total)||0)+(Number(ventaOrig.costoEnvio)||0)),ventaOrig.metodoPago);
          const reversaPagos={efectivo:-pagosOrig.efectivo,transferencia:-pagosOrig.transferencia};
          ja.ventas=ja.ventas.map(v=>v.id===reversaExistente.id?{...v,anulada:false,total:-ventaOrig.total,totalCobrado:-ventaOrig.totalCobrado,costoEnvio:-(ventaOrig.costoEnvio||0),pagos:reversaPagos,_ts:new Date().toISOString()}:v);
        }else{
          const pagosOrig=normalizePagos(ventaOrig.pagos,Number(ventaOrig.totalCobrado)||((Number(ventaOrig.total)||0)+(Number(ventaOrig.costoEnvio)||0)),ventaOrig.metodoPago);
          const reversaPagos={efectivo:-pagosOrig.efectivo,transferencia:-pagosOrig.transferencia};
          const reversa={id:uid(),hora:now(),_ts:new Date().toISOString(),items:[],total:-ventaOrig.total,totalCobrado:-ventaOrig.totalCobrado,
            costoEnvio:-(ventaOrig.costoEnvio||0),metodoPago:ventaOrig.metodoPago,pagos:reversaPagos,pedidoId,esReversa:true,ventaOrigId:ventaOrig.id};
          ja.ventas=[...ja.ventas,reversa];
        }
      }
      ja.mandaditos=ja.mandaditos.map(m=>m.pedidoId===pedidoId?{...m,cobrado:false,metodoPago:null}:m);
    }

    // Restore cobrado-cancelled: anular reversa, restore mandadito
    if(cambios.estado==='nuevo'&&pedOld.estado==='cancelado'&&pedOld.cobrado){
      const ventaOrig=ja.ventas.find(v=>v.pedidoId===pedidoId&&!v.esReversa);
      if(ventaOrig){
        ja.ventas=ja.ventas.map(v=>(v.pedidoId===pedidoId&&v.esReversa&&v.ventaOrigId===ventaOrig.id&&!v.anulada)?{...v,anulada:true,_ts:new Date().toISOString()}:v);
      }
      ja.mandaditos=ja.mandaditos.map(m=>m.pedidoId===pedidoId?{...m,cobrado:true,metodoPago:ventaOrig?.metodoPago||null}:m);
    }

    // ── RECONCILIACION FINAL DE LA VENTA ──────────────────────────────
    // La venta activa de un pedido cobrado SIEMPRE debe reflejar el estado
    // FINAL del pedido: monto de productos, items, costo de envio y metodo de
    // pago. Asi cualquier modificacion (incluido cambiar efectivo<->transferencia
    // por cualquier ruta: editar, recobrar, cambiar tipo de envio) se aplica al
    // calculo interno (caja y transferencias), no solo al texto en pantalla.
    // No corre para cancelados: su reversa ya quedo gestionada arriba.
    const pedFinal=ja.pedidos.find(p=>p.id===pedidoId);
    if(pedFinal&&pedFinal.cobrado&&pedFinal.estado!=='cancelado'){
      const idxOrig=ja.ventas.findIndex(v=>v.pedidoId===pedidoId&&!v.esReversa&&!v.anulada);
      const pagosFinal=normalizePagos(pedFinal.pagos||(idxOrig>=0?ja.ventas[idxOrig].pagos:null),Number(pedFinal.total)||0,pedFinal.metodoPago||(idxOrig>=0?ja.ventas[idxOrig].metodoPago:null));
      const metodoFinal=metodoFromPagos(pagosFinal,pedFinal.metodoPago||(idxOrig>=0?ja.ventas[idxOrig].metodoPago:null));
      const ventaFinal={
        items:pedFinal.items,
        total:Number(pedFinal.totalProductos)||0,
        totalCobrado:Number(pedFinal.total)||0,
        costoEnvio:Number(pedFinal.costoEnvio)||0,
        metodoPago:metodoFinal,
        pagos:pagosFinal
      };
      if(idxOrig>=0){
        ja.ventas=ja.ventas.map((v,i)=>i===idxOrig?{...v,...ventaFinal}:v);
      }else{
        ja.ventas=[...ja.ventas,{id:uid(),hora:now(),pedidoId,...ventaFinal}];
      }
      // El envio (mandadito) sigue el mismo metodo del pedido cobrado.
      ja.mandaditos=ja.mandaditos.map(m=>m.pedidoId===pedidoId?{...m,cobrado:true,metodoPago:metodoFinal}:m);
    }
    const js=state.jornadas.map(j=>j.id===ja.id?ja:j);
    // Editar tambien mantiene al dia el cliente frecuente (telefono/nombre/direccion).
    const pedFin=ja.pedidos.find(p=>p.id===pedidoId);
    const clientes=(cambios.telefono||cambios.cliente||cambios.direccion)&&pedFin
      ?upsertClienteList(state.clientes,{telefono:pedFin.telefono,nombre:pedFin.cliente,direccion:pedFin.direccion,etiqueta:cambios.etiquetaDir})
      :state.clientes;
    save({...state,clientes,jornadas:js,jornadaActiva:ja});
  },[state,save]);

  const registrarGasto=useCallback((categoria,descripcion,monto,enEfectivo=true)=>{
    if(!state.jornadaActiva)return;
    const m=Number(monto);
    if(!(m>0))return; // backstop: nunca persistir gastos negativos, cero o NaN
    const gasto={id:uid(),hora:now(),categoria,descripcion,monto:m,enEfectivo};
    const ja={...state.jornadaActiva,gastos:[...state.jornadaActiva.gastos,gasto]};
    const js=state.jornadas.map(j=>j.id===ja.id?ja:j);
    save({...state,jornadas:js,jornadaActiva:ja});
  },[state,save]);

  const eliminarGasto=useCallback(gastoId=>{
    if(!state.jornadaActiva)return;
    const ja={...state.jornadaActiva,gastos:state.jornadaActiva.gastos.filter(g=>g.id!==gastoId)};
    const js=state.jornadas.map(j=>j.id===ja.id?ja:j);
    save({...state,jornadas:js,jornadaActiva:ja});
  },[state,save]);

  const actualizarGasto=useCallback((gastoId,cambios)=>{
    if(!state.jornadaActiva)return;
    if(cambios.monto!=null&&!(Number(cambios.monto)>0))return; // backstop anti monto invalido
    const ja={...state.jornadaActiva,gastos:state.jornadaActiva.gastos.map(g=>g.id===gastoId?{
      ...g,
      ...cambios,
      monto:Number(cambios.monto??g.monto)||0,
      _ts:new Date().toISOString()
    }:g)};
    const js=state.jornadas.map(j=>j.id===ja.id?ja:j);
    save({...state,jornadas:js,jornadaActiva:ja});
  },[state,save]);

  // ─── CAJA: salidas/entradas explicitas y pago a repartidor (opt-in) ───
  // Movimiento real de caja con motivo obligatorio. tipo: 'salida' resta,
  // 'entrada' suma. NO se usa para faltante/sobrante (eso es resultado del
  // conteo, no una causa).
  const registrarAjusteCaja=useCallback(({tipo,monto,motivo})=>{
    if(!state.jornadaActiva)return;
    const m=Number(monto)||0;
    if(m<=0||!String(motivo||'').trim())return; // motivo obligatorio
    const ajuste={id:uid(),hora:now(),_ts:new Date().toISOString(),tipo:tipo==='entrada'?'entrada':'salida',monto:m,motivo:String(motivo).trim()};
    const ja={...state.jornadaActiva,ajustesCaja:[...(state.jornadaActiva.ajustesCaja||[]),ajuste]};
    const js=state.jornadas.map(j=>j.id===ja.id?ja:j);
    save({...state,jornadas:js,jornadaActiva:ja});
  },[state,save]);

  const eliminarAjusteCaja=useCallback(ajusteId=>{
    if(!state.jornadaActiva)return;
    const ja={...state.jornadaActiva,ajustesCaja:(state.jornadaActiva.ajustesCaja||[]).filter(a=>a.id!==ajusteId)};
    const js=state.jornadas.map(j=>j.id===ja.id?ja:j);
    save({...state,jornadas:js,jornadaActiva:ja});
  },[state,save]);

  // Registra el efectivo del cajon entregado al repartidor por un envio.
  // Opt-in por mandadito; nunca automatico. monto<=0 limpia el registro.
  const registrarPagoRepartidor=useCallback((pedidoId,monto)=>{
    if(!state.jornadaActiva)return;
    const m=Number(monto)||0;
    const ja={...state.jornadaActiva,mandaditos:(state.jornadaActiva.mandaditos||[]).map(x=>
      x.pedidoId===pedidoId?{...x,pagoRepartidorEfectivo:m>0?m:0,_ts:new Date().toISOString()}:x)};
    const js=state.jornadas.map(j=>j.id===ja.id?ja:j);
    save({...state,jornadas:js,jornadaActiva:ja});
  },[state,save]);

  // Pago masivo: marca como pagado al repartidor (desde efectivo) TODOS los
  // envios cobrados pendientes (tarifa>0 y sin pagoRepartidorEfectivo>0).
  // Conserva los pagos ya registrados manualmente. Solo accion explicita del
  // usuario; no toca pedidos/ventas/gastos/transferencias ni jornada cerrada.
  const pagarRepartidoresPendientes=useCallback(()=>{
    if(!state.jornadaActiva)return;
    const stamp=new Date().toISOString();
    const mandaditos=(state.jornadaActiva.mandaditos||[]).map(m=>{
      const pendiente=m.cobrado&&(Number(m.tarifa)||0)>0&&!((Number(m.pagoRepartidorEfectivo)||0)>0);
      return pendiente?{...m,pagoRepartidorEfectivo:Number(m.tarifa)||0,_ts:stamp}:m;
    });
    const ja={...state.jornadaActiva,mandaditos};
    const js=state.jornadas.map(j=>j.id===ja.id?ja:j);
    save({...state,jornadas:js,jornadaActiva:ja});
  },[state,save]);

  const agregarProducto=useCallback((datos)=>{
    const nombre=(datos.nombre||'').trim();
    if(!nombre)return;
    const baseId=nombre.toLowerCase()
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g,'')
      .replace(/[^a-z0-9]+/g,'_')
      .replace(/^_+|_+$/g,'')||uid();
    const finalId=state.productos.some(p=>p.id===baseId)?`${baseId}_${Date.now().toString(36)}`:baseId;
    const nuevo={
      id:finalId,
      nombre,
      precio:Number(datos.precio)||0,
      costo:Number(datos.costo)||0,
      cat:datos.cat||'platillo',
      emoji:(datos.emoji||'🍽️').trim()||'🍽️',
      activo:datos.activo!==false
    };
    save({...state,productos:[...state.productos,nuevo]});
  },[state,save]);
  const actualizarProducto=useCallback((pid,datos)=>{save({...state,productos:state.productos.map(p=>p.id===pid?{...p,...datos}:p)});},[state,save]);
  const actualizarGastoFijo=useCallback((gid,monto)=>{save({...state,gastosFijos:state.gastosFijos.map(g=>g.id===gid?{...g,monto:Number(monto)}:g)});},[state,save]);
  const agregarGastoFijo=useCallback((nombre)=>{const id=uid();save({...state,gastosFijos:[...state.gastosFijos,{id,nombre,monto:0}]});},[state,save]);
  const eliminarGastoFijo=useCallback((gid)=>{save({...state,gastosFijos:state.gastosFijos.filter(g=>g.id!==gid)});},[state,save]);
  const actualizarImpresora=useCallback(datos=>{save({...state,impresora:{...state.impresora,...datos}});},[state,save]);
  const importarProductos=useCallback(prods=>{save({...state,productos:prods});},[state,save]);
  const importarCostos=useCallback(costos=>{save({...state,costos});},[state,save]);
  // Empleados CRUD
  const agregarEmpleado=useCallback((nombre,rol,sueldo)=>{save({...state,empleados:[...state.empleados,{id:uid(),nombre,rol,sueldo:Number(sueldo)||0}]});},[state,save]);
  const editarEmpleado=useCallback((eid,datos)=>{save({...state,empleados:state.empleados.map(e=>e.id===eid?{...e,...datos,sueldo:Number(datos.sueldo)||0}:e)});},[state,save]);
  const eliminarEmpleado=useCallback((eid)=>{save({...state,empleados:state.empleados.filter(e=>e.id!==eid)});},[state,save]);
  // Clientes frecuentes CRUD (gestion manual desde Admin). El alta rapida vive en
  // el flujo de pedido (upsertClienteList); aqui se editan datos y direcciones.
  const guardarCliente=useCallback((cid,datos)=>{
    const ts=new Date().toISOString();
    const cli=Array.isArray(state.clientes)?state.clientes:[];
    if(cid){save({...state,clientes:cli.map(c=>c.id===cid?{...c,...datos,_ts:ts}:c)});}
    else{save({...state,clientes:[...cli,{id:uid(),telefono:'',nombre:'',direcciones:[],...datos,_ts:ts}]});}
  },[state,save]);
  const eliminarCliente=useCallback((cid)=>{save({...state,clientes:(state.clientes||[]).filter(c=>c.id!==cid)});},[state,save]);
  // Borrado en lote (depuracion): una sola escritura para no perder estado por
  // cierres obsoletos si se llamara eliminarCliente en bucle.
  const eliminarClientes=useCallback((ids)=>{const set=new Set(ids||[]);if(!set.size)return;save({...state,clientes:(state.clientes||[]).filter(c=>!set.has(c.id))});},[state,save]);

  return{state,syncStatus,remoteNotice,cloudRecovery,setCloudRecovery,lastCloudAt,deviceInfo,saveError,abrirJornada,cerrarJornada,crearPedido,actualizarPedido,
    registrarAjusteCaja,eliminarAjusteCaja,registrarPagoRepartidor,pagarRepartidoresPendientes,
    registrarGasto,eliminarGasto,actualizarGasto,agregarProducto,actualizarProducto,actualizarGastoFijo,agregarGastoFijo,eliminarGastoFijo,
    actualizarImpresora,importarProductos,importarCostos,agregarEmpleado,editarEmpleado,eliminarEmpleado,
    guardarCliente,eliminarCliente,eliminarClientes,
    syncNow,pullFromCloud,setDeviceRole,listBackups,restoreBackup,auditHistoricalData,repairHistoricalData};
}

// ─── UTILS ──────────────────────────────────────────────────────────
const fmt=n=>{const v=Number(n||0);return(v<0?'-$':'$')+Math.abs(v).toLocaleString('es-MX',{minimumFractionDigits:0,maximumFractionDigits:0});};
const fmtDate=iso=>{if(!iso)return'';const d=new Date(iso+'T12:00:00');return d.toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long',year:'numeric'});};
const fmtDateShort=iso=>{if(!iso)return'';const d=new Date(iso+'T12:00:00');return d.toLocaleDateString('es-MX',{day:'numeric',month:'short'});};
const fmtDateTime=iso=>{if(!iso)return'Sin registro';const d=new Date(iso);return d.toLocaleString('es-MX',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});};
const pct=(a,b)=>b>0?((a/b)*100).toFixed(1)+'%':'0%';
const calcGastosTotal=(gastos=[])=>gastos.reduce((s,g)=>s+(Number(g.monto)||0),0);

// ─── SISTEMA DE ICONOS SVG (estilo lucide/feather, sin dependencias) ────────
// Paths inline en grid 24px, stroke currentColor. Estos son iconos de UI
// (sistema). Los iconos de PRODUCTO (comida) usan Twemoji plano via ProductChip.
const ICONS={
  home:<g><path d="M3 9.5 12 3l9 6.5V20a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="M9 22v-8h6v8"/></g>,
  orders:<g><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></g>,

function Icon({name,size=18,className='',strokeWidth=2,label}){
  const paths=ICONS[name];
  if(!paths)return null;
  return(<svg viewBox="0 0 24 24" width={size} height={size} fill="none" stroke="currentColor"
    strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round"
    className={`inline-block align-[-0.18em] shrink-0 ${className}`}
    aria-hidden={label?undefined:'true'} role={label?'img':undefined} aria-label={label}>{paths}</svg>);
}
// Etiqueta de metodo de pago: icono(s) + accesibilidad. Sustituye a los
// emojis 💵/📱 en badges y listas.
function PagoTag({metodo,size=13,withText=false}){
  const label=metodo==='mixto'?'Mixto':metodo==='transferencia'?'Transferencia':metodo==='efectivo'?'Efectivo':'Sin método';
  return(<span className="inline-flex items-center gap-1" role="img" aria-label={`Pago: ${label}`}>
    {(metodo==='efectivo'||metodo==='mixto')&&<Icon name="cash" size={size}/>}
    {(metodo==='transferencia'||metodo==='mixto')&&<Icon name="phone" size={size}/>}
    {!metodo&&<span aria-hidden="true">—</span>}
    {withText&&<span>{label}</span>}
  </span>);
}

// ─── INTELLIGENCE ENGINE ────────────────────────────────────────────
function analyzeHistorico(jornadas,productos){
  const cerradas=jornadas.filter(j=>j.estado==='cerrada');
  if(!cerradas.length)return null;

  // Cifras desde buildCajaModel: misma fuente que dashboard, modal de cierre
  // y ticket. No usar el ledger de ventas directo aqui.
  const models=new Map(cerradas.map(j=>[j.id,buildCajaModel(j)]));
  // Analisis por dia de la semana
  const porDia={};
  cerradas.forEach(j=>{
    const d=new Date(j.fecha+'T12:00:00');
    const dia=d.toLocaleDateString('es-MX',{weekday:'long'});
    if(!porDia[dia])porDia[dia]={ventas:0,pedidos:0,count:0};
    const mj=models.get(j.id);
    porDia[dia].ventas+=mj.productosTotal;
    porDia[dia].pedidos+=mj.countCobrados;
    porDia[dia].count++;
  });

  // Mejor y peor dia
  const dias=Object.entries(porDia).map(([d,v])=>({dia:d,promVentas:v.ventas/v.count,promPedidos:v.pedidos/v.count,count:v.count}));
  dias.sort((a,b)=>b.promVentas-a.promVentas);
  const mejorDia=dias[0]||null;
  const peorDia=dias[dias.length-1]||null;

  // Tendencia (ultimas 3 vs anteriores)
  const ultimas3=cerradas.slice(-3);
  const anteriores=cerradas.slice(0,-3);
  const promUlt=ultimas3.length?ultimas3.reduce((s,j)=>s+models.get(j.id).productosTotal,0)/ultimas3.length:0;
  const promAnt=anteriores.length?anteriores.reduce((s,j)=>s+models.get(j.id).productosTotal,0)/anteriores.length:0;
  const tendencia=promAnt>0?((promUlt-promAnt)/promAnt*100):0;

  // Productos top por volumen y por rentabilidad
  const stats=getProductoStats(jornadas,productos);
  const topVolumen=stats.filter(s=>s.cantidad>0).sort((a,b)=>b.cantidad-a.cantidad).slice(0,5);
  const topRentable=stats.filter(s=>s.cantidad>0&&s.precio>0).map(s=>({...s,margen:((s.precio-s.costo)/s.precio*100)})).sort((a,b)=>b.margen-a.margen).slice(0,5);
  const topRevenue=stats.filter(s=>s.cantidad>0).sort((a,b)=>b.revenue-a.revenue).slice(0,5);

  // Hora pico (basado en hora de pedidos)
  const horaCounts={};
  cerradas.forEach(j=>(j.pedidos||[]).forEach(p=>{
    if(p.estado!=='cancelado'&&p.hora){
      const h=p.hora.split(':')[0];
      horaCounts[h]=(horaCounts[h]||0)+1;
    }
  }));
  const horaPico=Object.entries(horaCounts).sort((a,b)=>b[1]-a[1])[0];

  // Tasa de envio vs recoger
  const totalPedidos=cerradas.reduce((s,j)=>s+(j.pedidos||[]).filter(p=>p.estado!=='cancelado').length,0);
  const totalEnvios=cerradas.reduce((s,j)=>s+(j.pedidos||[]).filter(p=>(Number(p.costoEnvio)||0)>0&&p.estado!=='cancelado').length,0);
  const tasaEnvio=totalPedidos>0?(totalEnvios/totalPedidos*100):0;

  // Ticket promedio = dinero cobrado real / pedidos cobrados. Excluye
  // cancelados (aunque su venta original siga activa junto a la reversa) y
  // pendientes; incluye envio porque es lo que realmente pago el cliente.
  const totCobrado=cerradas.reduce((s,j)=>s+models.get(j.id).cobrosTotal,0);
  const totTickets=cerradas.reduce((s,j)=>s+models.get(j.id).countCobrados,0);
  const ticketProm=totTickets>0?totCobrado/totTickets:0;

  // Generar insights inteligentes
  const insights=[];
  // icon = nombre de icono SVG (componente Icon); los textos no llevan emojis
  // (tambien mejora el PDF: helvetica no puede pintar emojis).
  if(mejorDia)insights.push({icon:'calendar',type:'info',text:`Tu mejor dia es ${mejorDia.dia} con promedio de ${fmt(mejorDia.promVentas)} en ventas.`});
  if(peorDia&&peorDia.dia!==mejorDia?.dia)insights.push({icon:'trendDown',type:'warn',text:`${peorDia.dia} es tu dia mas bajo (${fmt(peorDia.promVentas)} prom). Considera promociones especiales.`});
  if(tendencia>10)insights.push({icon:'trendUp',type:'ok',text:`Tendencia positiva: ventas subieron ${tendencia.toFixed(0)}% vs jornadas anteriores.`});
  else if(tendencia<-10)insights.push({icon:'alert',type:'warn',text:`Alerta: ventas bajaron ${Math.abs(tendencia).toFixed(0)}% en las ultimas jornadas.`});
  if(topVolumen[0])insights.push({icon:'star',type:'info',text:`${topVolumen[0].nombre} es el mas pedido (${topVolumen[0].cantidad} pz). Nunca te quedes sin stock.`});
  if(topRentable[0])insights.push({icon:'sparkles',type:'ok',text:`${topRentable[0].nombre} tiene el mejor margen (${topRentable[0].margen.toFixed(0)}%). Promocionalo mas.`});
  if(tasaEnvio>50)insights.push({icon:'bike',type:'info',text:`${tasaEnvio.toFixed(0)}% de pedidos son envios. Evalua ajustar tarifas o agregar repartidor.`});
  if(horaPico)insights.push({icon:'clock',type:'info',text:`Hora pico: ${horaPico[0]}:00 hrs (${horaPico[1]} pedidos). Asegura personal suficiente.`});
  if(ticketProm>0)insights.push({icon:'receipt',type:'info',text:`Ticket promedio: ${fmt(ticketProm)}. Considera combos para subirlo.`});

  return{porDia:dias,mejorDia,peorDia,tendencia,topVolumen,topRentable,topRevenue,horaPico,tasaEnvio,ticketProm,insights,totalJornadas:cerradas.length};
}

function generarPDF(tipo,jornadas,productos){
  const{jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:'mm',format:'letter'});
  const W=doc.internal.pageSize.getWidth();
  const H=doc.internal.pageSize.getHeight();
  const now=new Date();
  const ML=18,MR=W-18;
  let y=15;
  let pageNum=1;

  const checkPage=(need=12)=>{if(y>H-25-need){addPageFooter();doc.addPage();pageNum++;y=15;}};
  const addPageFooter=()=>{
    doc.setFontSize(7);doc.setTextColor(160);
    doc.text(`Pagina ${pageNum}`,W/2,H-8,{align:'center'});
    doc.text("K'apul'Its - "+NEGOCIO.telefono,W/2,H-4,{align:'center'});
    doc.setTextColor(0);
  };

  const addHeader=()=>{
    doc.setFillColor(234,88,12);doc.rect(0,0,W,28,  'F');
    doc.setFontSize(20);doc.setFont('helvetica','bold');doc.setTextColor(255);
    doc.text("K'apul'Its",W/2,12,{align:'center'});
