// ─── PRINTER SANITIZER (ASCII for 58mm thermal) ────────────────────
const ACCENT_MAP={'á':'a','é':'e','í':'i','ó':'o','ú':'u','ñ':'n','Á':'A','É':'E','Í':'I','Ó':'O','Ú':'U','Ñ':'N',
  '¡':'!','¿':'?','ü':'u','Ü':'U','à':'a','è':'e','ì':'i','ò':'o','ù':'u','\u2019':"'"};
const EMOJI_MAP={'🛵':'ENV','🚗':'ENV','🏃':'REC','📍':'Dir:','📝':'Nota:','🙏':'','💰':'$','✅':'OK',
  '🍲':'','🌮':'','🫓':'','🧀':'','🥙':'','🫔':'','🥪':'','🍜':'','🥤':'','🍹':'','🥛':'','🧪':'',
  '🎉':'','🌟':'','━':'-','─':'-','│':'|'};

function sanitize(text){
  let r='';
  for(const ch of text){
    if(ACCENT_MAP[ch]!==undefined){r+=ACCENT_MAP[ch];}
    else if(EMOJI_MAP[ch]!==undefined){r+=EMOJI_MAP[ch];}
    else if(ch.codePointAt(0)<128){r+=ch;}
  }
  return r;
}

function getProductoStats(jornadas,productos){
  const stats={};
  // El descriptor variado no genera fila base: cada variante se agrupa abajo
  // por nombre normalizado, no como un unico producto de precio fijo.
  productos.forEach(p=>{if(p.esVariado)return;stats[p.id]={id:p.id,nombre:p.nombre,precio:p.precio,costo:p.costo,emoji:p.emoji,cat:p.cat,cantidad:0,revenue:0};});
  jornadas.forEach(j=>{
    // Excluir la venta original de pedidos cancelados: su reversa activa la
    // neutraliza en dinero, pero los items solo viven en la original y sin
    // este filtro inflarian cantidades e ingreso por producto.
    const act=ventasActivas(j.ventas);
    const revIds=new Set(act.filter(v=>v.esReversa).map(v=>v.ventaOrigId));
    act.filter(v=>!v.esReversa&&!revIds.has(v.id)).forEach(v=>{v.items.forEach(item=>{
    if(item.esVariado||item.productoId==='variado'){
      const key='variado::'+normVariadoNombre(item.nombre);
      if(!stats[key])stats[key]={id:key,nombre:(String(item.nombre||'').trim()||'Variado'),precio:0,costo:0,emoji:item.emoji||'🧪',cat:'variado',cantidad:0,revenue:0,esVariado:true};
      stats[key].cantidad+=item.cantidad;stats[key].revenue+=item.subtotal;
    }else if(stats[item.productoId]){stats[item.productoId].cantidad+=item.cantidad;stats[item.productoId].revenue+=item.subtotal;}
  });});});
  // Precio representativo del variado = promedio real cobrado (costo 0 => 100% margen).
  Object.values(stats).forEach(s=>{if(s.esVariado&&s.cantidad>0)s.precio=_roundMoney(s.revenue/s.cantidad);});
  return Object.values(stats).sort((a,b)=>b.revenue-a.revenue);
}

function calcProjections(jornadas){
  const cerradas=jornadas.filter(j=>j.estado==='cerrada');
  if(!cerradas.length)return null;
  // Series desde buildCajaModel (fuente unica de cifras contables).
  const models=cerradas.map(j=>buildCajaModel(j));
  const revenues=models.map(m=>m.productosTotal);
  const expenses=models.map(m=>m.gastosTotal);
  const profits=models.map(m=>m.utilidadBrutaProductos);
  const mandas=models.map(m=>m.enviosTotal);
  const recoger=cerradas.map(j=>(j.pedidos||[]).filter(p=>p.tipoEntrega==='recoger'&&p.estado!=='cancelado').length);
  const envios=cerradas.map(j=>(j.pedidos||[]).filter(p=>(Number(p.costoEnvio)||0)>0&&p.estado!=='cancelado').length);
  const avg=a=>a.reduce((s,v)=>s+v,0)/a.length;
  const avgR=avg(revenues),avgE=avg(expenses),avgP=avg(profits),avgM=avg(mandas);
  const margin=avgR>0?(avgP/avgR*100):0;
  return{jornadasCount:cerradas.length,avgRevenue:avgR,avgExpenses:avgE,avgProfit:avgP,margin,
    projRevenue:avgR*4,projExpenses:avgE*4,projProfit:avgP*4,
    revenues,expenses,profits,mandas,dates:cerradas.map(j=>j.fecha),
    avgMandaditos:avgM,projMandaditos:avgM*4,
    totalRecoger:recoger.reduce((a,b)=>a+b,0),totalEnvios:envios.reduce((a,b)=>a+b,0)};
}

function getRecomendaciones(proj,stats){
  if(!proj)return[];const recs=[];
  if(proj.margin<25)recs.push({type:'warn',icon:'alert',text:`Margen de utilidad: ${proj.margin.toFixed(1)}%. Revisa costos o ajusta precios.`});
  else if(proj.margin>50)recs.push({type:'ok',icon:'sparkles',text:`Excelente! Margen del ${proj.margin.toFixed(1)}%.`});
  else recs.push({type:'ok',icon:'check',text:`Margen de ${proj.margin.toFixed(1)}% saludable.`});
  const top=stats.filter(s=>s.cantidad>0).sort((a,b)=>b.cantidad-a.cantidad)[0];
  if(top)recs.push({type:'info',icon:'star',text:`Producto estrella: ${top.nombre} (${top.cantidad} pz). Asegura stock!`});
  const mp=stats.filter(s=>s.cantidad>0&&s.precio>0).map(s=>({...s,m:(s.precio-s.costo)/s.precio*100})).sort((a,b)=>b.m-a.m)[0];
  if(mp)recs.push({type:'info',icon:'bulb',text:`Mayor rentabilidad: ${mp.nombre} con ${mp.m.toFixed(0)}% margen. Promuevelo!`});
  recs.push({type:'info',icon:'trendUp',text:`Proyeccion mensual (4 jornadas): ${fmt(proj.projRevenue)} ventas, ${fmt(proj.projProfit)} utilidad.`});
  if(proj.totalEnvios>0||proj.totalRecoger>0){
    recs.push({type:'info',icon:'bike',text:`Envios: ${proj.totalEnvios} - Recogen: ${proj.totalRecoger}. Mandaditos proyectados: ${fmt(proj.projMandaditos)}/mes.`});
  }
  return recs;
}

// ─── PRINTER ────────────────────────────────────────────────────────
let printerCharacteristic=null;
let _btDevice=null;
let _keepaliveTimer=null;
let _reconnectTimer=null;
let _reconnectAttempt=0;
let _onPrinterStateChange=null;
const BT_SERVICES=['000018f0-0000-1000-8000-00805f9b34fb','e7810a71-73ae-499d-8c15-faa9aef0c3f2','49535343-fe7d-4ae5-8fa9-9fafd205e455'];

// ─── USB PRINTER ───────────────────────────────────────────────────
let _usbDevice=null;
let _usbEndpoint=null;

async function connectUSB(){
  try{
    const device=await navigator.usb.requestDevice({filters:[
      {vendorId:0x0416},{vendorId:0x0483},{vendorId:0x04B8},{vendorId:0x0525},{vendorId:0x1FC9},
      {classCode:7}
    ]});
    await device.open();
    const iface=device.configuration.interfaces.find(i=>
      i.alternate.endpoints.some(e=>e.direction==='out'));
    if(!iface)throw new Error('No se encontro interfaz de salida');
    await device.claimInterface(iface.interfaceNumber);
    const ep=iface.alternate.endpoints.find(e=>e.direction==='out');
    _usbDevice=device;
    _usbEndpoint=ep.endpointNumber;
    return{success:true,name:device.productName||'Impresora USB'};
  }catch(e){return{success:false,error:e.message};}
}

async function _sendToUSB(text){
  if(!_usbDevice||!_usbEndpoint)throw new Error('USB no conectado');
  const data=new Uint8Array([...text].map(c=>c.charCodeAt(0)&0x7F));
  const CHUNK=64;
  for(let i=0;i<data.length;i+=CHUNK){
    await _usbDevice.transferOut(_usbEndpoint,data.slice(i,i+CHUNK));
  }
}

async function tryAutoConnectUSB(){
  if(!navigator.usb?.getDevices)return false;
  try{
    const devices=await navigator.usb.getDevices();
    for(const device of devices){
      try{
        await device.open();
        const iface=device.configuration.interfaces.find(i=>
          i.alternate.endpoints.some(e=>e.direction==='out'));
        if(!iface)continue;
        await device.claimInterface(iface.interfaceNumber);
        const ep=iface.alternate.endpoints.find(e=>e.direction==='out');
        _usbDevice=device;
        _usbEndpoint=ep.endpointNumber;
        return true;
      }catch(e){}
    }
  }catch(e){}
  return false;
}

async function _findCharacteristic(server){
  let service;
  for(const sid of BT_SERVICES){try{service=await server.getPrimaryService(sid);break;}catch(e){}}
  if(!service){const svcs=await server.getPrimaryServices();if(svcs.length)service=svcs[0];}
  if(service){const chars=await service.getCharacteristics();
    return chars.find(c=>c.properties.write||c.properties.writeWithoutResponse)||chars[0];}
  return null;
}

// Keepalive: NULL byte que las impresoras ESC/POS descartan silenciosamente.
// Mantiene el canal GATT vivo y evita que Android duerma la conexion.
function _startKeepalive(){
  _stopKeepalive();
  _keepaliveTimer=setInterval(async()=>{
    if(!printerCharacteristic)return;
    try{await printerCharacteristic.writeValue(new Uint8Array([0x00]));}
    catch(e){/* si falla, el evento disconnect dispara reconexion */}
  },25000);
}
function _stopKeepalive(){if(_keepaliveTimer){clearInterval(_keepaliveTimer);_keepaliveTimer=null;}}

function _handleDisconnect(){
  printerCharacteristic=null;
  _stopKeepalive();
  if(_onPrinterStateChange)_onPrinterStateChange({conectada:false,reconectando:true});
  _reconnectAttempt=0;
  _scheduleReconnect();
}

function _scheduleReconnect(){
  if(_reconnectTimer)clearTimeout(_reconnectTimer);
  _reconnectAttempt++;
  if(_reconnectAttempt>8){
    if(_onPrinterStateChange)_onPrinterStateChange({conectada:false,reconectando:false});
    return;
  }
  const delay=Math.min(1000*Math.pow(2,_reconnectAttempt-1),20000);
  _reconnectTimer=setTimeout(async()=>{
    const ok=await reconnectBluetooth();
    if(ok){
      _reconnectAttempt=0;
      _startKeepalive();
      if(_onPrinterStateChange)_onPrinterStateChange({conectada:true,reconectando:false});
    } else {
      _scheduleReconnect();
    }
  },delay);
}

async function connectBluetooth(){
  try{
    const device=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:BT_SERVICES});
    _btDevice=device;
    device.addEventListener('gattserverdisconnected',_handleDisconnect);
    const server=await device.gatt.connect();
    printerCharacteristic=await _findCharacteristic(server);
    if(printerCharacteristic)_startKeepalive();
    return{success:true,name:device.name||'Impresora BT'};
  }catch(e){return{success:false,error:e.message};}
}

async function reconnectBluetooth(){
  // Intento 1: reconectar dispositivo guardado en memoria
  if(_btDevice&&!_btDevice.gatt.connected){
    try{
      const server=await _btDevice.gatt.connect();
      printerCharacteristic=await _findCharacteristic(server);
      if(printerCharacteristic){_startKeepalive();return true;}
    }catch(e){}
  }
  // Intento 2: buscar dispositivos previamente pareados (Chrome 85+)
  if(navigator.bluetooth?.getDevices){
    try{
      const devices=await navigator.bluetooth.getDevices();
      for(const dev of devices){
        try{
          const server=await dev.gatt.connect();
          _btDevice=dev;
          dev.addEventListener('gattserverdisconnected',_handleDisconnect);
          printerCharacteristic=await _findCharacteristic(server);
          if(printerCharacteristic){_startKeepalive();return true;}
        }catch(e){}
      }
    }catch(e){}
  }
  return false;
}

// Auto-conectar al arrancar la app sin mostrar prompt (usa dispositivos ya autorizados)
async function tryAutoConnectPrinter(){
  if(!navigator.bluetooth?.getDevices)return false;
  try{
    const devices=await navigator.bluetooth.getDevices();
    if(!devices.length)return false;
    return await reconnectBluetooth();
  }catch(e){return false;}
}

// Impresora termica de 58mm = 32 columnas por linea (Font A). Si un texto
// excede el ancho, la impresora lo corta a mitad de palabra: feo. Estas helpers
// envuelven por PALABRA (no por caracter) para lectura profesional.
const TICKET_COLS=32;
// Envuelve `text` a `width` columnas sin partir palabras. Solo parte una
// palabra si por si sola no cabe en una linea (ultimo recurso).
function _wrapWords(text,width){
  const words=String(text==null?'':text).split(/\s+/).filter(Boolean);
  const out=[];let line='';
  for(let w of words){
    while(w.length>width){ if(line){out.push(line);line='';} out.push(w.slice(0,width)); w=w.slice(width); }
    if(!line)line=w;
    else if((line+' '+w).length<=width)line+=' '+w;
    else{out.push(line);line=w;}
  }
  if(line)out.push(line);
  return out.length?out:[''];
}
// Campo etiquetado con sangria colgante: la continuacion queda alineada bajo el
// valor. Ej: "  Dir: Calle muy larga\n       que no cabia".
function _ticketField(label,value,cols=TICKET_COLS){
  const base='  ';const inner=cols-base.length;const valWidth=Math.max(6,inner-label.length);
  const lines=_wrapWords(value,valWidth);const hang=' '.repeat(label.length);
  let s=base+label+(lines[0]||'')+'\n';
  for(let i=1;i<lines.length;i++)s+=base+hang+lines[i]+'\n';
  return s;
}
function _buildBTText(pedido){
  const tarifa=TARIFAS_ENVIO[pedido.tipoEntrega]||TARIFAS_ENVIO.recoger;
  const sep='-'.repeat(TICKET_COLS);
  let t=`\n      K'apul'Its\n    Birria y algo mas\n${sep}\n`;
  t+=`  PEDIDO #${String(pedido.numero).padStart(3,'0')}\n  ${pedido.fecha}  ${pedido.hora}\n`;
  if(pedido.cliente)t+=_ticketField('Cliente: ',pedido.cliente);
  if(pedido.telefono)t+=`  Tel: ${pedido.telefono}\n`;
  const tipoTxt=esMesa(pedido.tipoEntrega)?'LOCAL':(pedido.tipoEntrega==='recoger'?'REC':'ENV');
  t+=_ticketField(tipoTxt+' ',tarifa.label);
  if(pedido.direccion)t+=_ticketField('Dir: ',pedido.direccion);
  t+=sep+'\n';
  pedido.items.forEach(i=>{
    const nom=i.nombre.substring(0,18).padEnd(18);
    t+=` ${String(i.cantidad).padStart(2)}x ${nom} ${fmt(i.subtotal).padStart(7)}\n`;
  });
  t+=sep+'\n';
  if(pedido.notas){
    t+=`  Notas:\n`;
    _wrapWords(pedido.notas,TICKET_COLS-2).forEach(l=>{t+=`  ${l}\n`;});
    t+=sep+'\n';
  }
  if(pedido.costoEnvio>0)t+=`  Envio:        ${fmt(pedido.costoEnvio).padStart(10)}\n`;
  t+=`  TOTAL:        ${fmt(pedido.total).padStart(10)}\n${sep}\n`;
  _wrapWords(NEGOCIO.direccion,TICKET_COLS-2).forEach(l=>{t+=`  ${l}\n`;});
  t+=`  Tel.: ${NEGOCIO.telefono}\n  Gracias por tu compra!\n\n\n`;
  return sanitize(t);
}

async function _sendToBT(text){
  const data=new Uint8Array([...text].map(c=>c.charCodeAt(0)&0x7F));
  for(let i=0;i<data.length;i+=100){await printerCharacteristic.writeValue(data.slice(i,i+100));}
}

async function printTicket(pedido){
  snd.print();
  const ticket=_buildBTText(pedido);
  // Intentar Bluetooth
  if(!printerCharacteristic&&(_btDevice||navigator.bluetooth?.getDevices)){
    await reconnectBluetooth();
  }
  if(printerCharacteristic){
    try{
      await _sendToBT(ticket);
      return{success:true,method:'bluetooth'};
    }catch(e){
      printerCharacteristic=null;
      const ok=await reconnectBluetooth();
      if(ok){try{await _sendToBT(ticket);return{success:true,method:'bluetooth'};}catch(e2){}}
    }
  }
  // Intentar USB
  if(_usbDevice){
    try{await _sendToUSB(ticket);return{success:true,method:'usb'};}
    catch(e){_usbDevice=null;_usbEndpoint=null;}
  }
  if(!_usbDevice&&navigator.usb?.getDevices){
    const ok=await tryAutoConnectUSB();
    if(ok){try{await _sendToUSB(ticket);return{success:true,method:'usb'};}catch(e){}}
  }
  // Fallback: preview en-app
  if(_showTicketPreview)_showTicketPreview(pedido);
  return{success:true,method:'preview'};
}

async function printTicketsJornada(jornada){
  snd.print();
  const pedidos=[...(jornada?.pedidos||[])]
    .filter(p=>p&&p.estado!=='cancelado')
    .sort((a,b)=>(a.numero||0)-(b.numero||0));
  if(!pedidos.length)return{success:false,error:'Sin pedidos para imprimir'};

  if(!printerCharacteristic&&(_btDevice||navigator.bluetooth?.getDevices)){
    await reconnectBluetooth();
  }
  if(printerCharacteristic){
    try{await _sendToBT(text);return{success:true,method:'bluetooth',count:pedidos.length};}
    catch(e){
      printerCharacteristic=null;
      const ok=await reconnectBluetooth();
      if(ok){try{await _sendToBT(text);return{success:true,method:'bluetooth',count:pedidos.length};}catch(e2){}}
    }
  }
  if(_usbDevice){
    try{await _sendToUSB(text);return{success:true,method:'usb',count:pedidos.length};}
    catch(e){_usbDevice=null;_usbEndpoint=null;}
  }
  if(!_usbDevice&&navigator.usb?.getDevices){

// ─── CIERRE DE CAJA PRINT ───────────────────────────────────────────
// ─── DESGLOSE AUDITABLE DE CIERRE ───────────────────────────────────
// FUENTE DE VERDAD = EL PEDIDO (la ultima edicion del operador). Construye una
// fila por pedido (ordenado por folio, incluye cancelados) y los subtotales SE
// SUMAN DE ESTAS FILAS. Asi el total es literalmente la suma de lo que se ve y
// SIEMPRE refleja la ultima modificacion (monto, metodo, items, tipo de envio),
// nunca el primer guardado. La venta del ledger solo se usa como respaldo si el
// pedido no trae metodo de pago (datos muy viejos).
function buildCierreDesglose(jornada){
  const pedidos=[...(jornada?.pedidos||[])].sort((a,b)=>(a.numero||0)-(b.numero||0));
  const ventas=jornada?.ventas||[];
  const rows=pedidos.map(p=>{
    const cancelado=p.estado==='cancelado';
    const cobrado=!!p.cobrado&&!cancelado;
    const ventaOrig=ventas.find(v=>v.pedidoId===p.id&&!v.esReversa&&!v.anulada);
    const tieneEnvio=(Number(p.costoEnvio)||0)>0;
    const envio=(cobrado&&tieneEnvio)?(Number(p.costoEnvio)||0):0;
    const productos=Number(p.totalProductos)||0;
    const total=productos+envio;
    const metodoRef=p.metodoPago||ventaOrig?.metodoPago||null;
    let pagos=cobrado?normalizePagos(p.pagos||ventaOrig?.pagos,total,metodoRef):{efectivo:0,transferencia:0};
    // ESTADO FINAL MANDA: si el desglose de pagos (que pudo quedar congelado en
    // una venta legacy tras editar el pedido) no suma el total FINAL, se
    // reconcilia. Metodo unico => todo el total al metodo final; mixto => se
    // escala el split conservando la proporcion. La venta ledger es respaldo,
    // nunca fuente principal.
    if(cobrado){
      const sumP=(Number(pagos.efectivo)||0)+(Number(pagos.transferencia)||0);
      if(Math.abs(sumP-total)>0.5){
        const met=metodoFromPagos(pagos,metodoRef);
        if(met==='mixto'&&sumP>0){
          const ef=_roundMoney(pagos.efectivo*(total/sumP));
          pagos={efectivo:ef,transferencia:_roundMoney(total-ef)};
        }else{
          pagos=normalizePagos(null,total,met==='transferencia'?'transferencia':'efectivo');
        }
      }
    }
    const metodo=metodoFromPagos(pagos,metodoRef);
    return {
      folio:p.numero, pedidoId:p.id, cliente:p.cliente||'', tipoEntrega:p.tipoEntrega||'recoger',
      estado:cancelado?'cancelado':(cobrado?'cobrado':(p.estado||'nuevo')),
      cobrado, cancelado, metodo, envioMetodo:metodo,
      productos, envio, total, pagos,
      pagoEfectivo:pagos.efectivo, pagoTransferencia:pagos.transferencia,
      cuentaCaja:cobrado, // solo los cobrados-no-cancelados suman a caja
    };
  });
  const sum=(pred,field)=>rows.filter(pred).reduce((s,r)=>s+r[field],0);
  const totals={
    productosEfectivo: sum(r=>r.cuentaCaja&&r.metodo==='efectivo','productos'),
    productosTransfer: sum(r=>r.cuentaCaja&&r.metodo==='transferencia','productos'),
    productosMixto:    sum(r=>r.cuentaCaja&&r.metodo==='mixto','productos'),
    productos:         sum(r=>r.cuentaCaja,'productos'),
    servicios:         sum(r=>r.cuentaCaja,'total'),
    cobrosEfectivo:    sum(r=>r.cuentaCaja,'pagoEfectivo'),
    cobrosTransfer:    sum(r=>r.cuentaCaja,'pagoTransferencia'),
    enviosEfectivo:    sum(r=>r.envioMetodo==='efectivo','envio'),
    enviosTransfer:    sum(r=>r.envioMetodo==='transferencia','envio'),
    enviosMixto:       sum(r=>r.envioMetodo==='mixto','envio'),
    envios:            sum(()=>true,'envio'),
    canceladas:        rows.filter(r=>r.cancelado).map(r=>r.folio),
    countCobrados:     rows.filter(r=>r.cuentaCaja).length,
  };
  totals.transferenciaTotal=totals.cobrosTransfer;
  totals.efectivoIngresos=totals.cobrosEfectivo;
  return {rows,totals};
}

// ─── MODELO CONTABLE UNICO DEL CIERRE ───────────────────────────────
// buildCajaModel es la UNICA fuente de verdad del corte: modal, ticket
// impreso, preview y resumenes consumen este objeto. No duplicar formulas
// en componentes. Es puro: no muta jornada ni datos.
//
// Conceptos clave para no confundir cifras:
//  - "real": dinero que efectivamente entro (cobrosEfectivo/Transferencia).
//    Incluye el envio cobrado, porque el envio es dinero fisico del cajon.
//  - "productos": ingreso por platillos (utilidad), NO es caja fisica.
//  - "esperada": lo que DEBE haber en caja/banco segun los cobros.
// Por eso las etiquetas "real" viven SOLO en el bloque de cobros, y la
// transferencia aparece como "real" (cobros) y como "esperada" (banco),
// nunca con tres nombres ambiguos.
function buildCajaModel(jornada){
  const j=jornada||{};
  const desg=buildCierreDesglose(j);
  const t=desg.totals;
  const num=n=>Number(n)||0;
  // Gastos: caja fisica solo descuenta los pagados en efectivo (enEfectivo!==false).
  const gastos=j.gastos||[];
  const gastosTotal=gastos.reduce((s,g)=>s+num(g.monto),0);
  const gastosCaja=gastos.filter(g=>g.enEfectivo!==false).reduce((s,g)=>s+num(g.monto),0);
  const gastosOtroMedio=_roundMoney(gastosTotal-gastosCaja);
  // Cobros reales (unico bloque que usa "real").
  const cobrosEfectivo=t.cobrosEfectivo;
  const cobrosTransferencia=t.cobrosTransfer;
  const cobrosTotal=_roundMoney(cobrosEfectivo+cobrosTransferencia);
  // Operativo.
  const productosTotal=t.productos;
  const enviosTotal=t.envios;
  const countCobrados=t.countCobrados;
  const countCancelados=t.canceladas.length;
  const countPendientes=desg.rows.filter(r=>!r.cobrado&&!r.cancelado).length;
  // Salidas de efectivo OPT-IN que reducen la caja fisica:
  //  - mandaditosPagadosEfectivo: efectivo del cajon entregado al repartidor.
  //    Solo cuenta lo que el operador registro en cada envio (nunca automatico).
  //  - salidasCaja / entradasCaja: movimientos reales de caja registrados
  //    explicitamente (con motivo). NO incluye faltante/sobrante: esos son el
  //    RESULTADO del conteo (diferencia), nunca una causa que fuerce el cuadre.
  const mandaditos=j.mandaditos||[];
  const mandaditosPagadosEfectivo=mandaditos.reduce((s,m)=>s+num(m.pagoRepartidorEfectivo),0);
  const ajustes=j.ajustesCaja||[];
  const salidasCaja=ajustes.filter(a=>a.tipo==='salida').reduce((s,a)=>s+num(a.monto),0);
  const entradasCaja=ajustes.filter(a=>a.tipo==='entrada').reduce((s,a)=>s+num(a.monto),0);
  // Conciliacion de caja fisica.
  const fondoInicial=num(j.fondoInicial);
  const cajaEsperada=_roundMoney(fondoInicial+cobrosEfectivo-gastosCaja-mandaditosPagadosEfectivo-salidasCaja+entradasCaja);
  const transferenciaEsperada=cobrosTransferencia;
  const dineroOperado=_roundMoney(cajaEsperada+transferenciaEsperada);
  const efectivoContado=j.totalEfectivo!=null?num(j.totalEfectivo):null;
  const diferencia=efectivoContado!=null?_roundMoney(efectivoContado-cajaEsperada):null;
  // Utilidad del negocio (productos menos todos los gastos).
  const utilidadBrutaProductos=_roundMoney(productosTotal-gastosTotal);
  const warnings=_validarCaja(j,desg,gastos);
  return {
    rows:desg.rows,
    // A. cobros reales
    cobrosEfectivo, cobrosTransferencia, cobrosTotal,
    // B. operativo
    productosTotal, enviosTotal,
    productosEfectivo:t.productosEfectivo, productosTransfer:t.productosTransfer, productosMixto:t.productosMixto,
    enviosEfectivo:t.enviosEfectivo, enviosTransfer:t.enviosTransfer, enviosMixto:t.enviosMixto,
    countCobrados, countPendientes, countCancelados, canceladas:t.canceladas,
    // C. gastos
    gastosTotal, gastosCaja, gastosOtroMedio,
    // D. caja fisica
    fondoInicial, cajaEsperada, transferenciaEsperada, dineroOperado, efectivoContado, diferencia,
    mandaditosPagadosEfectivo, salidasCaja, entradasCaja, ajustes,
    // E. utilidad
    utilidadBrutaProductos,
    // auditoria
    warnings,
  };
}

// Exporta UNA jornada a Excel (.xlsx) a la computadora: hojas Resumen, Pedidos,
// Ventas y Gastos. Se dispara solo al cerrar la jornada (dentro del gesto del
// boton, para que el navegador permita la descarga) y tambien manualmente desde
// el historial. Los archivos se acumulan por fecha = base de datos historica en
// el PC para analizar sin depender del dispositivo ni la nube.
function exportJornadaXLSX(ja){
  if(!ja||!window.XLSX)return false;
  try{
    const m=buildCajaModel(ja);const money=n=>Number(n)||0;
    const resumen=[
      ['Fecha',ja.fecha],['Apertura',ja.horaApertura||''],['Cierre',ja.horaCierre||''],
      ['Fondo inicial',money(m.fondoInicial)],['Productos (total)',money(m.productosTotal)],
      ['Envios (total)',money(m.enviosTotal)],['Cobrado efectivo',money(m.cobrosEfectivo)],
      ['Cobrado transferencia',money(m.cobrosTransferencia)],['Cobrado total',money(m.cobrosTotal)],
      ['Gastos total',money(m.gastosTotal)],['Caja esperada',money(m.cajaEsperada)],
      ['Efectivo contado',money(m.efectivoContado)],['Diferencia',money(m.diferencia)],
      ['Pedidos cobrados',m.countCobrados],['Pedidos pendientes',m.countPendientes],
      ['Pedidos cancelados',m.countCancelados],['Utilidad bruta productos',money(m.utilidadBrutaProductos)],
    ].map(([campo,valor])=>({campo,valor}));
    const pedidos=(ja.pedidos||[]).map(p=>({
      numero:p.numero,hora:p.hora||'',cliente:p.cliente||'',telefono:p.telefono||'',
      tipo:(TARIFAS_ENVIO[p.tipoEntrega]||{}).label||p.tipoEntrega||'',
      productos:money(p.totalProductos),envio:money(p.costoEnvio),total:money(p.total),
      metodo:p.metodoPago||'',cobrado:p.cobrado?'si':'no',estado:p.estado||'',notas:p.notas||''}));
    const ventas=(ja.ventas||[]).map(v=>({
      hora:v.hora||'',total:money(v.total),envio:money(v.costoEnvio),totalCobrado:money(v.totalCobrado),
      metodo:v.metodoPago||'',anulada:v.anulada?'si':'no',pedidoId:v.pedidoId||''}));
    const gastos=(ja.gastos||[]).map(g=>({
      hora:g.hora||'',descripcion:g.descripcion||g.concepto||'',monto:money(g.monto),
      enEfectivo:g.enEfectivo!==false?'si':'no'}));
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(resumen),'Resumen');
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(pedidos.length?pedidos:[{numero:''}]),'Pedidos');
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(ventas.length?ventas:[{hora:''}]),'Ventas');
    if(gastos.length)XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(gastos),'Gastos');
    XLSX.writeFile(wb,`kapulits_jornada_${ja.fecha}.xlsx`);
    return true;
  }catch(e){console.error('exportJornadaXLSX',e);return false;}
}

// Auditoria de integridad del cierre. NO modifica datos: solo reporta
// advertencias visibles y por console.warn. Tolerancia de 0.5 por redondeos.
function _validarCaja(jornada,desg,gastos){
  const w=[];
  const TOL=0.5;
  const num=n=>Number(n)||0;
  const pedidos=jornada?.pedidos||[];
  const ventas=jornada?.ventas||[];
  const mandaditos=jornada?.mandaditos||[];
  pedidos.forEach(p=>{
    if(!p||p.estado==='cancelado')return;
    const compTotal=num(p.totalProductos)+num(p.costoEnvio);
    if(p.total!=null&&Math.abs(num(p.total)-compTotal)>TOL){
      w.push({code:'total_descuadrado',folio:p.numero,detail:`total ${fmt(p.total)} ≠ productos ${fmt(p.totalProductos)} + envío ${fmt(p.costoEnvio)}`});
    }
    if(!p.cobrado)return;
    const vs=ventas.filter(v=>v.pedidoId===p.id&&!v.esReversa&&!v.anulada);
    const ventaOrig=vs[0]||null;
    const pagosRaw=p.pagos||ventaOrig?.pagos||null;
    const pagos=normalizePagos(pagosRaw,compTotal,p.metodoPago||ventaOrig?.metodoPago);
    const sumPg=num(pagos.efectivo)+num(pagos.transferencia);
    if(p.pagos&&Math.abs(sumPg-compTotal)>TOL){
      w.push({code:'pago_no_cuadra',folio:p.numero,detail:`pagos ${fmt(sumPg)} ≠ total ${fmt(compTotal)}`});
    }
    if(vs.length>1)w.push({code:'venta_original_duplicada',folio:p.numero,detail:`${vs.length} ventas originales activas`});
    if(ventaOrig&&Math.abs(num(ventaOrig.total)-num(p.totalProductos))>TOL){
      w.push({code:'venta_no_coincide',folio:p.numero,detail:`venta ${fmt(ventaOrig.total)} ≠ productos del pedido ${fmt(p.totalProductos)}`});
    }
    const tieneEnvio=num(p.costoEnvio)>0;
    if(tieneEnvio){
      const m=mandaditos.find(x=>x.pedidoId===p.id);
      if(m&&Math.abs(num(m.tarifa)-num(p.costoEnvio))>TOL){
        w.push({code:'envio_no_coincide',folio:p.numero,detail:`envío ${fmt(m.tarifa)} ≠ pedido ${fmt(p.costoEnvio)}`});
      }
    }
  });
  const byOrig=new Map();
  ventas.filter(v=>v.esReversa&&!v.anulada&&v.ventaOrigId).forEach(v=>byOrig.set(v.ventaOrigId,(byOrig.get(v.ventaOrigId)||0)+1));
  for(const [oid,c] of byOrig){if(c>1)w.push({code:'reversa_duplicada',detail:`${c} reversas activas para venta ${oid}`});}
  (gastos||[]).forEach((g,i)=>{const m=Number(g.monto);if(!(m>0))w.push({code:'gasto_invalido',detail:`gasto "${g.descripcion||g.categoria||('#'+(i+1))}" sin monto válido`});});
  // Ajustes de caja: motivo OBLIGATORIO. Una salida/entrada sin motivo no es
  // auditable; se reporta para que el operador la complete o la elimine.
  (jornada?.ajustesCaja||[]).forEach((a,i)=>{
    const monto=Number(a.monto);
    if(!(monto>0))w.push({code:'ajuste_invalido',detail:`ajuste de caja #${i+1} sin monto válido`});
    else if(!String(a.motivo||'').trim())w.push({code:'ajuste_sin_motivo',detail:`${a.tipo==='entrada'?'entrada':'salida'} de caja ${fmt(monto)} sin motivo`});
  });
  if(w.length){try{console.warn('[CajaModel] advertencias de auditoría del cierre:',w);}catch(e){}}
  return w;
}

function _buildCierreText(jornada){
  const sep='-'.repeat(32);
  const m=buildCajaModel(jornada);
  const metAbbr=x=>x==='efectivo'?'EF':x==='transferencia'?'TR':x==='mixto'?'MX':'--';
  const L=(label,val)=>`  ${label.padEnd(18)}${fmt(val).padStart(10)}\n`;
  let t=`\n      K'apul'Its\n    Birria y algo mas\n${sep}\n`;
  t+=`    CORTE DE CAJA\n${sep}\n`;
  t+=`  Fecha:    ${jornada.fecha}\n`;
  t+=`  Apertura: ${jornada.horaApertura||'--'}\n`;
  t+=`  Cierre:   ${jornada.horaCierre||'--'}\n`;
  t+=sep+'\n';
  // A. RESUMEN DE COBROS DEL DIA (unico bloque con etiqueta "real")
  t+=`  A. COBROS DEL DIA\n`;
  t+=L('Total cobrado',m.cobrosTotal);
  t+=L('Efectivo real',m.cobrosEfectivo);
  t+=L('Transferencia real',m.cobrosTransferencia);
  t+=sep+'\n';
  // B. DESGLOSE OPERATIVO
  t+=`  B. DESGLOSE OPERATIVO\n`;
  t+=L('Productos vendidos',m.productosTotal);
  t+=L('Envios/servicios',m.enviosTotal);
  t+=`  Pedidos: ${m.countCobrados} cobr`;
  if(m.countPendientes>0)t+=` / ${m.countPendientes} pend`;
  if(m.countCancelados>0)t+=` / ${m.countCancelados} canc`;
  t+='\n';
  t+=`  #   Met Prod   Env   Total\n`;
  m.rows.forEach(r=>{
    const folio='#'+String(r.folio).padStart(3,'0');
    if(r.cancelado){
      t+=`  ${folio} CANCELADO (no suma)\n`;
    }else if(!r.cobrado){
      t+=`  ${folio} ${metAbbr(r.metodo)} pendiente (no cobrado)\n`;
    }else{
      t+=`  ${folio} ${metAbbr(r.metodo).padEnd(3)} ${fmt(r.productos).padStart(6)} ${fmt(r.envio).padStart(5)} ${fmt(r.total).padStart(6)}\n`;
    }
  });
  // Detalle secundario: productos segun tipo de pedido (NO es banco real)
  t+=`  Productos por tipo de pedido:\n`;
  t+=L('  pedidos efectivo',m.productosEfectivo);
  t+=L('  pedidos transfer.',m.productosTransfer);
  if(m.productosMixto>0)t+=L('  pedidos mixtos',m.productosMixto);
  t+=sep+'\n';
  // C. GASTOS
  t+=`  C. GASTOS\n`;
  t+=L('Desde caja (efvo)',m.gastosCaja);
  if(m.gastosOtroMedio>0)t+=L('Por otro medio',m.gastosOtroMedio);
  t+=L('Total gastos',m.gastosTotal);
  t+=sep+'\n';
  // D. CONCILIACION DE CAJA FISICA (formula visible)
  t+=`  D. CONCILIACION DE CAJA\n`;
  t+=L('  Fondo inicial',m.fondoInicial);
  t+=L('+ Efectivo real',m.cobrosEfectivo);
  t+=L('- Gastos de caja',m.gastosCaja);
  if(m.mandaditosPagadosEfectivo>0)t+=L('- Pago repartidor',m.mandaditosPagadosEfectivo);
  if(m.salidasCaja>0)t+=L('- Salidas caja',m.salidasCaja);
  if(m.entradasCaja>0)t+=L('+ Entradas caja',m.entradasCaja);
  t+=L('= Caja esperada',m.cajaEsperada);
  if(m.efectivoContado!=null){
    t+=L('Efectivo contado',m.efectivoContado);
    t+=L('Diferencia',m.diferencia);
  }
  t+=L('Transfer esperada',m.transferenciaEsperada);
  t+=L('Saldo caja+banco',m.dineroOperado);
  t+=sep+'\n';
  // E. UTILIDAD DEL NEGOCIO
  t+=`  E. UTILIDAD DEL NEGOCIO\n`;
  t+=L('Productos vendidos',m.productosTotal);
  t+=L('- Gastos totales',m.gastosTotal);
  t+=L('= Utilidad prod.',m.utilidadBrutaProductos);
  t+=sep+'\n';
  if(m.warnings.length){
    t+=`  ! REVISAR (${m.warnings.length}):\n`;
    m.warnings.slice(0,6).forEach(wn=>{t+=`  - ${wn.folio?('#'+wn.folio+' '):''}${wn.detail}\n`;});
    t+=sep+'\n';
  }
  if(jornada.observaciones)t+=`  Obs: ${jornada.observaciones}\n${sep}\n`;
  t+=`  ${NEGOCIO.nombre}\n`;
  t+=`  ${NEGOCIO.direccion}\n`;
  t+=`  Tel: ${NEGOCIO.telefono}\n\n\n`;
  return sanitize(t);
}

async function printCierreCaja(jornada){
  snd.print();
  const ticket=_buildCierreText(jornada);
  if(!printerCharacteristic&&(_btDevice||navigator.bluetooth?.getDevices)){
    await reconnectBluetooth();
  }
  if(printerCharacteristic){
    try{await _sendToBT(ticket);return{success:true,method:'bluetooth'};}
    catch(e){
      printerCharacteristic=null;
      const ok=await reconnectBluetooth();
      if(ok){try{await _sendToBT(ticket);return{success:true,method:'bluetooth'};}catch(e2){}}
    }
  }
  if(_usbDevice){
    try{await _sendToUSB(ticket);return{success:true,method:'usb'};}
    catch(e){_usbDevice=null;_usbEndpoint=null;}
  }
  if(!_usbDevice&&navigator.usb?.getDevices){
    const ok=await tryAutoConnectUSB();
    if(ok){try{await _sendToUSB(ticket);return{success:true,method:'usb'};}catch(e){}}
  }
  const w=window.open('','_blank','width=350,height=600');
  if(w){w.document.write(buildCierreHTML(jornada));w.document.close();w.focus();w.print();}
  return{success:true,method:'preview'};
}

function BarChart({labels=[],values=[],color='#f97316',colors=[],height=140}){
  if(!values.length)return null;const max=Math.max(...values,1);const W=Math.max(labels.length*56,300);const bw=36;
  return(<div className="overflow-x-auto"><svg width={W} height={height+44} style={{minWidth:'100%'}}>
    {values.map((v,i)=>{const bh=Math.max((v/max)*(height-10),v>0?4:0);const x=i*56+12;const c=colors[i]||color;
      return(<g key={i}><rect x={x} y={height-bh} width={bw} height={bh} fill={c} rx={6} opacity={.9}/>
        {v>0&&<text x={x+bw/2} y={height-bh-5} textAnchor="middle" fontSize={10} fill={c} fontWeight="700">{Math.round(v)}</text>}
        <text x={x+bw/2} y={height+16} textAnchor="middle" fontSize={9} fill="#6b7280">{labels[i]}</text></g>);
    })}</svg></div>);
}
function LineChart({dates=[],revenues=[],profits=[]}){
  if(revenues.length<2)return null;const allV=[...revenues,...profits];const max=Math.max(...allV,1);const min=Math.min(...profits,0);
  const range=max-min||1;const W=Math.max(dates.length*70,300);const H=140;
  const pt=(v,i)=>`${i*(W/(dates.length-1||1))},${H-((v-min)/range)*(H-20)+10}`;
  return(<div className="overflow-x-auto"><svg width={W} height={H+30} style={{minWidth:'100%'}}>
    <polyline points={revenues.map((v,i)=>pt(v,i)).join(' ')} fill="none" stroke="#f97316" strokeWidth={2.5} strokeLinejoin="round"/>
    <polyline points={profits.map((v,i)=>pt(v,i)).join(' ')} fill="none" stroke="#22c55e" strokeWidth={2.5} strokeLinejoin="round" strokeDasharray="4,3"/>
    {revenues.map((v,i)=><circle key={'r'+i} cx={i*(W/(dates.length-1||1))} cy={H-((v-min)/range)*(H-20)+10} r={4} fill="#f97316"/>)}
    {profits.map((v,i)=><circle key={'p'+i} cx={i*(W/(dates.length-1||1))} cy={H-((v-min)/range)*(H-20)+10} r={4} fill="#22c55e"/>)}
    {dates.map((d,i)=><text key={i} x={i*(W/(dates.length-1||1))} y={H+20} textAnchor="middle" fontSize={9} fill="#6b7280">{fmtDateShort(d)}</text>)}
  </svg></div>);
}

function Input({label,value,onChange,type='text',placeholder='',prefix}){

    {label&&<label htmlFor={inputId} className="t-kicker">{label}</label>}

function Skeleton({w='100%',h='20px',className=''}){

function AbrirJornadaModal({open,onClose,onAbrir}){
  const [fondo,setFondo]=useState('');const [fecha,setFecha]=useState(localISODate());
  // B2: el fondo inicial debe ser >= 0 (vacio equivale a 0).
  const fondoInvalido=fondo!==''&&!(Number(fondo)>=0);
  return(<Modal open={open} onClose={onClose} title="Abrir jornada">
    <div className="flex flex-col gap-5">
      <div className="bg-orange-50 rounded-2xl p-4 text-sm text-orange-700">
        <p className="font-bold mb-1">Todo listo para comenzar?</p>
        <p className="opacity-70">Registra el fondo inicial de la caja.</p></div>
      <Input label="Fecha de jornada" type="date" value={fecha} onChange={setFecha}/>
      <Input label="Fondo inicial en caja" type="number" placeholder="0" prefix="$" value={fondo} onChange={setFondo}/>
      {fondoInvalido&&<p className="text-xs font-bold text-[var(--danger)]" role="alert">El fondo inicial no puede ser negativo.</p>}
      <Btn full color="green" size="lg" disabled={fondoInvalido} onClick={()=>{onAbrir(fondo,fecha);setFondo('');onClose();}}>
        <Icon name="sun" size={18} className="mr-1.5"/>Abrir jornada</Btn>
    </div></Modal>);
}

  if(!jornada)return null;
  const m=buildCajaModel(jornada);
  const esperado=m.cajaEsperada;
  const dif=(Number(efectivo)||0)-esperado;
  // B2: el efectivo contado debe ser un numero >= 0 para poder cerrar.

        <div className="space-y-1 text-sm">
          <div className="flex justify-between"><span className="text-gray-500"><Icon name="cash" size={14} className="mr-1"/>Efectivo real recibido</span><span className="font-bold">{fmt(m.cobrosEfectivo)}</span></div>
          <div className="flex justify-between"><span className="text-gray-500"><Icon name="phone" size={14} className="mr-1"/>Transferencia real recibida</span><span className="font-bold">{fmt(m.cobrosTransferencia)}</span></div>

      {/* B. DESGLOSE OPERATIVO */}
      <div className="bg-gray-50 rounded-2xl p-4">
        <h3 className="font-bold text-gray-700 text-sm mb-2">B · Desglose operativo</h3>
        <div className="space-y-1 text-sm mb-2">
          <div className="flex justify-between"><span className="text-gray-500"><Icon name="bowl" size={14} className="mr-1"/>Productos vendidos</span><span className="font-bold text-green-600">{fmt(m.productosTotal)}</span></div>
          <div className="flex justify-between"><span className="text-gray-500"><Icon name="bike" size={14} className="mr-1"/>Envíos/servicios cobrados</span><span className="font-bold text-purple-600">{fmt(m.enviosTotal)}</span></div>
          <div className="flex justify-between text-xs text-gray-400"><span>Pedidos</span><span>{m.countCobrados} cobrados · {m.countPendientes} pendientes · {m.countCancelados} cancelados</span></div>

        <div className="grid grid-cols-[auto_1fr_auto_auto_auto] gap-x-2 gap-y-1 text-[12px] max-h-44 overflow-y-auto border-t pt-2">
          <div className="font-bold text-gray-400">#</div><div className="font-bold text-gray-400">Mét</div><div className="font-bold text-gray-400 text-right">Prod</div><div className="font-bold text-gray-400 text-right">Env</div><div className="font-bold text-gray-400 text-right">Total</div>
          {m.rows.map(r=>(<React.Fragment key={r.folio}>
            <div className="text-gray-600">#{String(r.folio).padStart(3,'0')}</div>
            {r.cancelado
              ? <div className="col-span-4 text-red-500 italic">cancelado · no suma a caja</div>
              : !r.cobrado
                ? <div className="col-span-4 text-yellow-600 italic">pendiente · no cobrado</div>
                : <React.Fragment>
                    <div><PagoTag metodo={r.metodo}/></div>
                    <div className="text-right">{fmt(r.productos)}</div>
                    <div className="text-right text-purple-600">{r.envio>0?fmt(r.envio):'·'}</div>
                    <div className="text-right font-bold">{fmt(r.total)}</div>
                  </React.Fragment>}
          </React.Fragment>))}
        </div>
        <div className="border-t mt-2 pt-2 text-[11px] text-gray-400 space-y-0.5">
          <p className="font-semibold text-gray-500">Productos por tipo de pedido (referencia, no es banco)</p>
          <div className="flex justify-between"><span>· pedidos de efectivo</span><span>{fmt(m.productosEfectivo)}</span></div>
          <div className="flex justify-between"><span>· pedidos de transferencia</span><span>{fmt(m.productosTransfer)}</span></div>
          {m.productosMixto>0&&<div className="flex justify-between"><span>· pedidos mixtos</span><span>{fmt(m.productosMixto)}</span></div>}
        </div>
      </div>

      {/* C. GASTOS */}
      <div className="bg-gray-50 rounded-2xl p-4 space-y-1 text-sm">
        <h3 className="font-bold text-gray-700 text-sm mb-1">C · Gastos</h3>
        <div className="flex justify-between"><span className="text-gray-500"><Icon name="cash" size={14} className="mr-1"/>Salen de caja (efectivo)</span><span>{fmt(m.gastosCaja)}</span></div>
        {m.gastosOtroMedio>0&&<div className="flex justify-between"><span className="text-gray-500"><Icon name="phone" size={14} className="mr-1"/>Por otro medio (no caja)</span><span>{fmt(m.gastosOtroMedio)}</span></div>}
        <div className="border-t my-1"/>
        <div className="flex justify-between font-bold"><span>Total gastos</span><span className="text-red-500">{fmt(m.gastosTotal)}</span></div>
      </div>

      {/* Reconciliación: pagos a repartidor (salen de caja) + ajustes de caja */}
      <CajaReconciliacion jornada={jornada} model={m}
        onPagarRepartidor={onPagarRepartidor} onPagarTodosRepartidores={onPagarTodosRepartidores}
        onRegistrarAjuste={onRegistrarAjuste} onEliminarAjuste={onEliminarAjuste}/>

      {/* D. CONCILIACION DE CAJA FISICA — formula visible */}
      <div className="bg-blue-50 rounded-2xl p-4 space-y-1 text-sm">
        <h3 className="font-bold text-gray-700 text-sm mb-1">D · Conciliación de caja física</h3>
        <div className="flex justify-between"><span className="text-gray-500">Fondo inicial</span><span>{fmt(m.fondoInicial)}</span></div>
        <div className="flex justify-between"><span className="text-gray-500">+ Efectivo real recibido</span><span>{fmt(m.cobrosEfectivo)}</span></div>
        <div className="flex justify-between"><span className="text-gray-500">− Gastos pagados desde caja</span><span>{fmt(m.gastosCaja)}</span></div>
        {m.mandaditosPagadosEfectivo>0&&<div className="flex justify-between"><span className="text-gray-500">− Pagado a repartidores (efvo)</span><span>{fmt(m.mandaditosPagadosEfectivo)}</span></div>}
        {m.salidasCaja>0&&<div className="flex justify-between"><span className="text-gray-500">− Salidas de caja</span><span>{fmt(m.salidasCaja)}</span></div>}
        {m.entradasCaja>0&&<div className="flex justify-between"><span className="text-gray-500">+ Entradas de caja</span><span>{fmt(m.entradasCaja)}</span></div>}
        <div className="border-t my-1"/>
        <div className="flex justify-between font-bold text-gray-700"><span>= Caja esperada</span><span>{fmt(m.cajaEsperada)}</span></div>
        <div className="border-t my-1"/>
        <div className="flex justify-between text-gray-500"><span><Icon name="phone" size={14} className="mr-1"/>Transferencia esperada (banco)</span><span className="text-blue-700 font-semibold">{fmt(m.transferenciaEsperada)}</span></div>
        <div className="flex justify-between text-xs text-gray-400"><span>Saldo esperado caja + banco</span><span>{fmt(m.dineroOperado)}</span></div>

      <Input label="Efectivo real contado" type="number" placeholder="0" prefix="$" value={efectivo} onChange={setEfectivo}/>

      {efectivoValido&&<div className={`rounded-xl p-3 text-sm font-bold text-center ${dif===0?'bg-green-50 text-green-700':Math.abs(dif)<10?'bg-yellow-50 text-yellow-700':'bg-red-50 text-red-600'}`}>
        {dif===0?'Caja cuadrada':dif>0?`Sobrante: ${fmt(dif)}`:`Faltante: ${fmt(Math.abs(dif))}`}</div>}

      {/* E. UTILIDAD DEL NEGOCIO */}
      <div className="bg-gray-50 rounded-2xl p-4 space-y-1 text-sm">
        <h3 className="font-bold text-gray-700 text-sm mb-1">E · Utilidad del negocio</h3>
        <div className="flex justify-between"><span className="text-gray-500"><Icon name="bowl" size={14} className="mr-1"/>Productos vendidos</span><span>{fmt(m.productosTotal)}</span></div>
        <div className="flex justify-between"><span className="text-gray-500">− Gastos totales</span><span>{fmt(m.gastosTotal)}</span></div>
        <div className="border-t my-1"/>
        <div className="flex justify-between font-bold"><span>= Utilidad productos</span><span className={m.utilidadBrutaProductos>=0?'text-green-600':'text-red-500'}>{fmt(m.utilidadBrutaProductos)}</span></div>

      <Input label="Observaciones (opcional)" value={obs} onChange={setObs} placeholder="Notas del dia..."/>

      <Btn full color="gray" size="sm" disabled={!efectivoValido} onClick={()=>{

// ─── RECONCILIACION DE CAJA (pagos a repartidor + ajustes) ──────────
// Registra movimientos REALES de efectivo que reducen/aumentan la caja
// fisica. Opt-in: nada es automatico. Todo persiste via las acciones del
// store y alimenta buildCajaModel (fuente unica).
function CajaReconciliacion({jornada,model,onPagarRepartidor,onPagarTodosRepartidores,onRegistrarAjuste,onEliminarAjuste}){
  const [repId,setRepId]=useState('');
  const [repMonto,setRepMonto]=useState('');
  const [aTipo,setATipo]=useState('salida');
  const [aMonto,setAMonto]=useState('');
  const [aMotivo,setAMotivo]=useState('');
  const [askAll,setAskAll]=useState(false);
  const mandaditos=jornada.mandaditos||[];
  const ajustes=jornada.ajustesCaja||[];
  const envios=(model.rows||[]).filter(r=>r.cobrado&&r.envio>0);
  const conPago=r=>Number((mandaditos.find(x=>x.pedidoId===r.pedidoId)||{}).pagoRepartidorEfectivo)||0;
  // Pagados: TODOS los mandaditos con pago registrado, aunque el pedido se haya
  // cancelado despues. Si no, el pago seguiria restando de caja (el dinero ya
  // salio del cajon) pero seria invisible e imposible de quitar desde la UI.
  const pagados=mandaditos.filter(m=>(Number(m.pagoRepartidorEfectivo)||0)>0).map(m=>{
    const r=(model.rows||[]).find(x=>x.pedidoId===m.pedidoId);
    return{pedidoId:m.pedidoId,folio:r?.folio??m.pedidoNum??'?',cliente:m.cliente||r?.cliente||'',
      pago:Number(m.pagoRepartidorEfectivo)||0,cancelado:!!r?.cancelado};
  });
  // Pendientes: envios cobrados (envio>0) sin pago al repartidor todavia.
  const pendientes=envios.filter(r=>!(conPago(r)>0));
  const totalPendiente=_roundMoney(pendientes.reduce((s,r)=>s+r.envio,0));
  const canPago=!!repId;
  const canAjuste=(Number(aMonto)||0)>0&&!!aMotivo.trim();
  const guardarPago=()=>{ if(!canPago)return; onPagarRepartidor&&onPagarRepartidor(repId,Number(repMonto)||0); setRepId('');setRepMonto(''); };
  const addAjuste=()=>{ if(!canAjuste)return; onRegistrarAjuste&&onRegistrarAjuste({tipo:aTipo,monto:Number(aMonto),motivo:aMotivo.trim()}); setAMonto('');setAMotivo(''); };
  const confirmarTodos=()=>{ onPagarTodosRepartidores&&onPagarTodosRepartidores(); setAskAll(false); };
  const selStyle="w-full rounded-xl border border-[rgba(221,192,161,.55)] bg-[rgba(255,250,244,.9)] px-3 py-2 text-sm";
  return(<div className="bg-amber-50 border border-amber-200 rounded-2xl p-4 space-y-4 text-sm">
    <h3 className="font-bold text-gray-700">Movimientos de efectivo (opcional)</h3>

    {/* Pago a repartidor: efectivo del cajon entregado al repartidor */}
    <div className="space-y-2">
      <p className="font-semibold text-gray-600"><Icon name="bike" size={14} className="mr-1"/>Pagado al repartidor (sale de caja)</p>

      {/* Pago masivo de todos los envios pendientes */}
      {envios.length>0&&(pendientes.length>0
        ? (!askAll
            ? <button type="button" onClick={()=>setAskAll(true)} className="w-full py-2.5 rounded-xl bg-orange-100 border border-orange-300 text-orange-800 font-bold text-sm card-press">
                Pagar todos los envíos pendientes · {fmt(totalPendiente)}
              </button>
            : <div className="rounded-xl bg-white/80 border border-orange-300 p-3 space-y-2">
                <p className="text-xs text-gray-700">Se marcarán <b>{pendientes.length}</b> envío{pendientes.length===1?'':'s'} como pagados al repartidor.</p>
                <p className="text-xs text-gray-700">Saldrá del cajón: <b className="text-orange-700">{fmt(totalPendiente)}</b> en efectivo.</p>
                <p className="text-[11px] text-amber-700"><Icon name="alert" size={12} className="mr-1"/>Esto bajará la caja esperada porque se pagará desde efectivo.</p>
                <div className="flex gap-2">
                  <Btn color="orange" size="sm" onClick={confirmarTodos}>Confirmar pago</Btn>
                  <Btn color="gray" size="sm" onClick={()=>setAskAll(false)}>Cancelar</Btn>
                </div>
              </div>)
        : <p className="text-xs text-gray-400">No hay envíos pendientes de pago al repartidor.</p>)}

      {envios.length===0
        ? <p className="text-xs text-gray-400">No hay envíos cobrados en esta jornada.</p>
        : <React.Fragment>
            <p className="text-[11px] text-gray-400 pt-1">…o registra un envío puntual:</p>
            <select className={selStyle} value={repId} onChange={e=>{const v=e.target.value;setRepId(v);const r=envios.find(x=>x.pedidoId===v);setRepMonto(r?String(r.envio):'');}}>
              <option value="">Selecciona un envío…</option>
              {envios.map(r=><option key={r.pedidoId} value={r.pedidoId}>#{String(r.folio).padStart(3,'0')} {r.cliente||''} · envío {fmt(r.envio)}</option>)}
            </select>
            <div className="flex gap-2">
              <Input label="" type="number" prefix="$" placeholder="Efectivo pagado" value={repMonto} onChange={setRepMonto}/>
              <Btn color="orange" size="sm" disabled={!canPago} onClick={guardarPago}>Registrar</Btn>
            </div>
          </React.Fragment>}
      {pagados.length>0&&<div className="space-y-1">
        {pagados.map(r=><div key={r.pedidoId} className="flex justify-between items-center text-xs bg-white/70 rounded-lg px-2 py-1">
          <span>#{String(r.folio).padStart(3,'0')} {r.cliente||''}{r.cancelado?' · pedido cancelado':''}</span>
          <span className="flex items-center gap-2"><b className="text-orange-700">{fmt(r.pago)}</b>
            <button className="text-gray-400 hover:text-red-500 w-8 h-8 flex items-center justify-center" onClick={()=>onPagarRepartidor&&onPagarRepartidor(r.pedidoId,0)} title="Quitar" aria-label="Quitar pago al repartidor"><Icon name="x" size={14}/></button></span>
        </div>)}
        <div className="flex justify-between text-xs font-bold text-gray-600 pt-1"><span>Total pagado a repartidores</span><span>{fmt(model.mandaditosPagadosEfectivo)}</span></div>
      </div>}
    </div>

    <div className="border-t border-amber-200"/>

    {/* Ajustes de caja: salida (-) / entrada (+), motivo obligatorio */}
    <div className="space-y-2">
      <p className="font-semibold text-gray-600"><Icon name="cash" size={14} className="mr-1"/>Salida / entrada de caja (motivo obligatorio)</p>
      <div className="grid grid-cols-2 gap-2">
        <button type="button" onClick={()=>setATipo('salida')} className={`py-2.5 min-h-[44px] rounded-xl border text-center text-xs font-bold transition-colors duration-150 ${aTipo==='salida'?'bg-red-100 border-red-300 text-red-700':'bg-white/70 border-gray-200 text-gray-500'}`}><Icon name="minus" size={13} className="mr-1"/>Salida (resta)</button>
        <button type="button" onClick={()=>setATipo('entrada')} className={`py-2.5 min-h-[44px] rounded-xl border text-center text-xs font-bold transition-colors duration-150 ${aTipo==='entrada'?'bg-green-100 border-green-300 text-green-700':'bg-white/70 border-gray-200 text-gray-500'}`}><Icon name="plus" size={13} className="mr-1"/>Entrada (suma)</button>
      </div>
      <Input label="" type="number" prefix="$" placeholder="Monto" value={aMonto} onChange={setAMonto}/>
      <Input label="" placeholder="Motivo (obligatorio): compra, cambio, retiro…" value={aMotivo} onChange={setAMotivo}/>
      <Btn full color={aTipo==='salida'?'red':'green'} size="sm" disabled={!canAjuste} onClick={addAjuste}>
        {aTipo==='salida'?'Registrar salida':'Registrar entrada'}{(Number(aMonto)||0)>0?` ${fmt(Number(aMonto))}`:''}</Btn>
      {!aMotivo.trim()&&(Number(aMonto)||0)>0&&<p className="text-[11px] text-amber-700">Sin motivo no se registra; el cierre lo reportaría como faltante.</p>}
      {ajustes.length>0&&<div className="space-y-1 pt-1">
        {ajustes.map(a=><div key={a.id} className="flex justify-between items-center text-xs bg-white/70 rounded-lg px-2 py-1">

// ─── PRODUCT SELECTOR (shared by Create & Edit) ─────────────────────
function ProductSelector({productos,cart,setCart}){
  const prods=productos.filter(p=>p.activo);
  const platillos=prods.filter(p=>p.cat==='platillo');
  const combos=prods.filter(p=>p.cat==='combo');
  const bebidas=prods.filter(p=>p.cat==='bebida');
  const variadoDesc=prods.find(p=>p.esVariado);
  const [varNombre,setVarNombre]=useState('');const [varPrecio,setVarPrecio]=useState('');
  const varPrecioNum=Number(varPrecio)||0;
  const varOk=varNombre.trim().length>0&&varPrecioNum>0;
  const addVariado=()=>{
    if(!varOk)return;
    const lid=lineaUid();
    setCart(c=>({...c,[lid]:{id:lid,productoId:'variado',esVariado:true,nombre:varNombre.trim(),
      precio:varPrecioNum,costo:0,emoji:variadoDesc?.emoji||'🧪',cantidad:1,subtotal:varPrecioNum}}));
    setVarNombre('');setVarPrecio('');
  };
  // B4 — SEMANTICA SEGURA DE PRECIOS AL AGREGAR DESDE CATALOGO:
  // Una linea existente conserva SU precio (el precio historico cobrado/pactado
  // NUNCA se muta silenciosamente). Agregar desde catalogo:
  //  - si existe una linea del producto con el MISMO precio del catalogo,
  //    solo incrementa su cantidad;
  //  - si el precio del catalogo cambio, crea una LINEA NUEVA separada con el
  //    precio actual (id de linea propio), dejando intacta la linea original.
  // Asi la contabilidad refleja exactamente que se vendio a que precio.
  const add=p=>setCart(c=>{
    const match=Object.values(c).find(l=>(l.productoId||l.id)===p.id&&!l.esVariado&&Number(l.precio)===Number(p.precio));
    if(match){
      const key=match.id||match.productoId;
      const q=match.cantidad+1;
      return{...c,[key]:{...match,cantidad:q,subtotal:q*match.precio}};
    }
    const exists=Object.values(c).some(l=>(l.productoId||l.id)===p.id&&!l.esVariado);
    const key=exists?lineaUid():p.id;
    return{...c,[key]:{...p,id:key,productoId:p.id,cantidad:1,subtotal:p.precio}};
  });
  const rem=pid=>setCart(c=>{const n={...c};if(n[pid]?.cantidad>1){n[pid]={...n[pid],cantidad:n[pid].cantidad-1,subtotal:(n[pid].cantidad-1)*n[pid].precio};}else{delete n[pid];}return n;});
  // Cantidad total del producto en el carrito (puede haber lineas separadas por precio).
  const qtyOf=pid=>Object.values(cart).reduce((s,l)=>((l.productoId||l.id)===pid&&!l.esVariado)?s+l.cantidad:s,0);
  // Bebida con sabores: cada sabor es su propia linea (misma productoId para que
  // las estadisticas agreguen bajo el producto). La variante viaja en el nombre.
  const [openVar,setOpenVar]=useState(null);
  const addVariante=(p,variante)=>setCart(c=>{
    const key=p.id+'::'+variante;const ex=c[key];const q=(ex?.cantidad||0)+1;
    return{...c,[key]:{...(ex||{}),id:key,productoId:p.id,nombre:`${p.nombre} · ${variante}`,precio:p.precio,costo:p.costo,cat:p.cat,emoji:p.emoji,variante,cantidad:q,subtotal:q*p.precio}};
  });

  function ProdBtn({p,cols=2}){
    const qty=qtyOf(p.id);
    const desc=COMBO_DESC[p.id];
    const cc=catCard(p.cat);
    return(<button key={p.id} onClick={()=>add(p)} style={{background:cc.bg,borderColor:cc.bd}}
      className={`prod-btn rounded-2xl flex flex-col items-center justify-center text-center ${cols===1?'p-4 gap-1':'p-3.5 gap-1 min-h-[86px]'} ${qty>0?'is-selected':''}`}>
      {qty>0&&<span className="absolute top-1.5 right-1.5 bg-[var(--brand)] text-white text-[10px] font-black w-5 h-5 rounded-full flex items-center justify-center shadow-[0_2px_6px_rgba(174,74,13,.35)]">{qty}</span>}
      <p className="prod-name t-subtitle text-[var(--text)]">{p.nombre}</p>
      {desc&&<p className="t-caption">{desc}</p>}
      <p className="t-price text-[var(--brand-strong)]">{fmt(p.precio)}</p>
    </button>);
  }

  return(<React.Fragment>
    {combos.length>0&&(<React.Fragment>
      <p className="t-menuhead">Combos</p>
      <div className="grid grid-cols-1 gap-2.5">{combos.map(p=><ProdBtn key={p.id} p={p} cols={1}/>)}</div>
    </React.Fragment>)}
    <p className="t-menuhead">Platillos</p>
    <div className="grid grid-cols-2 gap-2.5">{platillos.map(p=><ProdBtn key={p.id} p={p}/>)}</div>
    <p className="t-menuhead">Bebidas</p>
    <div className="grid grid-cols-2 gap-2.5">
      {bebidas.map((p,i,arr)=>{const qty=qtyOf(p.id);const tieneVar=Array.isArray(p.variantes)&&p.variantes.length>0;const abierto=openVar===p.id;
        const full=i===arr.length-1&&arr.length%2===1;const cc=catCard('bebida');
        return(<button key={p.id} onClick={()=>tieneVar?setOpenVar(o=>o===p.id?null:p.id):add(p)} aria-expanded={tieneVar?abierto:undefined}
          style={{background:cc.bg,borderColor:cc.bd}}
          className={`prod-btn rounded-2xl p-3.5 flex flex-col items-center justify-center text-center gap-1 min-h-[86px] ${full?'col-span-2':''} ${qty>0||abierto?'is-selected':''}`}>
          {qty>0&&<span className="absolute top-1.5 right-1.5 bg-[var(--brand)] text-white text-[10px] font-black w-5 h-5 rounded-full flex items-center justify-center shadow-[0_2px_6px_rgba(174,74,13,.35)]">{qty}</span>}
          <p className="prod-name t-subtitle text-[var(--text)]">{p.nombre}</p>
          <p className="t-price text-[var(--brand-strong)] inline-flex items-center">{fmt(p.precio)}{tieneVar&&<Icon name={abierto?'chevronUp':'chevronDown'} size={12} className="ml-0.5"/>}</p>
        </button>);})}
    </div>
    {(()=>{const pv=bebidas.find(p=>p.id===openVar&&Array.isArray(p.variantes)&&p.variantes.length);if(!pv)return null;
      return(<div className="bg-white rounded-xl p-3 shadow-sm border-2 border-orange-200 space-y-2 fade-in">
        <p className="text-[11px] font-bold text-gray-500">Elige sabor · {pv.nombre}</p>
        <div className="grid grid-cols-2 gap-2">
          {pv.variantes.map(v=>{const q=cart[pv.id+'::'+v]?.cantidad||0;
            return(<button key={v} onClick={()=>addVariante(pv,v)}
              className={`relative py-2.5 min-h-[44px] rounded-lg text-xs font-bold border-2 card-press ${q>0?'border-orange-400 bg-orange-50 text-orange-700':'border-gray-200 text-gray-700'}`}>
              {q>0&&<span className="absolute top-0.5 right-1 bg-orange-500 text-white text-[9px] font-black w-4 h-4 rounded-full flex items-center justify-center">{q}</span>}
              {v}</button>);})}
        </div>
      </div>);})()}
    {variadoDesc&&(<React.Fragment>
      <p className="text-xs font-bold text-gray-500 uppercase tracking-wider"><Icon name="tag" size={13} className="mr-1"/>Producto variado</p>
      <div className="bg-white rounded-xl p-3 shadow-sm border-2 border-gray-100 space-y-2">
        <p className="text-[11px] text-gray-400 leading-snug">Captura nombre y precio. Puedes agregar varios distintos.</p>
        <input value={varNombre} onChange={e=>setVarNombre(e.target.value)} placeholder="Nombre del producto"
          className="w-full rounded-lg border border-gray-200 px-3 py-2 text-sm" aria-label="Nombre producto variado"/>
        <div className="flex gap-2">
          <input value={varPrecio} onChange={e=>setVarPrecio(e.target.value)} type="number" inputMode="decimal" placeholder="Precio"
            className="flex-1 rounded-lg border border-gray-200 px-3 py-2 text-sm" aria-label="Precio producto variado"/>
          <button onClick={addVariado} disabled={!varOk}
            className={`px-4 rounded-lg font-black text-sm text-white ${varOk?'bg-orange-500':'bg-gray-300'}`}>+ Agregar</button>
        </div>
      </div>
    </React.Fragment>)}
  </React.Fragment>);
}

        onCrear={(items,tipo,cliente,dir,notas,telefono,etiquetaDir)=>{

        onCobrar={pago=>{snd.coin();onActualizarPedido(showCobrar.id,{cobrado:true,estado:'entregado',...pago});setShowCobrar(null);}}/>
      {showEditar&&<EditarPedidoModal open={!!showEditar} pedido={showEditar} productos={state.productos} clientes={state.clientes}
        onClose={()=>setShowEditar(null)}
        onGuardar={cambios=>{onActualizarPedido(showEditar.id,cambios);setShowEditar(null);}}/>}
      <Modal open={!!confirmCancel} onClose={()=>setConfirmCancel(null)} title="Cancelar pedido">
        {confirmCancel&&(<div className="space-y-4">

            <Btn full color="red" onClick={()=>{onActualizarPedido(confirmCancel.id,{estado:'cancelado'});setConfirmCancel(null);}}>Si, cancelar</Btn>
          </div>
        </div>)}
      </Modal>
    </div>
  </div>);
}

// Dibuja el ticket como IMAGEN (canvas -> PNG). Se comparte tal cual por
// WhatsApp (imagen que se ve bien en el chat), no texto que pierde formato.
// Estilo recibo monospace, precios alineados a la derecha, texto largo envuelto
// por palabra. Devuelve Promise<Blob>.
function buildTicketImage(pedido){
  return new Promise((resolve,reject)=>{try{
    const tarifa=TARIFAS_ENVIO[pedido.tipoEntrega]||TARIFAS_ENVIO.recoger;
    const COLS=32; // mismo ancho que el ticket impreso
    // Construir filas: center | lr (izq/der) | left | sep | space
    const rows=[];
    const wrapLeft=(label,value)=>{const inner=COLS,vw=Math.max(6,inner-label.length),ls=_wrapWords(value,vw),hang=' '.repeat(label.length);
      rows.push({t:'left',s:label+(ls[0]||'')});for(let i=1;i<ls.length;i++)rows.push({t:'left',s:hang+ls[i]});};
    rows.push({t:'center',s:"K'apul'Its",b:true,size:34});
    rows.push({t:'center',s:'Birria y algo mas',size:20,c:'#7a6255'});
    rows.push({t:'sep'});
    rows.push({t:'center',s:`PEDIDO #${String(pedido.numero).padStart(3,'0')}`,b:true,size:24});
    rows.push({t:'center',s:`${pedido.fecha}   ${pedido.hora}`,size:18,c:'#7a6255'});
    rows.push({t:'space'});
    if(pedido.cliente)wrapLeft('Cliente: ',pedido.cliente);
    if(pedido.telefono)rows.push({t:'left',s:'Tel: '+pedido.telefono});
    const tipoTxt=esMesa(pedido.tipoEntrega)?'LOCAL':(pedido.tipoEntrega==='recoger'?'REC':'ENV');
    wrapLeft(tipoTxt+' ',tarifa.label);
    if(pedido.direccion)wrapLeft('Dir: ',pedido.direccion);
    rows.push({t:'sep'});
    pedido.items.forEach(i=>{rows.push({t:'lr',l:`${i.cantidad}x ${i.nombre}`,r:fmt(i.subtotal)});});
    rows.push({t:'sep'});
    if(pedido.notas){rows.push({t:'left',s:'Notas:'});_wrapWords(pedido.notas,COLS).forEach(l=>rows.push({t:'left',s:l}));rows.push({t:'sep'});}
    if(pedido.costoEnvio>0)rows.push({t:'lr',l:'Envio',r:fmt(pedido.costoEnvio)});
    rows.push({t:'lr',l:'TOTAL',r:fmt(pedido.total),b:true,size:26});
    rows.push({t:'sep'});
    _wrapWords(NEGOCIO.direccion,COLS).forEach(l=>rows.push({t:'center',s:l,size:15,c:'#7a6255'}));
    rows.push({t:'center',s:'Tel.: '+NEGOCIO.telefono,size:15,c:'#7a6255'});
    rows.push({t:'space'});
    rows.push({t:'center',s:'Gracias por tu compra!',b:true,size:18});
    // Layout
    const scale=2, W=520, pad=34, cw=W-pad*2;
    const baseFont=(size,b)=>`${b?'bold ':''}${size||20}px "Courier New",ui-monospace,monospace`;
    const gap=r=>r.t==='sep'?26:r.t==='space'?16:Math.round((r.size||20)*1.5);
    let H=pad*2; rows.forEach(r=>{H+=gap(r);});
    const cv=document.createElement('canvas');cv.width=W*scale;cv.height=H*scale;
    const g=cv.getContext('2d');g.scale(scale,scale);
    g.fillStyle='#fffdf9';g.fillRect(0,0,W,H);
    g.textBaseline='alphabetic';
    let y=pad;
    rows.forEach(r=>{
      const h=gap(r);y+=h;const cy=y-Math.round(h*0.28);
      if(r.t==='sep'){g.strokeStyle='#c9b79c';g.lineWidth=1;g.setLineDash([4,4]);g.beginPath();g.moveTo(pad,y-h/2);g.lineTo(W-pad,y-h/2);g.stroke();g.setLineDash([]);return;}
      if(r.t==='space')return;
      g.fillStyle=r.c||'#2f1d17';g.font=baseFont(r.size,r.b);
      if(r.t==='center'){g.textAlign='center';g.fillText(r.s,W/2,cy);}
      else if(r.t==='left'){g.textAlign='left';g.fillText(r.s,pad,cy);}
      else if(r.t==='lr'){g.textAlign='left';let left=r.l;
        // truncar nombre si choca con el precio
        while(left.length>3&&g.measureText(left).width>cw-g.measureText(r.r).width-16)left=left.slice(0,-1);
        if(left!==r.l)left=left.slice(0,-1)+'…';
        g.fillText(left,pad,cy);g.textAlign='right';g.fillText(r.r,W-pad,cy);}
    });
    cv.toBlob(b=>b?resolve(b):reject(new Error('toBlob null')),'image/png');
  }catch(e){reject(e);}});
}
// Comparte el ticket como IMAGEN por WhatsApp (share sheet nativo). Si el
// dispositivo no soporta compartir archivos, descarga el PNG para adjuntarlo.
async function shareWhatsApp(pedido){
  const num=String(pedido.numero).padStart(3,'0');
  try{
    const blob=await buildTicketImage(pedido);
    const file=new File([blob],`pedido-${num}.png`,{type:'image/png'});
    const titulo=`Pedido #${num} · K'apul'Its`;
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:titulo,text:titulo});
      return;
    }
    // Respaldo: descargar la imagen para adjuntarla manualmente
    const url=URL.createObjectURL(blob);const a=document.createElement('a');
    a.href=url;a.download=`pedido-${num}.png`;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
    if(_showToast)_showToast('Imagen del ticket guardada: adjúntala en WhatsApp','green');
  }catch(e){
    if(e&&e.name==='AbortError')return; // el usuario cerro el share sheet
    console.error('shareWhatsApp',e);
    if(_showToast)_showToast('No se pudo generar la imagen del ticket','red');
  }
}

// Datos del cliente compartidos por Crear/Editar pedido. Clave = telefono:
// al escribir el numero busca clientes frecuentes y autocompleta nombre y
// direcciones guardadas. La direccion solo se pide cuando la recoge un
// repartidor/servicio (recoger o envio), no en mesa.
function ClienteFields({tipo,clientes,telefono,setTelefono,cliente,setCliente,direccion,setDireccion,etiqueta,setEtiqueta,sinTel,setSinTel}){
  const tel=normTel(telefono);
  const lista=Array.isArray(clientes)?clientes:[];
  const match=(!sinTel&&tel.length>=3)?lista.find(c=>normTel(c.telefono)===tel):null;
  const sugerencias=(!sinTel&&tel.length>=3&&!match)?lista.filter(c=>normTel(c.telefono).includes(tel)).slice(0,5):[];
  // Busqueda por NOMBRE (algunos clientes no dan telefono). Muestra coincidencias
  // mientras escribes el nombre; se ocultan cuando el cliente ya quedó seleccionado.
  const nomQ=normVariadoNombre(cliente);
  const sugerenciasNombre=(nomQ.length>=2&&!match)
    ? lista.filter(c=>c.nombre&&normVariadoNombre(c.nombre).includes(nomQ)
        &&!(normVariadoNombre(c.nombre)===nomQ&&normTel(c.telefono)===tel)).slice(0,6)
    : [];
  const pedirDir=necesitaDireccion(tipo);
  const usarCliente=c=>{setTelefono(c.telefono||'');if(c.telefono&&setSinTel)setSinTel(false);setCliente(c.nombre||'');const d=(c.direcciones||[])[0];if(d&&pedirDir){setDireccion(d.texto||'');setEtiqueta(d.etiqueta||'Otro');}};
  const toggleSinTel=()=>{const n=!sinTel;setSinTel&&setSinTel(n);if(n)setTelefono('');};
  return(<div className="space-y-3">
    <div className="flex flex-col gap-1.5">
      <label className="t-kicker">Teléfono {sinTel?'· sin número':'· 10 dígitos'}</label>
      <div className={`flex items-center border rounded-[18px] overflow-hidden transition-colors ${sinTel?'opacity-55 bg-[rgba(121,87,67,.05)] border-[rgba(221,192,161,.5)]':'bg-[rgba(255,250,244,.9)] border-[rgba(221,192,161,.7)] focus-within:border-[var(--brand)] focus-within:shadow-[0_0_0_3px_rgba(215,101,22,.10)]'}`}>
        <input type="tel" inputMode="numeric" value={sinTel?'':telefono} onChange={e=>setTelefono(e.target.value)} disabled={!!sinTel}
          placeholder={sinTel?'Cliente sin teléfono':'10 dígitos'}
          className="flex-1 px-4 py-3.5 text-[15px] outline-none bg-transparent text-[var(--text)] placeholder:text-[var(--text-muted)]"/></div>
      {/* Toggle prominente: el cliente puede no dar telefono (mesa, recoge, envio). */}
      <button type="button" onClick={toggleSinTel} aria-pressed={!!sinTel}
        className={`mt-1 w-full flex items-center justify-center gap-2 text-[13px] font-black px-3 py-2.5 min-h-[44px] rounded-[14px] border-2 transition-colors ${sinTel?'border-orange-500 bg-orange-50 text-orange-700':'border-dashed border-[#e2c4a4] text-[var(--text-soft)] bg-[rgba(255,250,244,.7)]'}`}>
        <Icon name={sinTel?'check':'phone'} size={15}/>{sinTel?'Cliente SIN teléfono (activado)':'El cliente no tiene teléfono'}</button>
    </div>
    {sugerencias.length>0&&<div className="rounded-[16px] border border-[rgba(221,192,161,.7)] bg-[rgba(255,250,244,.95)] overflow-hidden divide-y divide-[rgba(221,192,161,.4)]">
      {sugerencias.map(c=>(<button key={c.id} type="button" onClick={()=>usarCliente(c)} className="w-full text-left px-4 py-2.5 hover:bg-[rgba(242,191,90,.12)]">
        <span className="text-sm font-bold text-[var(--text)]">{c.nombre||'Sin nombre'}</span>
        <span className="text-xs text-[var(--text-muted)] ml-2">{c.telefono}</span></button>))}
    </div>}
    {match&&<div className="rounded-[14px] bg-[rgba(45,139,87,.10)] border border-[rgba(45,139,87,.24)] px-3 py-2 text-xs font-bold text-[#2c7a54]"><Icon name="check" size={12} className="mr-1"/>Cliente frecuente: {match.nombre||'Sin nombre'}</div>}
    <Input label="Nombre del cliente (puedes buscar aquí)" value={cliente} onChange={setCliente} placeholder="Nombre"/>
    {sugerenciasNombre.length>0&&<div className="rounded-[16px] border border-[rgba(221,192,161,.7)] bg-[rgba(255,250,244,.95)] overflow-hidden divide-y divide-[rgba(221,192,161,.4)]">
      {sugerenciasNombre.map(c=>(<button key={c.id} type="button" onClick={()=>usarCliente(c)} className="w-full flex items-center justify-between gap-2 px-4 py-2.5 hover:bg-[rgba(242,191,90,.12)]">
        <span className="text-sm font-bold text-[var(--text)] text-left"><Icon name="users" size={12} className="mr-1.5"/>{c.nombre||'Sin nombre'}</span>
        <span className="text-xs text-[var(--text-muted)] shrink-0">{c.telefono}</span></button>))}
    </div>}

          <Icon name="pin" size={11} className="mr-1"/>{d.etiqueta}: {d.texto}</button>))}</div>

      <Input label="Dirección" value={direccion} onChange={setDireccion} placeholder="Calle, número, colonia..."/>
      <div className="grid grid-cols-4 gap-2">{ETIQUETAS_DIR.map(e=>(<button key={e} type="button" onClick={()=>setEtiqueta(e)} aria-pressed={etiqueta===e}
        style={etiqueta===e?undefined:{background:'linear-gradient(180deg,#fff9f0,#fbeedb)'}}
        className={`tap text-xs font-bold px-2 py-2 min-h-[42px] rounded-[14px] border text-center shadow-[0_4px_12px_rgba(120,60,15,.10)] ${etiqueta===e?'border-orange-500 bg-orange-50 text-orange-700':'border-[#ecd6bd] text-[var(--text-soft)]'}`}>{e}</button>))}</div>
    </React.Fragment>)}
  </div>);
}

function CrearPedidoModal({open,onClose,productos,clientes,impresora,onCrear}){
  const [cart,setCart]=useState({});const [tipo,setTipo]=useState('recoger');
  const [cliente,setCliente]=useState('');const [telefono,setTelefono]=useState('');const [direccion,setDireccion]=useState('');
  const [etiqueta,setEtiqueta]=useState('Casa');const [notas,setNotas]=useState('');
  const [sinTel,setSinTel]=useState(false);
  useEffect(()=>{if(open){setCart({});setTipo('recoger');setCliente('');setTelefono('');setDireccion('');setEtiqueta('Casa');setNotas('');setSinTel(false);}},[open]);
  const items=Object.values(cart);const totalProd=items.reduce((s,i)=>s+i.subtotal,0);
  const costoEnvio=(TARIFAS_ENVIO[tipo]||TARIFAS_ENVIO.recoger).precio;
  const totalFinal=totalProd+costoEnvio;
  const add=p=>setCart(c=>{const k=p.id||p.productoId;const q=(c[k]?.cantidad||0)+1;return{...c,[k]:{...(c[k]||p),productoId:p.productoId||p.id,cantidad:q,subtotal:q*p.precio}};});
  const rem=pid=>setCart(c=>{const n={...c};if(n[pid]?.cantidad>1){n[pid]={...n[pid],cantidad:n[pid].cantidad-1,subtotal:(n[pid].cantidad-1)*n[pid].precio};}else{delete n[pid];}return n;});
  // Validacion en la frontera: telefono y nombre SIEMPRE; direccion cuando la
  // recoge un repartidor/servicio (recoger o envio), no en mesa.
  const faltaDir=necesitaDireccion(tipo)&&!direccion.trim();
  // El telefono deja de ser obligatorio si el cliente no lo dio (sinTel).
  // Si SE captura, debe ser un numero real de 10 digitos (movil MX).
  const telOk=sinTel||normTel(telefono).length===10;
  const puedeCrear=items.length>0&&telOk&&cliente.trim().length>0&&!faltaDir;
  const crear=()=>{
    if(!puedeCrear)return;
    const its=items.map(i=>buildItem(i));
    onCrear(its,tipo,cliente.trim(),direccion.trim(),notas,sinTel?'':telefono.trim(),etiqueta);
    setCart({});setCliente('');setTelefono('');setDireccion('');setNotas('');};
  return(<Modal open={open} onClose={onClose} title="NUEVO PEDIDO" fullScreen>
    <div className="space-y-4 menu-upper">
      <DeliverySelector tipo={tipo} setTipo={setTipo}/>
      <ClienteFields tipo={tipo} clientes={clientes} telefono={telefono} setTelefono={setTelefono}
        cliente={cliente} setCliente={setCliente} direccion={direccion} setDireccion={setDireccion} etiqueta={etiqueta} setEtiqueta={setEtiqueta} sinTel={sinTel} setSinTel={setSinTel}/>
      <ProductSelector productos={productos} cart={cart} setCart={setCart}/>
      <CartSummary cart={cart} costoEnvio={costoEnvio} onAdd={add} onRem={rem}/>
      {items.length>0&&(<React.Fragment>
        <Input label="Notas del pedido (opcional)" value={notas} onChange={setNotas} placeholder="Sin cebolla, extra salsa..."/>
        {!puedeCrear&&<p className="text-xs font-bold text-[var(--danger)] text-center">{!telOk?'El teléfono debe tener 10 dígitos (o marca “Sin teléfono”)':!cliente.trim()?'Captura el nombre del cliente':faltaDir?'Captura la dirección':''}</p>}
        <Btn full color="green" size="lg" disabled={!puedeCrear} onClick={crear}><Icon name="check" size={17} className="mr-1.5"/>Crear pedido · {fmt(totalFinal)}</Btn>
      </React.Fragment>)}
    </div></Modal>);
}

function CobrarModal({open,pedido,onClose,onCobrar}){
  const [modo,setModo]=useState('efectivo');
  const [efectivo,setEfectivo]=useState('');
  const [transferencia,setTransferencia]=useState('');
  const [recibido,setRecibido]=useState('');
  useEffect(()=>{
    if(open&&pedido){
      const pagos=normalizePagos(pedido.pagos,Number(pedido.total)||0,pedido.metodoPago||'efectivo');
      const metodo=metodoFromPagos(pagos,pedido.metodoPago||'efectivo');
      setModo(metodo||'efectivo');
      setEfectivo(pagos.efectivo?String(pagos.efectivo):'');
      setTransferencia(pagos.transferencia?String(pagos.transferencia):'');
      setRecibido(pedido.montoRecibido?String(pedido.montoRecibido):'');
    }
  },[open,pedido]);
  if(!pedido)return null;
  const total=Number(pedido.total)||0;
  const pagoMixto={efectivo:Number(efectivo)||0,transferencia:Number(transferencia)||0};
  // Ambas partes >= 0: un monto negativo podria "sumar" el total y corromper caja.
  const mixtoOk=pagoMixto.efectivo>=0&&pagoMixto.transferencia>=0&&sumPagos(pagoMixto)===_roundMoney(total);
  // Cambio: auxiliar operativo. La caja usa SIEMPRE el neto (total), nunca el
  // bruto recibido. montoRecibido/cambioDevuelto solo se guardan para el registro.
  const recibidoNum=Number(recibido)||0;
  const cambio=recibido!==''&&recibidoNum>=total?_roundMoney(recibidoNum-total):null;
  const cobrarSimple=metodo=>{
    const pago={metodoPago:metodo,pagos:normalizePagos(null,total,metodo)};
    if(metodo==='efectivo'&&recibido!==''&&recibidoNum>=total){pago.montoRecibido=recibidoNum;pago.cambioDevuelto=_roundMoney(recibidoNum-total);}
    onCobrar(pago);
  };
  const cobrarMixto=()=>{if(mixtoOk)onCobrar({metodoPago:'mixto',pagos:pagoMixto});};
  return(<Modal open={open} onClose={onClose} title={`Cobrar #${String(pedido.numero).padStart(3,'0')}`}>
    <div className="space-y-4">
      <div className="brand-panel text-center">
        <p className="text-[11px] uppercase tracking-[0.28em] text-[rgba(255,244,229,0.78)]">total a cobrar</p>
        <p className="text-4xl font-black tracking-tight mt-2">{fmt(pedido.total)}</p>
        {pedido.costoEnvio>0&&<p className="text-xs text-[rgba(255,244,229,0.86)] mt-2">Incluye envio: {fmt(pedido.costoEnvio)}</p>}
        {pedido.cliente&&<p className="text-xs text-[rgba(255,244,229,0.72)] mt-2">{pedido.cliente}</p>}
      </div>
      <div className="grid grid-cols-3 gap-2">
        <button onClick={()=>setModo('efectivo')} aria-pressed={modo==='efectivo'} className={`${modo==='efectivo'?'surface-card-strong':'surface-card'} py-4 text-center card-press`}>
          <div className="text-[#2c7a54] mb-2"><Icon name="cash" size={26}/></div><p className="font-black text-[#2c7a54]">Efectivo</p><p className="text-[11px] text-[#698170] mt-1">Entra directo a caja</p></button>
        <button onClick={()=>setModo('transferencia')} aria-pressed={modo==='transferencia'} className={`${modo==='transferencia'?'surface-card-strong':'surface-card'} py-4 text-center card-press`}>
          <div className="text-[#255a7b] mb-2"><Icon name="phone" size={26}/></div><p className="font-black text-[#255a7b]">Transferencia</p><p className="text-[11px] text-[#677987] mt-1">Pago digital confirmado</p></button>
        <button onClick={()=>setModo('mixto')} aria-pressed={modo==='mixto'} className={`${modo==='mixto'?'surface-card-strong':'surface-card'} py-4 text-center card-press`}>
          <div className="text-[#7040a0] mb-2"><Icon name="cash" size={22}/><Icon name="phone" size={22}/></div><p className="font-black text-[#7040a0]">Mixto</p><p className="text-[11px] text-[#786482] mt-1">Parte y parte</p></button>
      </div>
      {modo==='efectivo'&&<div className="surface-card space-y-2">
        <Input label="Efectivo recibido del cliente (opcional)" type="number" value={recibido} onChange={setRecibido} prefix="$" placeholder="Para calcular el cambio"/>
        {recibido!==''&&<div className={`rounded-xl p-3 text-sm font-bold text-center ${recibidoNum<total?'bg-red-50 text-red-600':cambio>0?'bg-blue-50 text-blue-700':'bg-green-50 text-green-700'}`}>
          {recibidoNum<total?`Faltan ${fmt(total-recibidoNum)}`:cambio>0?`Cambio a devolver: ${fmt(cambio)}`:'Pago exacto, sin cambio'}
        </div>}
        <p className="text-[11px] text-[#698170]">La caja recibe el neto ({fmt(total)}); el cambio no altera el efectivo esperado.</p>
      </div>}
      {modo==='mixto'&&<div className="surface-card space-y-3">
        <div className="grid grid-cols-2 gap-3">
          <Input label="Efectivo recibido" type="number" value={efectivo} onChange={setEfectivo} prefix="$" placeholder="0"/>
          <Input label="Transferencia" type="number" value={transferencia} onChange={setTransferencia} prefix="$" placeholder="0"/>
        </div>
        <div className={`rounded-xl p-3 text-sm font-bold text-center ${mixtoOk?'bg-green-50 text-green-700':'bg-red-50 text-red-600'}`}>
          {mixtoOk?`Suma correcta: ${fmt(total)}`:`Faltan o sobran ${fmt(Math.abs(total-sumPagos(pagoMixto)))}`}
        </div>
      </div>}
      {modo!=='mixto'
        ? <Btn full color={modo==='efectivo'?'green':'blue'} size="lg" onClick={()=>cobrarSimple(modo)}>Cobrar {fmt(total)} · {pagoLabel(modo)}</Btn>
        : <Btn full color="purple" size="lg" disabled={!mixtoOk} onClick={cobrarMixto}>Cobrar pago mixto</Btn>}
    </div></Modal>);
}
