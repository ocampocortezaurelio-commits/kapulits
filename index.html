function GastosPage({state,onRegistrar,onEliminar,onActualizar}){
  const [catSel,setCatSel]=useState('guiso_principal');const [desc,setDesc]=useState('');const [monto,setMonto]=useState('');
  const [enEfectivo,setEnEfectivo]=useState(true);const [confirmDel,setConfirmDel]=useState(null);
  const [showConfirmAdd,setShowConfirmAdd]=useState(false);const [nuevaCat,setNuevaCat]=useState('');
  const [editGasto,setEditGasto]=useState(null);
  const ja=state.jornadaActiva;
  if(!ja)return(<div className="safe-bottom"><TopBar title="Gastos"/>
    <EmptyState icon="lock" title="Jornada no iniciada" sub="Ve a Inicio y abre la jornada"/></div>);
  const totalG=calcGastosTotal(ja.gastos);
  const totalGEfectivo=_gastosEfectivo(ja);
  const totalGOtro=totalG-totalGEfectivo;

  // Categorias dinamicas: las default + cualquiera que haya sido usada en gastos historicos
  const catsUsadas=useMemo(()=>{
    const custom=new Set();
    state.jornadas.forEach(j=>j.gastos.forEach(g=>{
      if(!CATS_GASTO_DEFAULT.find(c=>c.id===g.categoria))custom.add(g.categoria);
    }));
    if(ja)ja.gastos.forEach(g=>{
      if(!CATS_GASTO_DEFAULT.find(c=>c.id===g.categoria))custom.add(g.categoria);
    });
    return[...CATS_GASTO_DEFAULT,...[...custom].map(c=>({id:c,label:c.charAt(0).toUpperCase()+c.slice(1),emoji:'🏷️'}))];
  },[state.jornadas,ja]);

  const agregarCategoria=()=>{
    if(!nuevaCat.trim())return;
    const id=nuevaCat.trim().toLowerCase().replace(/\s+/g,'_');
    if(!catsUsadas.find(c=>c.id===id)){
      setCatSel(id);
    }else{setCatSel(id);}
    setNuevaCat('');
  };

  const intentarRegistrar=()=>{
    const m=Number(monto);
    if(!(m>0)||!desc)return; // monto positivo obligatorio (bloquea negativos y NaN)
    // Si la categoria no existe aun, crearla al vuelo
    const catId=nuevaCat.trim()?nuevaCat.trim().toLowerCase().replace(/\s+/g,'_'):catSel;
    setShowConfirmAdd({cat:catId,desc,monto:m,enEfectivo});
  };

  const confirmarRegistro=()=>{
    if(!showConfirmAdd)return;
    onRegistrar(showConfirmAdd.cat,showConfirmAdd.desc,showConfirmAdd.monto,showConfirmAdd.enEfectivo);
    setDesc('');setMonto('');setShowConfirmAdd(false);
  };

  const catActual=catsUsadas.find(c=>c.id===catSel)||{emoji:'🏷️',label:catSel};

  return(<div className="safe-bottom"><TopBar title="Gastos" subtitle={`Total del día ${fmt(totalG)}`}/>
    <div className="app-shell space-y-5"><div className="md:grid md:grid-cols-2 md:gap-6 md:items-start space-y-5 md:space-y-0">
      <div className="surface-card-strong space-y-4">
        <div>
          <p className="section-kicker mb-2">Registro rápido</p>
          <h2 className="section-title">Captura cada salida de efectivo con claridad</h2>
        </div>
        <div><p className="text-xs font-bold text-[#86695c] mb-2 uppercase tracking-[0.22em]">Categoria</p>

              className="flex-1 px-3 py-2.5 text-sm border border-[rgba(178,69,24,0.26)] rounded-2xl outline-none bg-[rgba(255,251,246,0.96)] text-[#2c1b16]"/>
            <button onClick={agregarCategoria} className="px-4 py-2.5 bg-[#b24518] text-white text-xs font-bold rounded-2xl shadow-[0_12px_28px_rgba(178,69,24,0.2)]">Agregar</button>
          </div>)}</div>

      <Input label="Monto total" type="number" value={monto} onChange={setMonto} prefix="$" placeholder="0"/>
      <div className="flex items-center gap-3 rounded-[22px] border border-[rgba(104,74,56,0.12)] bg-[rgba(255,251,246,0.9)] px-4 py-3">
        <button onClick={()=>setEnEfectivo(!enEfectivo)} className={`w-12 h-6 rounded-full transition-colors ${enEfectivo?'bg-green-500':'bg-[#d8c6bd]'} relative`}>
          <span className={`absolute top-0.5 w-5 h-5 bg-white rounded-full shadow transition-all ${enEfectivo?'right-0.5':'left-0.5'}`}/></button>
        <span className="text-sm text-[#5d463b] font-medium"><Icon name={enEfectivo?'cash':'phone'} size={14} className="mr-1"/>{enEfectivo?'Efectivo':'Otro medio'}</span></div>
      <Btn full size="lg" onClick={intentarRegistrar} disabled={!desc||!monto}>+ Registrar Gasto</Btn>
      </div>

      {ja.gastos.length>0&&(
        <div className="surface-card">
          <p className="section-kicker mb-2">Historial</p>
          <h3 className="section-title mb-4">Gastos del día</h3>
          {[...ja.gastos].reverse().map(g=>{const cat=catsUsadas.find(c=>c.id===g.categoria);
            return(<div key={g.id} className="flex items-center justify-between py-2.5 border-b border-[rgba(104,74,56,0.08)] last:border-0">
              <div className="flex items-center gap-2 min-w-0"><span className="shrink-0 text-[#a14017] opacity-80"><Icon name="tag" size={16}/></span>
                <div className="min-w-0"><p className="text-sm font-bold text-[#2f1d17] truncate">{g.descripcion}</p>
                  <p className="text-xs text-[#8c7265]">{g.hora} · {cat?.label||g.categoria} · {g.enEfectivo!==false?'impacta caja':'otro medio'}</p></div></div>
              <div className="flex items-center gap-2 shrink-0"><span className="font-black text-[#b24518] text-sm">{fmt(g.monto)}</span>
                <button onClick={()=>setEditGasto(g)} className="text-[#8c7265] text-xs font-bold px-2 py-1 rounded-lg bg-[rgba(121,87,67,.08)]" aria-label="Editar gasto">Editar</button>
                <button onClick={()=>setConfirmDel(g)} className="text-[#c6a79a] hover:text-[var(--danger)] w-9 h-9 flex items-center justify-center rounded-full transition-colors duration-150" aria-label="Eliminar gasto"><Icon name="trash" size={15}/></button></div></div>);})}
          {confirmDel&&<div className="mt-3 bg-[rgba(255,239,236,0.95)] rounded-2xl p-3 flex items-center justify-between gap-3">
            <span className="text-xs text-[#a33f26]">Eliminar "{confirmDel.descripcion}" ({fmt(confirmDel.monto)})?</span>
            <div className="flex gap-2">
              <button onClick={()=>setConfirmDel(null)} className="text-xs font-bold text-[#86695c] px-2 py-1">No</button>
              <button onClick={()=>{onEliminar(confirmDel.id);setConfirmDel(null);}} className="text-xs font-bold text-[#9f331c] bg-[rgba(255,219,212,0.95)] px-3 py-1 rounded-xl">Eliminar</button>
            </div></div>}
          <div className="divider-warm mt-4"/>
          <div className="pt-3 space-y-1">
            <div className="flex justify-between text-xs"><span className="text-[#80665a]">Impacta caja</span><span className="font-bold text-[#2f1d17]">{fmt(totalGEfectivo)}</span></div>
            {totalGOtro>0&&<div className="flex justify-between text-xs"><span className="text-[#80665a]">Otro medio</span><span className="font-bold text-[#2f1d17]">{fmt(totalGOtro)}</span></div>}
            <div className="flex justify-between">
            <span className="font-bold text-sm text-[#5e483d]">Total</span><span className="font-black text-[#b24518]">{fmt(totalG)}</span></div>
          </div>
        </div>)}
      </div>{/* close md:grid */}

      <Modal open={!!showConfirmAdd} onClose={()=>setShowConfirmAdd(false)} title="Confirmar gasto">
        {showConfirmAdd&&(<div className="space-y-4">
          <div className="surface-card-strong space-y-2">
            <div className="flex justify-between text-sm"><span className="text-[#80665a]">Categoria</span><span className="font-bold text-[#2f1d17]"><Icon name="tag" size={13} className="mr-1"/>{showConfirmAdd.cat}</span></div>
            <div className="flex justify-between text-sm gap-4"><span className="text-[#80665a]">Descripcion</span><span className="font-bold text-[#2f1d17] text-right">{showConfirmAdd.desc}</span></div>
            <div className="flex justify-between text-sm"><span className="text-[#80665a]">Monto</span><span className="font-black text-[#b24518] text-lg">{fmt(showConfirmAdd.monto)}</span></div>

          <p className="text-sm text-[#7a5f53] text-center">Verifica que la información sea correcta antes de registrar.</p>
          <div className="flex gap-3">
            <Btn full color="gray" onClick={()=>setShowConfirmAdd(false)}>Corregir</Btn>
            <Btn full color="green" onClick={confirmarRegistro}><Icon name="check" size={15} className="mr-1.5"/>Confirmar</Btn>
          </div>
        </div>)}
      </Modal>
      <EditarGastoModal open={!!editGasto} gasto={editGasto} cats={catsUsadas}
        onClose={()=>setEditGasto(null)}
        onGuardar={cambios=>{onActualizar(editGasto.id,cambios);setEditGasto(null);}}/>
    </div></div>);
}

function EditarGastoModal({open,gasto,cats,onClose,onGuardar}){
  const [categoria,setCategoria]=useState(gasto?.categoria||'ingredientes');
  const [descripcion,setDescripcion]=useState(gasto?.descripcion||'');
  const [monto,setMonto]=useState(gasto?.monto||'');
  const [enEfectivo,setEnEfectivo]=useState(gasto?.enEfectivo!==false);
  useEffect(()=>{
    if(!open||!gasto)return;
    setCategoria(gasto.categoria);
    setDescripcion(gasto.descripcion||'');
    setMonto(gasto.monto||'');
    setEnEfectivo(gasto.enEfectivo!==false);
  },[open,gasto]);
  if(!gasto)return null;
  return(<Modal open={open} onClose={onClose} title="Editar gasto">
    <div className="space-y-4">
      <div>
        <p className="text-xs font-bold text-[#86695c] mb-2 uppercase tracking-[0.22em]">Categoria</p>
        <div className="flex gap-2 overflow-x-auto pb-1">{cats.map(c=>(
          <button key={c.id} onClick={()=>setCategoria(c.id)}
            className={`flex-shrink-0 flex items-center gap-1 px-3.5 py-2.5 rounded-2xl text-xs font-bold border
              ${categoria===c.id?'border-[rgba(178,69,24,0.28)] bg-[rgba(255,240,228,0.98)] text-[#a14017]':'border-[rgba(104,74,56,0.14)] bg-[rgba(255,251,246,0.92)] text-[#6e5548]'}`}><Icon name="tag" size={12}/> {c.label}</button>))}</div>
      </div>
      <Input label="Descripcion" value={descripcion} onChange={setDescripcion}/>
      <Input label="Monto" type="number" value={monto} onChange={setMonto} prefix="$"/>
      <div className="flex items-center justify-between rounded-[22px] border border-[rgba(104,74,56,0.12)] bg-[rgba(255,251,246,0.9)] px-4 py-3">
        <span className="text-sm text-[#5d463b] font-medium"><Icon name={enEfectivo?'cash':'phone'} size={14} className="mr-1"/>{enEfectivo?'Sale de caja':'No sale de caja'}</span>
        <button onClick={()=>setEnEfectivo(!enEfectivo)} className={`w-12 h-6 rounded-full transition-colors ${enEfectivo?'bg-green-500':'bg-[#d8c6bd]'} relative`}>
          <span className={`absolute top-0.5 w-5 h-5 bg-white rounded-full shadow transition-all ${enEfectivo?'right-0.5':'left-0.5'}`}/></button>
      </div>
      <Btn full color="green" disabled={!descripcion||!(Number(monto)>0)} onClick={()=>onGuardar({categoria,descripcion,monto:Number(monto),enEfectivo})}>Guardar gasto</Btn>
    </div>
  </Modal>);
}

// ─── REPORTES ───────────────────────────────────────────────────────
function ReportesPage({state}){
  const [tab,setTab]=useState('diario');const [jornadaSel,setJornadaSel]=useState(null);
  const cerradas=state.jornadas.filter(j=>j.estado==='cerrada');
  useEffect(()=>{if(cerradas.length&&!jornadaSel)setJornadaSel(cerradas[cerradas.length-1].id);},[cerradas.length]);
  const jActual=jornadaSel?state.jornadas.find(j=>j.id===jornadaSel):(state.jornadaActiva||null);
  const proj=calcProjections(state.jornadas);const stats=getProductoStats(state.jornadas,state.productos);const recs=getRecomendaciones(proj,stats);
  const productSales=useMemo(()=>{if(!jActual)return[];const m={};
    // Sin reversas ni originales de pedidos cancelados (misma regla que getProductoStats).
    const act=ventasActivas(jActual.ventas||[]);
    const revIds=new Set(act.filter(v=>v.esReversa).map(v=>v.ventaOrigId));
    act.filter(v=>!v.esReversa&&!revIds.has(v.id)).forEach(v=>v.items.forEach(i=>{m[i.nombre]=(m[i.nombre]||0)+i.subtotal;}));
    return Object.entries(m).sort((a,b)=>b[1]-a[1]);},[jActual]);
  return(<div className="safe-bottom"><TopBar title="Reportes"/>
    <div className="app-shell">
      <div className="brand-panel">
        <p className="section-kicker text-[rgba(255,244,229,0.76)]">Resumen del negocio</p>
        <h2 className="text-[clamp(1.7rem,6vw,2.4rem)] font-black tracking-tight">Lecturas claras para decidir mejor</h2>
        <p className="mt-2 text-sm text-[rgba(255,244,229,0.8)]">Ventas, utilidad y comportamiento del día, sin ruido técnico.</p>
      </div>
      <div className="flex rounded-[26px] border border-[rgba(104,74,56,0.12)] bg-[rgba(255,251,246,0.92)] p-1.5 mb-1 overflow-x-auto gap-1 shadow-[0_16px_40px_rgba(90,53,33,0.08)]">
        {[{id:'diario',l:'Diario',icon:null},{id:'mensual',l:'Mensual',icon:null},{id:'mandaditos',l:'Mandaditos',icon:'bike'},{id:'inteligencia',l:'Inteligencia',icon:'sparkles'},{id:'pdf',l:'PDF',icon:'file'}].map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)} aria-label={t.l}
            className={`flex-shrink-0 flex-1 py-3 min-h-[44px] text-xs md:text-sm font-black rounded-[20px] transition-all duration-150 ${tab===t.id?'bg-[rgba(255,240,228,0.98)] text-[#a14017] shadow-[0_10px_26px_rgba(178,69,24,0.1)]':'text-[#7b6356]'}`}>
            <span className="md:hidden">{t.icon?<Icon name={t.icon} size={16} label={t.l}/>:t.l}</span><span className="hidden md:inline">{t.icon&&<Icon name={t.icon} size={14} className="mr-1"/>}{t.l}</span></button>))}</div>

      {tab==='diario'&&(<div className="space-y-5">
        {state.jornadas.length===0&&<EmptyState icon="chart" title="Sin jornadas aun" sub="Abre tu primera jornada"/>}
        {state.jornadas.length>0&&(<React.Fragment>
          <div><p className="text-xs font-bold text-[#876a5d] mb-2 uppercase tracking-[0.22em]">Selecciona jornada</p>
            <div className="flex gap-2 overflow-x-auto pb-1">
              {state.jornadaActiva&&<button onClick={()=>setJornadaSel(null)}
                className={`flex-shrink-0 px-3.5 py-2.5 rounded-2xl text-xs font-bold border ${!jornadaSel?'border-[rgba(178,69,24,0.28)] bg-[rgba(255,240,228,0.98)] text-[#a14017]':'border-[rgba(104,74,56,0.14)] bg-[rgba(255,251,246,0.9)] text-[#6f564a]'}`}><Icon name="sun" size={12} className="mr-1"/>Hoy</button>}
              {[...cerradas].reverse().map(j=>(
                <button key={j.id} onClick={()=>setJornadaSel(j.id)}
                  className={`flex-shrink-0 px-3.5 py-2.5 rounded-2xl text-xs font-bold border ${jornadaSel===j.id?'border-[rgba(178,69,24,0.28)] bg-[rgba(255,240,228,0.98)] text-[#a14017]':'border-[rgba(104,74,56,0.14)] bg-[rgba(255,251,246,0.9)] text-[#6f564a]'}`}>{fmtDateShort(j.fecha)}</button>))}</div></div>
          {jActual&&(()=>{const mj=buildCajaModel(jActual);
            const tv=mj.productosTotal;const tg=mj.gastosTotal;const ut=mj.utilidadBrutaProductos;
            const mg=tv>0?((ut/tv)*100).toFixed(1):0;const manda=mj.enviosTotal;
            const pRecoger=(jActual.pedidos||[]).filter(p=>p.tipoEntrega==='recoger'&&p.estado!=='cancelado').length;
            const pEnvio=(jActual.pedidos||[]).filter(p=>(Number(p.costoEnvio)||0)>0&&p.estado!=='cancelado').length;
            return(<div className="space-y-4">
              <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                <MetricCard icon="coins" label="Ventas" value={fmt(tv)} color="green" sub={`Cobrado total: ${fmt(mj.cobrosTotal)}`}/>
                <MetricCard icon="wallet" label="Gastos" value={fmt(tg)} color="red"/>
                <MetricCard icon="trendUp" label="Utilidad" value={fmt(ut)} color={ut>=0?'green':'red'} sub={`Margen: ${mg}%`}/>

              </div>
              {manda>0&&<MetricCard icon="bike" label="Mandaditos" value={fmt(manda)} color="purple" sub={`${pEnvio} servicios de envio`}/>}
              {productSales.length>0&&(<div className="surface-card">
                <p className="section-kicker mb-2">Detalle</p>
                <h3 className="section-title mb-4">Ventas por producto</h3>
                <BarChart labels={productSales.map(([n])=>n.split(' ')[0])} values={productSales.map(([,v])=>v)}

            </div>);})()}
        </React.Fragment>)}</div>)}

      {tab==='mensual'&&(<div className="space-y-5">
        {cerradas.length===0&&<EmptyState icon="calendar" title="Sin jornadas cerradas" sub="Cierra al menos una jornada"/>}
        {cerradas.length>0&&(()=>{const ms=cerradas.map(j=>buildCajaModel(j));
          const tv=_roundMoney(ms.reduce((s,m)=>s+m.productosTotal,0));
          const tg=_roundMoney(ms.reduce((s,m)=>s+m.gastosTotal,0));const tu=_roundMoney(tv-tg);
          return(<div className="space-y-5">
            <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
              <MetricCard icon="calendar" label="Jornadas" value={cerradas.length} sub="registradas" color="blue"/>
              <MetricCard icon="chart" label="Prom/Jornada" value={fmt(tv/cerradas.length)} color="orange"/>
              <MetricCard icon="coins" label="Total Acumulado" value={fmt(tv)} color="green"/>
              <MetricCard icon="trendUp" label="Utilidad Prom." value={fmt(tu/cerradas.length)} color={tu>=0?'green':'red'}/>

            {proj&&cerradas.length>1&&(<div className="surface-card">

              <div className="flex gap-4 text-xs mb-3 text-[#7c6255]"><span className="flex items-center gap-1"><span className="w-3 h-0.5 bg-orange-500 inline-block"/>Ventas</span>
                <span className="flex items-center gap-1"><span className="w-3 h-0.5 bg-green-500 inline-block"/>Utilidad</span></div>
              <LineChart dates={proj.dates} revenues={proj.revenues} profits={proj.profits}/></div>)}
            {proj&&(<div className="surface-card">
              <p className="section-kicker mb-2">Proyección</p>
              <h3 className="section-title mb-3">Mes en curso</h3>
              {[{l:'Ventas proyectadas',v:fmt(proj.projRevenue),c:'text-green-600'},
                {l:'Gastos proyectados',v:fmt(proj.projExpenses),c:'text-red-500'},
                {l:'Utilidad proyectada',v:fmt(proj.projProfit),c:proj.projProfit>=0?'text-green-700':'text-red-600'},
                {l:'Margen promedio',v:`${proj.margin.toFixed(1)}%`,c:'text-orange-600'}
              ].map(r=>(<div key={r.l} className="flex justify-between py-2 border-b border-[rgba(104,74,56,0.08)] last:border-0">
                <span className="text-sm text-[#60493d]">{r.l}</span><span className={`font-black text-sm ${r.c}`}>{r.v}</span></div>))}</div>)}
            {stats.filter(s=>s.cantidad>0).length>0&&(<div className="surface-card">
              <p className="section-kicker mb-2">Desempeño</p>
              <h3 className="section-title mb-3">Productos estrella</h3>
              {stats.filter(s=>s.cantidad>0).slice(0,6).map((s,i)=>(<div key={s.id} className="flex items-center gap-3 py-2 border-b border-[rgba(104,74,56,0.08)] last:border-0">

                <div className="text-right"><p className="text-xs font-black">{fmt(s.revenue)}</p>
                  <p className="text-[10px] text-green-600 font-bold">{(((s.precio-s.costo)/s.precio)*100).toFixed(0)}%</p></div></div>))}</div>)}
            <div className="surface-card">
              <p className="section-kicker mb-2">Lectura</p>

                  <ProductChip id={s.id} cat={s.cat} size={15} pad={9}/>

                  <span className="text-xs font-black text-orange-600">{s.cantidad} pz</span>

function MandaditosReport({jornadas,jornadaActiva}){
  const todas=[...jornadas.filter(j=>j.estado==='cerrada')];
  if(jornadaActiva)todas.push(jornadaActiva);
  // Totales desde buildCajaModel: incluye el desglose de envios en pedidos
  // mixtos, que el conteo por metodoPago del ledger dejaba fuera de Ef/Tr.
  const models=todas.map(j=>buildCajaModel(j));
  const totalManda=_roundMoney(models.reduce((s,m)=>s+m.enviosTotal,0));
  const totalMandaEf=_roundMoney(models.reduce((s,m)=>s+m.enviosEfectivo,0));
  const totalMandaTr=_roundMoney(models.reduce((s,m)=>s+m.enviosTransfer,0));
  const totalMandaMx=_roundMoney(models.reduce((s,m)=>s+m.enviosMixto,0));
  const totalEnvios=todas.reduce((s,j)=>s+(j.mandaditos||[]).length,0);
  const totalRecoger=todas.reduce((s,j)=>s+(j.pedidos||[]).filter(p=>p.tipoEntrega==='recoger'&&p.estado!=='cancelado').length,0);
  const totalClientes=totalEnvios+totalRecoger;
  const porTipo={};
  // Solo envios cobrados: asi el desglose por tipo cuadra con "Envios cobrados"
  // y no suma envios de pedidos cancelados o pendientes.
  todas.forEach(j=>(j.mandaditos||[]).filter(m=>m&&m.cobrado).forEach(m=>{
    if(!porTipo[m.tipo])porTipo[m.tipo]={cant:0,total:0};
    porTipo[m.tipo].cant++;porTipo[m.tipo].total+=(Number(m.tarifa)||0);
  }));
  return(<div className="space-y-5">
    {totalClientes===0&&<EmptyState icon="bike" title="Sin datos de envios" sub="Los mandaditos apareceran aqui"/>}
    {totalClientes>0&&(<React.Fragment>
      <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
        <MetricCard icon="bike" label="Envios cobrados" value={fmt(totalManda)} color="purple" sub="Dinero separado del negocio"/>
        <MetricCard icon="box" label="Total Envios" value={totalEnvios} color="blue"/>
        <MetricCard icon="bag" label="Pasan a Recoger" value={totalRecoger} color="green"/>
        <MetricCard icon="users" label="Total Clientes" value={totalClientes} color="orange"/>
      </div>
      {totalManda>0&&(<div className="bg-white rounded-3xl p-4 shadow-sm border border-gray-100">
        <h3 className="font-black text-gray-800 mb-3 text-sm">Envios por metodo de pago</h3>
        <div className="flex justify-between items-center py-2 border-b border-gray-50"><span className="text-sm text-gray-600"><Icon name="cash" size={14} className="mr-1"/>Efectivo (esta en caja)</span><span className="font-bold text-sm text-green-600">{fmt(totalMandaEf)}</span></div>
        <div className="flex justify-between items-center py-2 border-b border-gray-50"><span className="text-sm text-gray-600"><Icon name="phone" size={14} className="mr-1"/>Transferencia (esta en banco)</span><span className="font-bold text-sm text-blue-600">{fmt(totalMandaTr)}</span></div>
        {totalMandaMx>0&&<div className="flex justify-between items-center py-2"><span className="text-sm text-gray-600"><Icon name="cash" size={14}/><Icon name="phone" size={14} className="mr-1"/>En pedidos mixtos</span><span className="font-bold text-sm text-purple-600">{fmt(totalMandaMx)}</span></div>}
      </div>)}
      {Object.keys(porTipo).length>0&&(<div className="bg-white rounded-3xl p-4 shadow-sm border border-gray-100">
        <h3 className="font-black text-gray-800 mb-3 text-sm">Desglose por tipo de envio</h3>
        {Object.entries(porTipo).map(([tipo,data])=>{const t=TARIFAS_ENVIO[tipo];
          return(<div key={tipo} className="flex justify-between items-center py-2 border-b border-gray-50 last:border-0">
            <span className="text-sm text-gray-600"><Icon name={TIPO_ENVIO_ICON[tipo]||'bag'} size={14} className="mr-1"/>{t?.label||tipo}</span>
            <div className="text-right"><p className="font-bold text-sm text-purple-600">{fmt(data.total)}</p>
              <p className="text-xs text-gray-400">{data.cant} servicios</p></div></div>);})}
      </div>)}
      <div className="bg-purple-50 rounded-2xl p-4 text-sm text-purple-700">
        <p className="font-bold"><Icon name="info" size={13} className="mr-1"/>Nota: Mandaditos</p>
        <p className="text-xs mt-1 opacity-70">Este ingreso se contabiliza por separado del negocio. Es un servicio externo que no afecta la utilidad de ventas de productos.</p>
      </div>
    </React.Fragment>)}
  </div>);
}

// Gestion de clientes frecuentes. La clave es el telefono (unico). El alta rapida
// ocurre sola al crear un pedido; aqui se corrigen datos y direcciones.
function ClientesTab({clientes,onGuardar,onEliminar,onEliminarVarios}){

  const [confirmPurga,setConfirmPurga]=useState(false);
  const lista=Array.isArray(clientes)?clientes:[];

  // quedan con telefono vacio y son validos, no se marcan).
  const raros=lista.filter(c=>{const d=normTel(c.telefono);return d.length>0&&d.length!==10;});
  const nq=normTel(q);const tq=q.trim().toLowerCase();
  const filtrados=lista.filter(c=>{
    if(!q.trim())return true;
    return (nq&&normTel(c.telefono).includes(nq))||String(c.nombre||'').toLowerCase().includes(tq);
  }).sort((a,b)=>String(a.nombre||'').localeCompare(String(b.nombre||'')));
  return(<div className="space-y-4">
    <div className="surface-card-strong flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
      <div>
        <p className="section-kicker mb-1">Base de clientes</p>
        <h3 className="section-title text-[22px]">Clientes frecuentes</h3>
        <p className="text-sm text-[var(--text-soft)] mt-1">{lista.length} guardados · se buscan por teléfono al levantar el pedido.</p>
      </div>
      <Btn color="orange" onClick={()=>setEdit({})}>+ Agregar cliente</Btn>
    </div>
    {raros.length>0&&<div className="rounded-2xl border-2 border-[rgba(202,77,44,0.3)] bg-[rgba(202,77,44,0.06)] p-4 space-y-3">
      <div className="flex items-start gap-2">
        <Icon name="alert" size={16} className="mt-0.5 text-[var(--danger)]"/>
        <div>
          <p className="font-black text-sm text-[var(--danger)]">Depurar clientes ({raros.length})</p>
          <p className="text-xs text-[var(--text-soft)] mt-0.5">Estos clientes tienen números que no son de 10 dígitos (se agregaron sin teléfono real). Los pedidos ya creados no se modifican.</p>
        </div>
      </div>
      <div className="flex flex-wrap gap-2">
        {raros.slice(0,12).map(c=>(<span key={c.id} className="text-[11px] font-bold bg-white/70 border border-[rgba(202,77,44,0.25)] px-2 py-1 rounded-lg text-[var(--text-soft)]">{c.nombre||'Sin nombre'}: {c.telefono}</span>))}
        {raros.length>12&&<span className="text-[11px] font-bold px-2 py-1 text-[var(--text-muted)]">+{raros.length-12} más</span>}
      </div>
      <Btn full color="red" onClick={()=>setConfirmPurga(true)}><Icon name="trash" size={14} className="mr-1.5"/>Eliminar los {raros.length} clientes con número raro</Btn>
    </div>}
    <Input label="Buscar" value={q} onChange={setQ} placeholder="Teléfono o nombre"/>
    {filtrados.length===0?<EmptyState icon="users" title="Sin clientes" sub={lista.length?'Ninguno coincide con la búsqueda':'Se guardan solos al crear pedidos con teléfono'}/>:
      <div className="space-y-3 md:grid md:grid-cols-2 md:gap-4 md:space-y-0">
        {filtrados.map(c=>(<div key={c.id} className="surface-card">
          <div className="flex items-start justify-between gap-3">
            <div className="min-w-0">
              <p className="font-bold text-sm text-[#2f1d17] truncate">{c.nombre||'Sin nombre'}</p>
              <p className="text-xs text-[#7a6255] mt-0.5"><Icon name="phone" size={11} className="mr-1"/>{c.telefono||'—'}</p>
            </div>
            <div className="flex gap-2 shrink-0">
              <button onClick={()=>setEdit(c)} aria-label="Editar cliente" className="text-xs text-[#a14017] font-bold border border-[rgba(178,69,24,0.2)] px-3 py-1.5 rounded-xl bg-[rgba(255,241,230,0.9)]"><Icon name="edit" size={13}/></button>
              <button onClick={()=>setConfirmDel(c)} aria-label="Eliminar cliente" className="text-xs text-[var(--danger)] font-bold border border-[rgba(202,77,44,0.2)] px-3 py-1.5 rounded-xl"><Icon name="trash" size={13}/></button>
            </div>
          </div>
          {(c.direcciones||[]).length>0&&<div className="flex flex-wrap gap-1.5 mt-2">
            {c.direcciones.map(d=>(<span key={d.id} className="text-[11px] text-[var(--text-soft)] bg-[rgba(255,251,246,0.92)] border border-[rgba(221,192,161,.5)] px-2 py-1 rounded-lg"><Icon name="pin" size={10} className="mr-1"/>{d.etiqueta}: {d.texto}</span>))}
          </div>}
        </div>))}
      </div>}
    {edit&&<ClienteEditModal cliente={edit} onClose={()=>setEdit(null)} onGuardar={(datos)=>{onGuardar(edit.id||null,datos);setEdit(null);}}/>}
    <Modal open={!!confirmDel} onClose={()=>setConfirmDel(null)} title="Eliminar cliente">
      {confirmDel&&(<div className="space-y-4">
        <p className="text-sm text-[var(--text-soft)] text-center">Se eliminará <span className="font-bold">{confirmDel.nombre||confirmDel.telefono}</span> de la base de clientes. Los pedidos ya creados no se modifican.</p>

        </div></div>
    </Modal>
  </div>);
}

function ClienteEditModal({cliente,onClose,onGuardar}){
  const [nombre,setNombre]=useState(cliente.nombre||'');
  const [telefono,setTelefono]=useState(cliente.telefono||'');
  const [dirs,setDirs]=useState(()=>(cliente.direcciones||[]).map(d=>({...d})));
  const nid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const setDir=(id,campo,val)=>setDirs(ds=>ds.map(d=>d.id===id?{...d,[campo]:val}:d));
  const addDir=()=>setDirs(ds=>[...ds,{id:nid(),etiqueta:'Casa',texto:''}]);
  const remDir=id=>setDirs(ds=>ds.filter(d=>d.id!==id));
  // Telefono opcional; si se captura debe ser de 10 digitos. Nombre siempre.
  const telDig=normTel(telefono);const puede=nombre.trim().length>0&&(telDig.length===0||telDig.length===10);
  const guardar=()=>{if(!puede)return;onGuardar({nombre:nombre.trim(),telefono:telefono.trim(),direcciones:dirs.filter(d=>String(d.texto||'').trim()).map(d=>({id:d.id,etiqueta:d.etiqueta||'Otro',texto:d.texto.trim()}))});};
  return(<Modal open={true} onClose={onClose} title={cliente.id?'Editar cliente':'Nuevo cliente'} fullScreen>
    <div className="space-y-4">
      <Input label="Teléfono (10 dígitos · opcional)" value={telefono} onChange={setTelefono} type="tel" placeholder="10 dígitos o déjalo vacío"/>
      <Input label="Nombre" value={nombre} onChange={setNombre} placeholder="Nombre del cliente"/>
      <div className="space-y-3">
        <div className="flex items-center justify-between">
          <p className="text-[11px] font-bold text-[var(--text-muted)] uppercase tracking-[0.14em]">Direcciones</p>
          <Btn size="sm" color="orange" variant="outline" onClick={addDir}><Icon name="plus" size={13} className="mr-1"/>Agregar</Btn>
        </div>
        {dirs.length===0&&<p className="text-xs text-[var(--text-muted)]">Sin direcciones. Agrega Casa, Oficina, etc.</p>}
        {dirs.map(d=>(<div key={d.id} className="surface-card space-y-2">
          <div className="flex flex-wrap gap-2">{ETIQUETAS_DIR.map(e=>(<button key={e} type="button" onClick={()=>setDir(d.id,'etiqueta',e)} aria-pressed={d.etiqueta===e}
            className={`text-xs font-bold px-3 py-1.5 rounded-[12px] border ${d.etiqueta===e?'border-orange-500 bg-orange-50 text-orange-700':'border-[rgba(221,192,161,.7)] text-[var(--text-soft)]'}`}>{e}</button>))}</div>
          <div className="flex gap-2 items-end">
            <div className="flex-1"><Input label="Dirección" value={d.texto} onChange={v=>setDir(d.id,'texto',v)} placeholder="Calle, número, colonia..."/></div>
            <button onClick={()=>remDir(d.id)} aria-label="Quitar dirección" className="mb-1 text-[var(--danger)] border border-[rgba(202,77,44,0.2)] p-2.5 rounded-xl"><Icon name="trash" size={15}/></button>
          </div>
        </div>))}
      </div>
      {!puede&&<p className="text-xs font-bold text-[var(--danger)] text-center">{!nombre.trim()?'Captura el nombre':'El teléfono debe tener 10 dígitos (o déjalo vacío)'}</p>}
      <Btn full color="green" size="lg" disabled={!puede} onClick={guardar}><Icon name="save" size={17} className="mr-1.5"/>Guardar cliente</Btn>
    </div></Modal>);
}

            {s&&s.cantidad>0&&<p className="text-xs text-gray-400 mt-2 text-center">{s.cantidad} vendidos · {fmt(s.revenue)}</p>}
            <div className="mt-2 bg-gray-100 rounded-full h-2"><div className={`h-2 rounded-full ${margen>=40?'bg-green-500':margen>=20?'bg-yellow-400':'bg-red-400'}`} style={{width:`${Math.min(margen,100)}%`}}/></div>
          </div>);})}
        </div>{/* close md:grid costos */}
      </div>)}

      {tab==='productos'&&(<div className="space-y-4">
        <div className="surface-card-strong flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
          <div>
            <p className="section-kicker mb-1">Catalogo</p>
            <h3 className="section-title text-[22px]">Productos del menu</h3>
            <p className="text-sm text-[var(--text-soft)] mt-1">Activa, desactiva o agrega productos manualmente con precio y costo.</p>
          </div>
          <Btn color="orange" onClick={()=>setShowAddProd(true)}>+ Agregar producto</Btn>
        </div>
        <div className="space-y-3 md:grid md:grid-cols-2 md:gap-4 md:space-y-0">
          {state.productos.filter(p=>!p.esVariado).map(p=>(<div key={p.id} className="surface-card flex items-center justify-between gap-3">
            <div className="flex items-center gap-3 min-w-0">
              <ProductChip id={p.id} cat={p.cat} size={20} pad={12}/>
              <div className="min-w-0">
                <p className="font-bold text-sm text-[#2f1d17] truncate">{p.nombre}</p>
                <p className="text-xs text-[#7a6255] truncate">{fmt(p.precio)}{COMBO_DESC[p.id]?` · ${COMBO_DESC[p.id]}`:''}</p>
              </div>
            </div>
            <button onClick={()=>onActualizarProducto(p.id,{activo:!p.activo})}
              className={`w-12 h-6 rounded-full transition-colors shrink-0 ${p.activo?'bg-green-500':'bg-[#d8c6bd]'} relative`}>
              <span className={`absolute top-0.5 w-5 h-5 bg-white rounded-full shadow transition-all ${p.activo?'right-0.5':'left-0.5'}`}/></button>
          </div>))}
        </div>
      </div>)}

      {tab==='impresora'&&(<ImpresoraTab impresora={state.impresora} onActualizar={onActualizarImpresora}/>)}

      {tab==='config'&&(<ConfigTab state={state} onActualizarGastoFijo={onActualizarGastoFijo}
        onAgregarGastoFijo={onAgregarGastoFijo} onEliminarGastoFijo={onEliminarGastoFijo}
        onAgregarEmpleado={onAgregarEmpleado} onEditarEmpleado={onEditarEmpleado} onEliminarEmpleado={onEliminarEmpleado}
        syncStatus={syncStatus} lastCloudAt={lastCloudAt} deviceInfo={deviceInfo}
        onSyncNow={onSyncNow} onPullFromCloud={onPullFromCloud} onSetDeviceRole={onSetDeviceRole}
        onListBackups={onListBackups} onRestoreBackup={onRestoreBackup}
        onAuditHistoricalData={onAuditHistoricalData} onRepairHistoricalData={onRepairHistoricalData}/>)}
    </div>

    {editProd&&<Modal open={!!editProd} onClose={()=>setEditProd(null)} title={`Editar: ${editProd.nombre}`}>
      <EditProductoForm producto={editProd} onSave={d=>{onActualizarProducto(editProd.id,d);setEditProd(null);}}/></Modal>}
    <Modal open={showAddProd} onClose={()=>setShowAddProd(false)} title="Agregar producto">
      <ProductoForm onSave={d=>{onAgregarProducto(d);setShowAddProd(false);}}/>
    </Modal>
  </div>);
}

// ── Config Tab ──
function ConfigTab({state,onActualizarGastoFijo,onAgregarGastoFijo,onEliminarGastoFijo,
  onAgregarEmpleado,onEditarEmpleado,onEliminarEmpleado,syncStatus,lastCloudAt,deviceInfo,
  onSyncNow,onPullFromCloud,onSetDeviceRole,onListBackups,onRestoreBackup,
  onAuditHistoricalData,onRepairHistoricalData}){
  const [showAddEmp,setShowAddEmp]=useState(false);const [editEmp,setEditEmp]=useState(null);
  const [empNombre,setEmpNombre]=useState('');const [empRol,setEmpRol]=useState('');const [empSueldo,setEmpSueldo]=useState('');
  const [nuevoGF,setNuevoGF]=useState('');const [confirmDelEmp,setConfirmDelEmp]=useState(null);const [confirmDelGF,setConfirmDelGF]=useState(null);
  const [backups,setBackups]=useState([]);const [syncMsg,setSyncMsg]=useState(null);
  const [confirmPull,setConfirmPull]=useState(false);const [confirmRestore,setConfirmRestore]=useState(null);
  const [auditReport,setAuditReport]=useState(null);const [repairMsg,setRepairMsg]=useState(null);

  useEffect(()=>{setBackups(onListBackups());},[onListBackups]);

  const guardarEmpleado=()=>{
    if(!empNombre)return;
    if(editEmp){onEditarEmpleado(editEmp.id,{nombre:empNombre,rol:empRol,sueldo:empSueldo});setEditEmp(null);}
    else{onAgregarEmpleado(empNombre,empRol,empSueldo);}
    setEmpNombre('');setEmpRol('');setEmpSueldo('');setShowAddEmp(false);
  };
  const iniciarEdicion=(e)=>{setEditEmp(e);setEmpNombre(e.nombre);setEmpRol(e.rol);setEmpSueldo(String(e.sueldo));setShowAddEmp(true);};

  const refreshBackups=()=>setBackups(onListBackups());
  // Mensajes de estado como objetos {kind,text}: sin emojis en UI.
  const runSync=async()=>{
    setSyncMsg({kind:'info',text:'Sincronizando...'});
    const r=await onSyncNow();
    setSyncMsg(r.ok?{kind:'ok',text:'Cambios enviados a la nube'}:{kind:'err',text:r.error});
    refreshBackups();
  };
  const runPull=async()=>{
    setConfirmPull(false);
    setSyncMsg({kind:'info',text:'Descargando nube...'});
    const r=await onPullFromCloud();
    setSyncMsg(r.ok?{kind:'ok',text:'Datos descargados desde la nube'}:{kind:'err',text:r.error});
    refreshBackups();
  };
  const runRestore=ts=>{
    const ok=onRestoreBackup(ts);
    setConfirmRestore(null);
    setSyncMsg(ok?{kind:'ok',text:'Backup restaurado en este dispositivo'}:{kind:'err',text:'No se pudo restaurar'});
    refreshBackups();
  };
  const runAudit=()=>{
    const report=onAuditHistoricalData();
    setAuditReport(report);
    setRepairMsg(null);
  };
  const runRepair=()=>{
    const repaired=onRepairHistoricalData();
    setAuditReport(repaired.report);
    setRepairMsg(repaired.changed?{kind:'ok',text:'Reparación histórica aplicada y guardada'}:{kind:'info',text:'No se encontraron cambios históricos por aplicar'});
    refreshBackups();
  };

  const [mute,setMute]=useState(()=>{try{return localStorage.getItem('kapulits_mute')==='1';}catch(e){return false;}});
  const toggleMute=()=>{const n=!mute;setMute(n);try{localStorage.setItem('kapulits_mute',n?'1':'0');}catch(e){}if(!n)snd.click();};
  return(<div className="space-y-5 md:grid md:grid-cols-2 md:gap-5 md:space-y-0 md:items-start">
    <div className="bg-white rounded-3xl p-4 shadow-sm border border-gray-100 md:col-span-2">
      <div className="flex items-center justify-between">
        <div>
          <h3 className="font-black text-gray-800 text-sm"><Icon name="settings" size={15} className="mr-1"/>Sonidos</h3>
          <p className="text-xs text-gray-500 mt-0.5">Moneda al cobrar, impresora al generar ticket y clic en botones.</p>
        </div>
        <div className="flex gap-2 shrink-0">
          <button type="button" onClick={()=>{setTimeout(()=>snd.coin(),350);setTimeout(()=>snd.print(),2000);}} disabled={mute} className={`text-xs font-black px-3 py-2.5 min-h-[44px] rounded-2xl border-2 border-[rgba(72,118,168,0.35)] text-[#4876a8] bg-[rgba(72,118,168,0.08)] ${mute?'opacity-40 pointer-events-none':''}`}>Probar</button>
          <button type="button" onClick={toggleMute} aria-pressed={!mute} className={`text-xs font-black px-4 py-2.5 min-h-[44px] rounded-2xl border-2 transition-colors ${mute?'border-[rgba(202,77,44,0.3)] text-[var(--danger)] bg-[rgba(202,77,44,0.06)]':'border-[rgba(45,139,87,0.35)] text-[var(--success)] bg-[rgba(45,139,87,0.08)]'}`}>{mute?'Silenciado':'Activados'}</button>
        </div>
      </div>
    </div>
    <div className="bg-white rounded-3xl p-4 shadow-sm border border-gray-100">
      <div className="flex items-center justify-between mb-3">
        <h3 className="font-black text-gray-800 text-sm"><Icon name="cloud" size={15} className="mr-1"/>Sync y Respaldo</h3>
        <Badge color={syncStatus==='synced'?'green':syncStatus==='syncing'?'yellow':syncStatus==='remote'?'blue':syncStatus==='offline'?'red':'orange'}>
          {syncStatus==='synced'?'Sincronizado':syncStatus==='syncing'?'Sincronizando':syncStatus==='remote'?'Remoto pendiente':syncStatus==='offline'?'Sin conexión':'Local pendiente'}
        </Badge>
      </div>
      <div className="space-y-3">
        <div className="bg-gray-50 rounded-2xl p-3 text-xs text-gray-600">
          <p><b>Dispositivo actual:</b> {deviceInfo.role==='primary'?'Principal':'Espejo'}</p>
          <p className="mt-1"><b>Última actualización en nube:</b> {fmtDateTime(lastCloudAt)}</p>
        </div>
        <div className="grid grid-cols-2 gap-2">
          <Btn size="sm" color={deviceInfo.role==='primary'?'green':'gray'} onClick={()=>onSetDeviceRole('primary')}><Icon name="monitor" size={14} className="mr-1"/>Principal</Btn>
          <Btn size="sm" color={deviceInfo.role==='mirror'?'blue':'gray'} onClick={()=>onSetDeviceRole('mirror')}><Icon name="phone" size={14} className="mr-1"/>Espejo</Btn>
        </div>
        <div className="grid grid-cols-2 gap-2">
          <Btn size="sm" color="orange" onClick={runSync}><Icon name="cloud" size={14} className="mr-1"/>Enviar ahora</Btn>
          <Btn size="sm" color="gray" onClick={()=>setConfirmPull(true)}><Icon name="download" size={14} className="mr-1"/>Traer nube</Btn>
        </div>
        <div className="bg-blue-50 rounded-xl p-3 text-xs text-blue-700">
          Usa tu PC en modo <b>Principal</b> para capturar y cerrar caja. Deja los teléfonos en modo <b>Espejo</b> para recibir cambios sin meter conflictos raros.
        </div>
        {syncMsg&&<div role="status" className={`rounded-xl p-3 text-sm font-bold ${syncMsg.kind==='ok'?'bg-green-50 text-green-700':syncMsg.kind==='err'?'bg-red-50 text-red-600':'bg-yellow-50 text-yellow-700'}`}><Icon name={syncMsg.kind==='ok'?'check':syncMsg.kind==='err'?'alert':'info'} size={14} className="mr-1.5"/>{syncMsg.text}</div>}
      </div>
    </div>

    <div className="bg-white rounded-3xl p-4 shadow-sm border border-gray-100">
      <div className="flex items-center justify-between mb-3">
        <h3 className="font-black text-gray-800 text-sm"><Icon name="lifebuoy" size={15} className="mr-1"/>Backups locales</h3>
        <button onClick={refreshBackups} className="text-xs font-bold text-orange-500">Actualizar</button>
      </div>
      <div className="space-y-2">
        {!backups.length&&<p className="text-xs text-gray-400">Aún no hay snapshots guardados.</p>}
        {backups.slice(0,6).map(b=>(
          <div key={b.key} className="flex items-center justify-between rounded-2xl bg-gray-50 p-3">
            <div>
              <p className="text-sm font-bold text-gray-700">{fmtDateTime(b.ts)}</p>
              <p className="text-[11px] text-gray-400">{b.state?.jornadaActiva?'Con jornada activa':'Sin jornada activa'} · {(b.state?.jornadas||[]).length} jornadas</p>
            </div>
            <Btn size="sm" color="gray" onClick={()=>setConfirmRestore(b.ts)}>Restaurar</Btn>
          </div>
        ))}
      </div>
    </div>
    <div className="bg-white rounded-3xl p-4 shadow-sm border border-gray-100">
      <div className="flex items-center justify-between mb-3">
        <h3 className="font-black text-gray-800 text-sm"><Icon name="search" size={15} className="mr-1"/>Auditoría histórica</h3>
        <button onClick={runAudit} className="text-xs font-bold text-orange-500">Analizar</button>
      </div>
      <div className="space-y-3">
        <p className="text-xs text-gray-500">Revisa y corrige ventas duplicadas históricas y diferencias de caja calculadas con la fórmula anterior.</p>
        <div className="grid grid-cols-2 gap-2">
          <Btn size="sm" color="gray" onClick={runAudit}><Icon name="search" size={14} className="mr-1"/>Auditar</Btn>
          <Btn size="sm" color="orange" onClick={runRepair}><Icon name="wrench" size={14} className="mr-1"/>Reparar</Btn>
        </div>
        {repairMsg&&<div role="status" className={`rounded-xl p-3 text-sm font-bold ${repairMsg.kind==='ok'?'bg-green-50 text-green-700':'bg-blue-50 text-blue-700'}`}><Icon name={repairMsg.kind==='ok'?'check':'info'} size={14} className="mr-1.5"/>{repairMsg.text}</div>}
        {auditReport&&<div className="rounded-2xl bg-gray-50 p-3 space-y-2">
          <div className="grid grid-cols-2 gap-2 text-xs">
            <div className="rounded-xl bg-white p-2"><p className="text-gray-400">Jornadas</p><p className="font-black text-gray-700">{auditReport.summary.jornadas}</p></div>
            <div className="rounded-xl bg-white p-2"><p className="text-gray-400">Estado</p><p className={`font-black ${auditReport.ok?'text-green-600':'text-red-500'}`}>{auditReport.ok?'OK':'Con hallazgos'}</p></div>
            <div className="rounded-xl bg-white p-2"><p className="text-gray-400">Ventas duplicadas</p><p className="font-black text-gray-700">{auditReport.summary.duplicateOriginalVentas}</p></div>
            <div className="rounded-xl bg-white p-2"><p className="text-gray-400">Reversas duplicadas</p><p className="font-black text-gray-700">{auditReport.summary.duplicateActiveReversals}</p></div>
            <div className="rounded-xl bg-white p-2"><p className="text-gray-400">Reversas huérfanas</p><p className="font-black text-gray-700">{auditReport.summary.orphanReversals}</p></div>
          </div>
          <p className="text-[11px] text-gray-500">También disponible en consola como <b>kapulitsHistoricalAudit()</b> y <b>kapulitsRepairHistoricalData()</b>.</p>
          {!!auditReport.issues.length&&<div className="space-y-2 max-h-48 overflow-y-auto">
            {auditReport.issues.slice(0,8).map((issue,idx)=><div key={idx} className="rounded-xl bg-white p-2 text-[11px] text-gray-600">
              <p className="font-bold text-gray-800">{issue.fecha||'Sin fecha'} · {issue.type}</p>
              <p className="mt-1 break-words">{JSON.stringify(issue)}</p>
            </div>)}
            {auditReport.issues.length>8&&<p className="text-[11px] text-gray-400">Se muestran 8 de {auditReport.issues.length} hallazgos.</p>}
          </div>}
        </div>}
      </div>
    </div>
    <div className="bg-white rounded-3xl p-4 shadow-sm border border-gray-100">
      <div className="flex items-center justify-between mb-3">
        <h3 className="font-black text-gray-800 text-sm"><Icon name="briefcase" size={15} className="mr-1"/>Equipo</h3>
        <button onClick={()=>{setEditEmp(null);setEmpNombre('');setEmpRol('');setEmpSueldo('');setShowAddEmp(true);}}
          className="text-xs font-bold text-orange-500 bg-orange-50 px-3 py-1 rounded-lg border border-orange-200">+ Agregar</button>
      </div>
      {state.empleados.map(e=>(<div key={e.id} className="flex items-center justify-between py-3 border-b border-gray-50 last:border-0">
        <div className="flex-1"><p className="font-bold text-sm">{e.nombre}</p><p className="text-xs text-gray-400">{e.rol}</p></div>
        <p className={`font-black text-sm mr-3 ${e.sueldo>0?'text-orange-600':'text-gray-400'}`}>{e.sueldo>0?fmt(e.sueldo):'Socio'}</p>
        <div className="flex gap-1">
          <button onClick={()=>iniciarEdicion(e)} className="text-blue-500 bg-blue-50 w-9 h-9 flex items-center justify-center rounded-lg" aria-label={`Editar empleado ${e.nombre}`}><Icon name="edit" size={14}/></button>
          <button onClick={()=>setConfirmDelEmp(e)} className="text-red-400 bg-red-50 w-9 h-9 flex items-center justify-center rounded-lg" aria-label={`Eliminar empleado ${e.nombre}`}><Icon name="x" size={14}/></button>
        </div></div>))}
      <div className="mt-3 border-t pt-3 flex justify-between">
        <span className="font-bold text-sm">Total nomina/jornada</span>
        <span className="font-black text-orange-600">{fmt(state.empleados.reduce((s,e)=>s+e.sueldo,0))}</span></div>
      <div className="mt-2 bg-blue-50 rounded-xl p-2 text-[10px] text-blue-600">
        <Icon name="bulb" size={12} className="mr-1"/>La nomina se puede registrar manualmente desde la pestaña Gastos.</div>
    </div>

    <Modal open={showAddEmp} onClose={()=>{setShowAddEmp(false);setEditEmp(null);}} title={editEmp?'Editar empleado':'Agregar empleado'}>
      <div className="space-y-4">
        <Input label="Nombre completo" value={empNombre} onChange={setEmpNombre} placeholder="Nombre del empleado"/>
        <Input label="Rol / Puesto" value={empRol} onChange={setEmpRol} placeholder="Ej: Linea de Produccion"/>
        <Input label="Sueldo por jornada" type="number" prefix="$" value={empSueldo} onChange={setEmpSueldo} placeholder="0 = Socio"/>
        <Btn full color="green" onClick={guardarEmpleado} disabled={!empNombre}><Icon name={editEmp?'save':'plus'} size={15} className="mr-1.5"/>{editEmp?'Guardar cambios':'Agregar empleado'}</Btn>
      </div>
    </Modal>

    <Modal open={!!confirmDelEmp} onClose={()=>setConfirmDelEmp(null)} title="Eliminar empleado">
      {confirmDelEmp&&(<div className="space-y-4">
        <p className="text-sm text-center">Eliminar a <b>{confirmDelEmp.nombre}</b> del equipo?</p>
        <div className="flex gap-3"><Btn full color="gray" onClick={()=>setConfirmDelEmp(null)}>Cancelar</Btn>
          <Btn full color="red" onClick={()=>{onEliminarEmpleado(confirmDelEmp.id);setConfirmDelEmp(null);}}>Eliminar</Btn></div>
      </div>)}
    </Modal>

    <div className="bg-white rounded-3xl p-4 shadow-sm border border-gray-100">
      <div className="flex items-center justify-between mb-3">
        <h3 className="font-black text-gray-800 text-sm"><Icon name="pin" size={15} className="mr-1"/>Gastos fijos (mensuales)</h3>
      </div>
      {state.gastosFijos.map(g=>(<div key={g.id} className="flex items-center justify-between py-2 border-b border-gray-50 last:border-0">
        <span className="text-sm text-gray-700 flex-1">{g.nombre}</span>
        <div className="flex items-center gap-2">
          <div className="flex items-center border-2 border-gray-200 rounded-xl overflow-hidden">
            <span className="px-2 text-gray-400 text-sm">$</span>
            <input type="number" value={g.monto} onChange={e=>onActualizarGastoFijo(g.id,e.target.value)}
              className="w-20 py-1.5 text-sm font-bold text-right outline-none pr-2"/></div>
          <button onClick={()=>setConfirmDelGF(g)} className="text-red-300 hover:text-red-500 w-9 h-9 flex items-center justify-center" aria-label={`Eliminar gasto fijo ${g.nombre}`}><Icon name="x" size={14}/></button>
        </div></div>))}
      <div className="mt-3 flex gap-2">
        <input value={nuevoGF} onChange={e=>setNuevoGF(e.target.value)} placeholder="Agregar gasto fijo..."
          className="flex-1 px-3 py-2 text-sm border-2 border-gray-200 rounded-xl outline-none focus:border-orange-400"/>
        <button onClick={()=>{if(nuevoGF.trim()){onAgregarGastoFijo(nuevoGF.trim());setNuevoGF('');}}}
          disabled={!nuevoGF.trim()} className="px-3 py-2 bg-orange-500 text-white text-xs font-bold rounded-xl disabled:opacity-40">+ Agregar</button>
      </div>
      <div className="mt-3 border-t pt-3 flex justify-between">
        <span className="font-bold text-sm">Total fijos/mes</span>
        <span className="font-black text-red-500">{fmt(state.gastosFijos.reduce((s,g)=>s+g.monto,0))}</span></div>
      <div className="mt-2 bg-purple-50 rounded-xl p-2 text-[10px] text-purple-600">
        <Icon name="info" size={12} className="mr-1"/>Estos gastos son mensuales. Se prorratean por jornada en los reportes para calcular utilidad neta real.</div>
    </div>

    <Modal open={!!confirmDelGF} onClose={()=>setConfirmDelGF(null)} title="Eliminar gasto fijo">
      {confirmDelGF&&(<div className="space-y-4">
        <p className="text-sm text-center">Eliminar "<b>{confirmDelGF.nombre}</b>" de gastos fijos?</p>
        <div className="flex gap-3"><Btn full color="gray" onClick={()=>setConfirmDelGF(null)}>Cancelar</Btn>
          <Btn full color="red" onClick={()=>{onEliminarGastoFijo(confirmDelGF.id);setConfirmDelGF(null);}}>Eliminar</Btn></div>
      </div>)}
    </Modal>

    <Modal open={confirmPull} onClose={()=>setConfirmPull(false)} title="Reemplazar con nube">
      <div className="space-y-4">
        <p className="text-sm text-center">Esto reemplazará los datos locales de este dispositivo por la última copia guardada en la nube.</p>
        <div className="flex gap-3">
          <Btn full color="gray" onClick={()=>setConfirmPull(false)}>Cancelar</Btn>
          <Btn full color="orange" onClick={runPull}>Traer nube</Btn>
        </div>
      </div>
    </Modal>

    <Modal open={!!confirmRestore} onClose={()=>setConfirmRestore(null)} title="Restaurar backup">
      {confirmRestore&&(<div className="space-y-4">
        <p className="text-sm text-center">Se restaurará el snapshot local de <b>{fmtDateTime(confirmRestore)}</b>.</p>
        <div className="flex gap-3">
          <Btn full color="gray" onClick={()=>setConfirmRestore(null)}>Cancelar</Btn>
          <Btn full color="green" onClick={()=>runRestore(confirmRestore)}>Restaurar</Btn>
        </div>
      </div>)}
    </Modal>

    <div className="bg-gray-50 rounded-2xl p-4 text-xs text-gray-500 text-center">
      <p className="font-bold text-sm">K'apul'Its v{APP_VERSION}</p>
      <p>{NEGOCIO.direccion}</p>
      <p>Tel.: {NEGOCIO.telefono}</p></div>
    <div className="bg-gradient-to-br from-gray-800 to-gray-900 rounded-2xl p-5 text-white text-center">
      <p className="text-[10px] uppercase tracking-widest text-gray-400 mb-2">Desarrollado por</p>
      <p className="font-black text-base">Aurelio Ocampo Cortez</p>
      <p className="text-gray-400 text-xs mt-1">Desarrollo de software & soluciones digitales para negocios</p>
      <p className="text-gray-400 text-xs mt-0.5">Apps PWA · Automatizacion · Inteligencia de datos · IA aplicada</p>
      <div className="mt-3 pt-3 border-t border-gray-700 space-y-1">
        <p className="text-xs"><Icon name="phone" size={12} className="mr-1"/><a href="https://wa.me/529821057758" className="text-orange-400 font-bold">982 105 77 58</a></p>
        <p className="text-[10px] text-gray-500">Convierte tu idea en una app. Preguntame como.</p>
      </div>
    </div>
  </div>);
}

// ── Importar Tab ──
function ImportarTab({onImportarProductos,onImportarCostos,productos,costos}){
  const [status,setStatus]=useState(null);const fileRef=useRef(null);const [importType,setImportType]=useState(null);

  const handleFile=async(e)=>{
    const file=e.target.files[0];if(!file)return;
    setStatus({kind:'info',text:'Leyendo archivo...'});
    try{
      const data=await file.arrayBuffer();
      const wb=XLSX.read(data);
      const ws=wb.Sheets[wb.SheetNames[0]];
      const json=XLSX.utils.sheet_to_json(ws);
      if(!json.length){setStatus({kind:'err',text:'El archivo esta vacio'});return;}

      if(importType==='menu'){
        const prods=json.map((r,i)=>({
          id:r.id||('prod_'+i),nombre:r.nombre||'',precio:Number(r.precio)||0,
          costo:Number(r.costo)||0,cat:r.categoria||'platillo',emoji:r.emoji||'🍽️',activo:r.activo!==false&&r.activo!=='no'
        })).filter(p=>p.nombre);
        if(prods.length){onImportarProductos(prods);setStatus({kind:'ok',text:`${prods.length} productos importados`});}
        else setStatus({kind:'err',text:'No se encontraron productos validos'});
      }else if(importType==='costos'){
        const cs=json.map((r,i)=>({
          id:r.id||('costo_'+i),nombre:r.nombre||'',unidad:r.unidad||'',
          pu:Number(r.precio_unitario||r.pu||r.precio)||0,cat:r.categoria||''
        })).filter(c=>c.nombre);
        if(cs.length){onImportarCostos(cs);setStatus({kind:'ok',text:`${cs.length} costos importados`});}
        else setStatus({kind:'err',text:'No se encontraron costos validos'});
      }
    }catch(e){setStatus({kind:'err',text:`Error: ${e.message}`});}
    if(fileRef.current)fileRef.current.value='';
  };

  const descargarPlantilla=(tipo)=>{
    let wb,ws,data;
    if(tipo==='menu'){
      data=[{id:'consome',nombre:'Consome',precio:115,costo:38,categoria:'platillo',emoji:'🍲',activo:'si'}];
      productos.forEach(p=>{ if(p.id!=='consome')data.push({id:p.id,nombre:p.nombre,precio:p.precio,costo:p.costo,categoria:p.cat,emoji:p.emoji,activo:p.activo?'si':'no'});});
    }else{
      data=costos.map(c=>({id:c.id,nombre:c.nombre,unidad:c.unidad,precio_unitario:c.pu,categoria:c.cat}));
    }
    wb=XLSX.utils.book_new();ws=XLSX.utils.json_to_sheet(data);
    XLSX.utils.book_append_sheet(wb,ws,'Datos');
    XLSX.writeFile(wb,`plantilla_${tipo}.xlsx`);
  };
  // Respaldo completo para analisis: descarga TODO el estado (jornadas, pedidos,
  // ventas con hora, gastos) como JSON a la computadora. No solo vive en el
  // dispositivo: este archivo se puede guardar y compartir para analizar datos.
  const descargarDatos=()=>{
    const raw=localStorage.getItem('kapulits_v2')||'{}';
    const blob=new Blob([raw],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=`kapulits_datos_${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  };

  return(<div className="space-y-5">
    <div className="bg-orange-50 rounded-2xl p-4 text-sm text-orange-700">
      <p className="font-bold mb-2"><Icon name="download" size={14} className="mr-1"/>Dashboard de Importacion</p>
      <p className="text-xs opacity-70">Sube archivos Excel (.xlsx) para actualizar datos sin necesidad de modificar codigo.</p>
    </div>
    <div className="bg-white rounded-3xl p-5 shadow-sm border border-gray-100">
      <h3 className="font-black text-gray-800 mb-4 text-sm"><Icon name="bowl" size={15} className="mr-1"/>Menu y Precios</h3>
      <p className="text-xs text-gray-500 mb-3">Actualiza los productos del menu, precios y costos estimados.</p>
      <div className="flex gap-2 mb-3">
        <Btn size="sm" color="gray" onClick={()=>descargarPlantilla('menu')}><Icon name="file" size={13} className="mr-1"/>Descargar</Btn>
        <Btn size="sm" color="orange" onClick={()=>{setImportType('menu');fileRef.current?.click();}}><Icon name="upload" size={13} className="mr-1"/>Subir Excel</Btn>
      </div>
      <p className="text-xs text-gray-400">Columnas: id · nombre · precio · costo · categoria · emoji · activo</p>
    </div>
    <div className="bg-white rounded-3xl p-5 shadow-sm border border-gray-100">
      <h3 className="font-black text-gray-800 mb-4 text-sm"><Icon name="receipt" size={15} className="mr-1"/>Base de Costos (Ingredientes)</h3>
      <p className="text-xs text-gray-500 mb-3">Actualiza la base de datos de costos de insumos.</p>
      <div className="flex gap-2 mb-3">
        <Btn size="sm" color="gray" onClick={()=>descargarPlantilla('costos')}><Icon name="file" size={13} className="mr-1"/>Descargar</Btn>
        <Btn size="sm" color="orange" onClick={()=>{setImportType('costos');fileRef.current?.click();}}><Icon name="upload" size={13} className="mr-1"/>Subir Excel</Btn>
      </div>
      <p className="text-xs text-gray-400">Columnas: id · nombre · unidad · precio_unitario · categoria</p>
    </div>
    <div className="bg-white rounded-3xl p-5 shadow-sm border border-gray-100">
      <h3 className="font-black text-gray-800 mb-1 text-sm"><Icon name="save" size={15} className="mr-1"/>Datos para análisis</h3>
      <p className="text-xs text-gray-500 mb-3">Descarga TODO tu historial (jornadas, pedidos con hora, ventas y gastos) en un archivo a tu computadora. Sirve para respaldo y para analizar qué días/horas vendes más y cuánta carne comprar. Tus datos también se sincronizan en la nube.</p>
      <Btn size="sm" color="green" onClick={descargarDatos}><Icon name="download" size={13} className="mr-1"/>Descargar mis datos (JSON)</Btn>
    </div>
    <input ref={fileRef} type="file" accept=".xlsx,.xls,.csv" onChange={handleFile} className="hidden"/>
    {status&&<div role="status" className={`rounded-2xl p-4 text-sm font-bold text-center ${status.kind==='ok'?'bg-green-50 text-green-700':status.kind==='err'?'bg-red-50 text-red-600':'bg-blue-50 text-blue-700'}`}><Icon name={status.kind==='ok'?'check':status.kind==='err'?'alert':'info'} size={14} className="mr-1.5"/>{status.text}</div>}
  </div>);
}

function ImpresoraTab({impresora,onActualizar}){
  const [status,setStatus]=useState(null);const hasBT='bluetooth' in navigator;const hasUSB='usb' in navigator;
  const conectarBT=async()=>{setStatus({kind:'info',text:'Buscando BT...'});const r=await connectBluetooth();
    if(r.success){onActualizar({tipo:'bluetooth',nombre:r.name,conectada:true});setStatus({kind:'ok',text:r.name});}
    else setStatus({kind:'err',text:r.error});};
  const conectarUSB=async()=>{setStatus({kind:'info',text:'Buscando USB...'});const r=await connectUSB();
    if(r.success){onActualizar({tipo:'usb',nombre:r.name,conectada:true});setStatus({kind:'ok',text:r.name});}
    else setStatus({kind:'err',text:r.error});};
  const testPrint=async()=>{
    const p={numero:0,fecha:localISODate(),hora:new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'}),
      tipoEntrega:'recoger',cliente:'PRUEBA',direccion:'',notas:'Ticket de prueba',totalProductos:100,costoEnvio:0,total:100,
      items:[{productoId:'test',nombre:'Producto prueba',cantidad:1,precio:100,subtotal:100,emoji:'🧪'}]};
    const r=await printTicket(p);setStatus(r.success?{kind:'ok',text:`Impreso (${r.method})`}:{kind:'err',text:'Error'});};
  return(<div className="space-y-5">
    <div className="bg-white rounded-3xl p-5 shadow-sm border border-gray-100">
      <h3 className="font-black text-gray-800 mb-4 text-sm"><Icon name="printer" size={15} className="mr-1"/>Impresora de tickets</h3>
      <div className="space-y-4">
        <div className={`rounded-2xl p-4 border-2 ${impresora.conectada?'border-green-300 bg-green-50':impresora.reconectando?'border-yellow-300 bg-yellow-50':'border-gray-200 bg-gray-50'}`}>
          <div className="flex items-center gap-3">
            <span className={`w-4 h-4 rounded-full shrink-0 ${impresora.conectada?'bg-green-500':impresora.reconectando?'bg-yellow-400 pulse-dot':'bg-gray-300'}`} role="img" aria-label={impresora.conectada?'Conectada':impresora.reconectando?'Reconectando':'Sin conexion'}/>
            <div><p className="font-bold text-sm">{impresora.conectada?impresora.nombre:impresora.reconectando?'Reconectando...':'Sin impresora'}</p>
              <p className="text-xs text-gray-500">{impresora.conectada?`${impresora.tipo} · Se mantiene activa`:impresora.reconectando?'Intentando recuperar la impresora':'Conecta una para imprimir tickets'}</p></div></div></div>
        {hasUSB&&<Btn full onClick={conectarUSB}><Icon name="zap" size={15} className="mr-1.5"/>Conectar USB</Btn>}
        {hasBT&&<Btn full color="gray" onClick={conectarBT}><Icon name="bluetooth" size={15} className="mr-1.5"/>Conectar Bluetooth</Btn>}
        {!hasBT&&!hasUSB&&<div className="bg-yellow-50 rounded-xl p-3 text-sm text-yellow-700">
          <p className="font-bold"><Icon name="alert" size={14} className="mr-1"/>Sin conexion directa</p>
          <p className="text-xs mt-1">Los tickets se imprimiran como vista previa.</p></div>}
        <Btn full color="gray" onClick={testPrint}><Icon name="printer" size={15} className="mr-1.5"/>Ticket de prueba</Btn>
        <div className="flex items-center justify-between">
          <div><p className="text-sm font-bold">Auto-imprimir</p><p className="text-xs text-gray-400">Al crear pedido</p></div>
          <button onClick={()=>onActualizar({autoImprimir:!impresora.autoImprimir})} role="switch" aria-checked={impresora.autoImprimir} aria-label="Auto-imprimir al crear pedido"
            className={`w-12 h-6 rounded-full transition-colors duration-150 ${impresora.autoImprimir?'bg-green-500':'bg-gray-300'} relative`}>
            <span className={`absolute top-0.5 w-5 h-5 bg-white rounded-full shadow transition-all duration-150 ${impresora.autoImprimir?'right-0.5':'left-0.5'}`}/></button></div>
        {status&&<p role="status" className={`text-center text-sm font-bold ${status.kind==='ok'?'text-green-700':status.kind==='err'?'text-red-600':'text-gray-600'}`}><Icon name={status.kind==='ok'?'check':status.kind==='err'?'alert':'info'} size={14} className="mr-1"/>{status.text}</p>}
      </div></div>
  </div>);
}

function EditProductoForm({producto,onSave}){
  const [precio,setPrecio]=useState(producto.precio);const [costo,setCosto]=useState(producto.costo);
  const margen=precio>0?(((precio-costo)/precio)*100).toFixed(1):0;
  return(<div className="space-y-4">
    <Input label="Precio de venta" type="number" prefix="$" value={precio} onChange={v=>setPrecio(Number(v))}/>
    <Input label="Costo estimado" type="number" prefix="$" value={costo} onChange={v=>setCosto(Number(v))}/>
    <div className={`rounded-xl p-3 text-center font-bold ${margen>=40?'bg-green-50 text-green-700':margen>=20?'bg-yellow-50 text-yellow-700':'bg-red-50 text-red-600'}`}>
      Margen: {margen}% <Icon name={margen>=40?'check':'alert'} size={14} className="ml-1"/></div>
    <Btn full onClick={()=>onSave({precio,costo})}>Guardar</Btn></div>);
}
function ProductoForm({onSave}){
  const [nombre,setNombre]=useState('');
  const [precio,setPrecio]=useState('');
  const [costo,setCosto]=useState('');
  const [cat,setCat]=useState('platillo');
  const [emoji,setEmoji]=useState('🍽️');
  const sugerencias=['🍽️','🥑','🌮','🫓','🧀','🥙','🫔','🥪','🍜','🎉','🌟','🥤','🍹','🥛','🍲'];
  const canSave=nombre.trim()&&Number(precio)>0;
  return(<div className="space-y-4">
    <Input label="Nombre del producto" value={nombre} onChange={setNombre} placeholder="Ej: Guacamole"/>
    <div className="grid grid-cols-2 gap-3">
      <Input label="Precio de venta" type="number" prefix="$" value={precio} onChange={setPrecio} placeholder="0"/>
      <Input label="Costo estimado" type="number" prefix="$" value={costo} onChange={setCosto} placeholder="Opcional"/>
    </div>
    <div className="flex flex-col gap-1">
      <label className="text-[11px] font-bold text-[var(--text-muted)] uppercase tracking-[0.14em]">Categoria</label>
      <select value={cat} onChange={e=>setCat(e.target.value)}
        className="w-full px-4 py-3.5 text-[15px] outline-none bg-[rgba(255,250,244,.9)] text-[var(--text)] border border-[rgba(221,192,161,.7)] rounded-[18px] focus:border-[var(--brand)]">
        <option value="platillo">Platillo</option>
        <option value="combo">Combo</option>
        <option value="bebida">Bebida</option>
      </select>
    </div>
    <div className="space-y-2">
      <Input label="Emoji" value={emoji} onChange={setEmoji} placeholder="Ej: 🥑"/>
      <div className="rounded-[18px] border border-[rgba(221,192,161,.55)] bg-[rgba(255,250,244,.82)] p-3">
        <p className="text-[11px] font-bold text-[var(--text-muted)] uppercase tracking-[0.14em] mb-2">Sugerencias rapidas</p>
        <div className="flex flex-wrap gap-2">
          {sugerencias.map(icon=><button key={icon} type="button" onClick={()=>setEmoji(icon)}
            className={`w-11 h-11 rounded-2xl border text-xl transition-all ${emoji===icon?'border-[var(--brand)] bg-[rgba(242,191,90,.18)] scale-105':'border-[rgba(221,192,161,.55)] bg-white'}`}>{icon}</button>)}
        </div>
      </div>
    </div>
    <div className="surface-card flex items-center justify-between gap-3">
      <div className="flex items-center gap-3 min-w-0">
        <span className="text-3xl shrink-0">{emoji||'🍽️'}</span>
        <div className="min-w-0">
          <p className="font-bold text-sm text-[#2f1d17] truncate">{nombre.trim()||'Nuevo producto'}</p>
          <p className="text-xs text-[#7a6255]">{fmt(Number(precio)||0)} · {cat}</p>
        </div>
      </div>
      <Badge color="green">Activo</Badge>
    </div>
    <Btn full color="green" disabled={!canSave} onClick={()=>onSave({
      nombre:nombre.trim(),
      precio:Number(precio)||0,
      costo:Number(costo)||0,
      cat,
      emoji:(emoji||'🍽️').trim()||'🍽️',
      activo:true
    })}>Guardar producto</Btn>
  </div>);
}

// ─── APP ────────────────────────────────────────────────────────────
// Global callbacks (preview fallback y toast desde funciones fuera de React)
let _showTicketPreview=null;
let _showToast=null;

function App(){
  const [page,_setPage]=useState('dashboard');
  const setPage=useCallback(p=>{_setPage(p);window.scrollTo(0,0);},[]);
  const {state,syncStatus,remoteNotice,cloudRecovery,setCloudRecovery,lastCloudAt,deviceInfo,saveError,abrirJornada,cerrarJornada,crearPedido,actualizarPedido,
    registrarAjusteCaja,eliminarAjusteCaja,registrarPagoRepartidor,pagarRepartidoresPendientes,
    registrarGasto,eliminarGasto,actualizarGasto,agregarProducto,actualizarProducto,actualizarGastoFijo,agregarGastoFijo,eliminarGastoFijo,
    actualizarImpresora,importarProductos,importarCostos,agregarEmpleado,editarEmpleado,eliminarEmpleado,
    guardarCliente,eliminarCliente,eliminarClientes,
    syncNow,pullFromCloud,setDeviceRole,listBackups,restoreBackup,auditHistoricalData,repairHistoricalData}=useStore();
  const hasJornada=!!state.jornadaActiva;
  const pedidosNuevos=state.jornadaActiva?(state.jornadaActiva.pedidos||[]).filter(p=>p.estado==='nuevo').length:0;
  const [toast,setToast]=useState(null);
  const [previewPedido,setPreviewPedido]=useState(null);
  const showToast=(msg,color='green')=>{setToast({msg,color});setTimeout(()=>setToast(null),2500);};
  // Register global preview + toast callbacks
  useEffect(()=>{_showTicketPreview=(pedido)=>setPreviewPedido(pedido);_showToast=showToast;return()=>{_showTicketPreview=null;_showToast=null;};},[]);
  // Auto-conectar impresora al arrancar (BT o USB)
  useEffect(()=>{
    _onPrinterStateChange=(s)=>{actualizarImpresora({conectada:!!s.conectada,reconectando:!!s.reconectando});};
    if(state.impresora?.tipo==='bluetooth'&&state.impresora?.nombre){
      tryAutoConnectPrinter().then(ok=>{
        if(ok)actualizarImpresora({conectada:true,reconectando:false});
      });
    }
    if(state.impresora?.tipo==='usb'){
      tryAutoConnectUSB().then(ok=>{
        if(ok)actualizarImpresora({conectada:true,reconectando:false});
      });
    }
    return()=>{_onPrinterStateChange=null;};
  },[]);
  return(<div className="relative min-h-screen">
    {page==='dashboard'&&<DashboardPage state={state} syncStatus={syncStatus}
      onAbrir={(f,d)=>{abrirJornada(f,d);showToast('Jornada abierta');}}
      onCerrar={(e,o)=>{cerrarJornada(e,o);showToast('Jornada cerrada','red');}}
      onRegistrarAjuste={(a)=>{registrarAjusteCaja(a);showToast(a.tipo==='entrada'?'Entrada de caja registrada':'Salida de caja registrada','orange');}}
      onEliminarAjuste={eliminarAjusteCaja}
      onPagarRepartidor={registrarPagoRepartidor}
      onPagarTodosRepartidores={()=>{pagarRepartidoresPendientes();showToast('Repartidores pagados desde caja','orange');}}/>}
    {page==='pedidos'&&<PedidosPage state={state}
      onCrearPedido={(i,t,c,dir,n,tel,et)=>{const p=crearPedido(i,t,c,dir,n,tel,et);showToast(`Pedido #${String(p?.numero||0).padStart(3,'0')} creado`);return p;}}
      onActualizarPedido={(id,c)=>{actualizarPedido(id,c);
        if(c.cobrado)showToast('Cobrado','green');
        else if(c.estado==='entregado')showToast('Entregado','green');
        else if(c.estado==='cancelado')showToast('Pedido cancelado','red');
        else if(c.items||c.tipoEntrega||c.metodoPago)showToast('Pedido editado','orange');}}/>}
    {page==='gastos'&&<GastosPage state={state}
      onRegistrar={(c,d,m,e)=>{registrarGasto(c,d,m,e);showToast('Gasto registrado','orange');}}
      onEliminar={eliminarGasto}
      onActualizar={(id,c)=>{actualizarGasto(id,c);showToast('Gasto actualizado','orange');}}/>}
    {page==='reportes'&&<ReportesPage state={state}/>}
    {page==='admin'&&<AdminPage state={state} onAgregarProducto={d=>{agregarProducto(d);showToast('Producto agregado');}} onActualizarProducto={actualizarProducto}
      onActualizarGastoFijo={actualizarGastoFijo} onAgregarGastoFijo={n=>{agregarGastoFijo(n);showToast('Gasto fijo agregado');}}
      onEliminarGastoFijo={id=>{eliminarGastoFijo(id);showToast('Gasto fijo eliminado','red');}}
      onActualizarImpresora={actualizarImpresora}
      onImportarProductos={p=>{importarProductos(p);showToast('Productos actualizados');}}
      onImportarCostos={c=>{importarCostos(c);showToast('Costos actualizados');}}
      onAgregarEmpleado={(n,r,s)=>{agregarEmpleado(n,r,s);showToast('Empleado agregado');}}
      onEditarEmpleado={(id,d)=>{editarEmpleado(id,d);showToast('Empleado actualizado');}}
      onEliminarEmpleado={id=>{eliminarEmpleado(id);showToast('Empleado eliminado','red');}}
      onGuardarCliente={(id,d)=>{guardarCliente(id,d);showToast(id?'Cliente actualizado':'Cliente agregado');}}
      onEliminarCliente={id=>{eliminarCliente(id);showToast('Cliente eliminado','red');}}
      onEliminarClientes={ids=>{eliminarClientes(ids);showToast(`${ids.length} clientes depurados`,'red');}}
      syncStatus={syncStatus} lastCloudAt={lastCloudAt} deviceInfo={deviceInfo}
      onSyncNow={async()=>{const r=await syncNow();showToast(r.ok?'Cambios enviados':'Sync fallo',r.ok?'green':'red');return r;}}
      onPullFromCloud={pullFromCloud} onSetDeviceRole={role=>{setDeviceRole(role);showToast(role==='primary'?'Modo principal':'Modo espejo','orange');}}
      onListBackups={listBackups} onRestoreBackup={restoreBackup}
      onAuditHistoricalData={auditHistoricalData} onRepairHistoricalData={repairHistoricalData}/>}
    <BottomNav page={page} setPage={setPage} hasJornada={hasJornada} pedidosNuevos={pedidosNuevos}/>
    {saveError&&(<div role="alert" className="fixed top-14 left-1/2 -translate-x-1/2 z-50 px-5 py-3 rounded-2xl bg-red-600 text-white font-bold text-xs shadow-xl max-w-[90%] text-center">
      <Icon name="alert" size={13} className="mr-1"/>{saveError}</div>)}
    {toast&&(<div className={`fixed top-20 left-1/2 -translate-x-1/2 z-50 px-5 py-3 rounded-2xl text-white font-bold text-sm shadow-xl slide-up
      ${toast.color==='green'?'bg-green-500':toast.color==='red'?'bg-red-500':toast.color==='orange'?'bg-orange-500':'bg-gray-700'}`}>{toast.msg}</div>)}
    {remoteNotice&&!cloudRecovery&&(<div className="fixed top-32 left-1/2 -translate-x-1/2 z-50 px-5 py-3 rounded-2xl bg-blue-500 text-white font-bold text-sm shadow-xl slide-up">
      {remoteNotice}</div>)}
    {cloudRecovery&&(<div className="fixed top-16 left-1/2 -translate-x-1/2 z-50 w-[92%] max-w-md px-5 py-4 rounded-2xl bg-blue-600 text-white shadow-2xl slide-up" style={{border:'2px solid rgba(255,255,255,.3)'}}>
      <div className="font-black text-sm mb-1">Hay datos en la nube mas recientes</div>
      <div className="text-xs opacity-90 mb-3">Este navegador tiene datos vacios o desactualizados. Puedes restaurar la informacion desde la nube sin perder nada.</div>
      <div className="flex gap-2">
        <button onClick={async()=>{const r=await pullFromCloud();if(r.ok){setCloudRecovery(null);showToast('Datos restaurados desde la nube','green');}else{showToast('No se pudo restaurar','red');}}}
          className="flex-1 py-2 rounded-xl bg-white text-blue-700 font-bold text-sm active:scale-95 transition-transform">Restaurar desde nube</button>
        <button onClick={()=>setCloudRecovery(null)}
          className="px-4 py-2 rounded-xl bg-blue-500 text-white font-bold text-sm opacity-80 active:scale-95 transition-transform">Ignorar</button>
      </div>
    </div>)}
    <TicketPreviewModal open={!!previewPedido} pedido={previewPedido} onClose={()=>setPreviewPedido(null)}/>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
// Hide splash after render
function _hideSplash(){
  const s=document.getElementById('splash');
  if(!s||s.dataset.hidden)return;
  s.dataset.hidden='1';
  s.style.opacity='0';setTimeout(()=>s.remove(),500);
  document.body.classList.add('loaded');
  document.getElementById('root')?.classList.add('loaded');
}
setTimeout(_hideSplash,800);
</script>
<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(reg=>{
    setInterval(()=>{reg.update().catch(()=>{});},60000);
    reg.addEventListener('updatefound',()=>{
      const worker=reg.installing;
      if(!worker)return;
      worker.addEventListener('statechange',()=>{
        if(worker.state==='activated'&&navigator.serviceWorker.controller){
          location.reload();
        }
      });
    });
  }).catch(()=>{});
}
</script>
